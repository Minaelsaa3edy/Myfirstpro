<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><link rel="icon" href="data:,"><title>دخول</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--fg:#14202b;--mut:#5b6b79;--bd:#cfd8df;--ac:#0f6b57;--acf:#fff;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0e1419;--card:#172029;--fg:#e8eef3;--mut:#9aabb9;--bd:#2a3744;--ac:#2fb394;--acf:#06201a;--err:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:26px 22px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.ic{width:46px;height:46px;margin:0 auto 10px;color:var(--ac)}
h1{font-size:19px;margin:0 0 6px}
p{margin:0 0 14px;color:var(--mut);font-size:14px}
label{display:block;text-align:start;font-size:13px;color:var(--mut);margin:8px 0 6px}
input[type=text],input[type=password],textarea{width:100%;font:16px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);direction:ltr;text-align:left}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
.rm{display:flex;gap:8px;align-items:center;justify-content:flex-start;margin:12px 0;font-size:14px;color:var(--mut)}
.rm input{width:18px;height:18px;accent-color:var(--ac)}
button{width:100%;font-weight:700;font-size:16px;font-family:inherit;padding:14px;border:0;border-radius:10px;background:var(--ac);color:var(--acf);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--err);font-size:14px;min-height:22px;margin:10px 0 0}
</style></head><body>

const $ = s => document.querySelector(s), S = window.crypto && window.crypto.subtle;
const u8 = s => { s = String(s).replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
const b64u = u => { let s = ''; u.forEach(c => { s += String.fromCharCode(c); }); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const LS = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* blocked */ } }, del: k => { try { localStorage.removeItem(k); } catch (e) { /* blocked */ } } };
const CK = 'vault.' + D.vid;
const say = m => { $('#e').textContent = m || ''; };
const TXT = {
  gate: ['دخول', 'اكتب الكود الذي أرسله لك المصمم.'],
  dev: ['دخول المصمم', 'اكتب كلمة المرور.']
}[D.kind];
$('#t').textContent = TXT[0]; $('#s').textContent = TXT[1];

/* the page behind this gate: a developer page is one blob; the customer gate holds two (d = demo program, r = real program) and the code says which one it opens */
const blobOf = p => D.kind === 'dev' ? D : (D.b || {})[p];
async function decrypt(kb, p) { /* content key -> page html (throws when the key is wrong) */
  const bl = blobOf(p); if (!bl) throw new Error('kind');
  const key = await S.importKey('raw', kb, 'AES-GCM', false, ['decrypt']);
  return new TextDecoder().decode(await S.decrypt({ name: 'AES-GCM', iv: u8(bl.iv) }, key, u8(bl.ct)));
}
async function unwrap(secret, slot) { /* typed code / password -> what the slot protects */
  const mat = await S.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey']);
  const wk = await S.deriveKey({ name: 'PBKDF2', salt: u8(slot.s), iterations: slot.it, hash: 'SHA-256' }, mat, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return new Uint8Array(await S.decrypt({ name: 'AES-GCM', iv: u8(slot.iv) }, wk, u8(slot.c)));
}
/* JSONP: a plain <script> request, so it works from any page without CORS; used to ask the code server (D.srv) */
function jsonp(base, params, ms) {
  return new Promise((res, rej) => {
    const cb = '__j' + Math.random().toString(36).slice(2), s = document.createElement('script'); let done = false, t = 0;
    const end = (ok, v) => { if (done) return; done = true; clearTimeout(t); try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); ok ? res(v) : rej(v); };
    t = setTimeout(() => end(false, new Error('timeout')), ms || 9000);
    window[cb] = v => end(true, v); s.onerror = () => end(false, new Error('net'));
    s.src = base + (base.indexOf('?') < 0 ? '?' : '&') + new URLSearchParams(Object.assign({}, params, { cb, _: Date.now() })).toString();
    document.head.appendChild(s);
  });
}
function launch(html) { /* replace this page by the program; wait until this page has fully loaded, or the old head (and its styles) would stay behind */
  const go = () => { document.open(); document.write(html); document.close(); };
  if (document.readyState === 'complete') go(); else window.addEventListener('load', go, { once: true });
}
function hashParams() { try { return new URLSearchParams(location.hash.replace(/^#/, '')); } catch (e) { return new URLSearchParams(''); } }

async function open_(kb, p, remember) {
  const html = await decrypt(kb, p);
  if (remember) LS.set(CK, D.kind === 'dev' ? b64u(kb) : p + '.' + b64u(kb));
  launch(html);
}
async function byPass(pw, remember) {
  if (!pw || !D.pass) throw new Error('short');
  await open_(await unwrap(pw, D.pass), 'dev', remember);
}
/* the code (XXXX-XXXX-XXXX-XXXX): its first 4 letters pick a slot on the code server, the other 12 open it.
   The slot holds the signed code token, which program it is for (p: d demo / r real) and that program's key, so the code itself carries nothing readable. */
async function byCode(raw) {
  const c = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (c.length !== 16) throw new Error('short');
  if (!D.srv) throw new Error('net');
  let slot = null, reached = false;
  try { const r = await jsonp(D.srv, { a: 'slot', id: c.slice(0, 4) }, 10000); if (r && r.ok) { reached = true; slot = r.slot || null; } } catch (e) { /* server unreachable */ }
  if (!slot) throw new Error(reached ? 'unknown' : 'net');
  const o = JSON.parse(new TextDecoder().decode(await unwrap(c.slice(4), slot))); /* throws when the code is wrong */
  if (!blobOf(o.p)) throw new Error('unknown');
  history.replaceState(null, '', location.pathname + location.search + '#t=' + o.t);
  await open_(u8(o.k), o.p, true);
}
const codeMsg = e => e.message === 'net' ? 'تعذر الاتصال. تأكد من الإنترنت وحاول مرة أخرى.' : 'الكود غير صحيح، أو لم يُفعَّل بعد. لو أرسله لك المصمم الآن انتظر دقيقة وحاول مرة أخرى.';
function form() {
  const f = $('#f');
  if (D.kind === 'gate') {
    f.innerHTML = '<label for="i">الكود</label><textarea id="i" rows="2" spellcheck="false" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX-XXXX"></textarea><div style="height:12px"></div><button id="b" type="button">دخول</button>';
    const go = async () => {
      const v = $('#i').value, cm = /(?:^|[#&?\s])c=([A-Za-z0-9-]+)/.exec(v), c = (cm ? cm[1] : v).toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (c.length !== 16) return say('الكود غير مكتمل. اكتبه كاملاً كما أرسله المصمم.');
      const b = $('#b'); b.disabled = true; b.textContent = 'جارٍ التحقق…'; say('');
      try { await byCode(c); } catch (e) { b.disabled = false; b.textContent = 'دخول'; say(codeMsg(e)); $('#i').focus(); }
    };
    $('#b').onclick = go; $('#i').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
    $('#i').focus(); return;
  }
  f.innerHTML = '<label for="i">كلمة المرور</label><input id="i" type="password" autocomplete="off" spellcheck="false"><label class="rm"><input type="checkbox" id="r"><span>تذكر هذا الجهاز</span></label><button id="b" type="button">دخول</button>';
  const go = async () => {
    const v = $('#i').value; if (!v.trim()) return;
    const b = $('#b'); b.disabled = true; b.textContent = 'جارٍ التحقق…'; say('');
    try { await byPass(v, $('#r').checked); }
    catch (e) { b.disabled = false; b.textContent = 'دخول'; say('كلمة المرور غير صحيحة.'); $('#i').focus(); }
  };
  $('#b').onclick = go; $('#i').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#i').focus();
}

(async function start() {
  if (!S) { $('#f').innerHTML = ''; return say('افتح هذه الصفحة من رابط https في متصفح حديث.'); }
  const P = hashParams();
  if (D.kind === 'gate' && P.get('c')) { /* a code typed on the card inside the program (or sent as a link) wins over what this device remembers */
    say('جارٍ التحقق من الكود…');
    try { await byCode(P.get('c')); return; } catch (e) { say(codeMsg(e)); return form(); }
  }
  const ck = LS.get(CK);
  if (ck) {
    try {
      if (D.kind === 'dev') await open_(u8(ck), 'dev', false);
      else { const i = ck.indexOf('.'); await open_(u8(ck.slice(i + 1)), ck.slice(0, i), false); }
      return;
    } catch (e) { LS.del(CK); }
  }
  form();
})();
})();
