<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060a22"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><link rel="icon" href="data:,"><title>دخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#060a22;color:#fff;font:16px/1.7 "Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
button,input{font-family:inherit}
/* ---------- Animated dusk scene + glass code card (host gate and the in-app lock card). Shares the app's palette: blue #0b57d0 / sky #2f7de1, amber #e0912a, orange #f26a2e. ---------- */
.gx-scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #060a22; direction: ltr; animation: gxScene 1.6s ease both; pointer-events: none; }
.gx-scene .gx-l { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.gx-far, .gx-mid, .gx-near, .gx-shim, .gx-sun { transform-origin: 50% 100%; will-change: transform; }
.gx-far { animation: gxDriftA 42s ease-in-out infinite alternate; }
.gx-mid { animation: gxDriftB 34s ease-in-out infinite alternate; }
.gx-near { animation: gxDriftA 26s ease-in-out infinite alternate-reverse; }
.gx-sun { animation: gxSun 11s ease-in-out infinite alternate; }
.gx-sa { animation: gxTw 5.5s ease-in-out infinite alternate; }
.gx-sb { animation: gxTw 7s ease-in-out -3s infinite alternate-reverse; }
.gx-t0 { animation: gxTw 3.2s ease-in-out infinite alternate; } .gx-t1 { animation: gxTw 4.4s ease-in-out -1.5s infinite alternate; } .gx-t2 { animation: gxTw 2.6s ease-in-out -.8s infinite alternate; }
.gx-bar { animation: gxBar 14s ease-in-out infinite alternate; } .gx-b1 { animation-duration: 18s; } .gx-b2 { animation-duration: 11s; animation-direction: alternate-reverse; } .gx-b3 { animation-duration: 22s; animation-direction: alternate-reverse; }
.gx-win { animation: gxFlick 6s ease-in-out infinite alternate; }
.gx-sw { transform-box: fill-box; transform-origin: 50% 100%; animation: gxSway 7s ease-in-out infinite alternate; } .gx-sw2 { animation-duration: 9s; animation-direction: alternate-reverse; }
.gx-clouds { position: absolute; left: 0; right: 0; top: 0; height: 64%; overflow: hidden; }
.gx-cl { position: absolute; left: 0; display: block; border-radius: 50%; animation: gxCloud linear infinite; will-change: transform; }
.gx-ca { background: radial-gradient(closest-side, rgba(255,184,130,.62), rgba(255,140,120,.22) 58%, transparent 76%); }
.gx-cb { background: radial-gradient(closest-side, rgba(180,150,255,.5), rgba(120,100,210,.18) 58%, transparent 76%); }
.gx-cc { background: radial-gradient(closest-side, rgba(255,214,170,.5), rgba(255,160,130,.18) 58%, transparent 76%); }
.gx-flies { position: absolute; inset: 0; }
.gx-ff { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #ffe2a0; box-shadow: 0 0 10px 3px rgba(255,200,120,.65); opacity: 0; animation: gxFly ease-in-out infinite; will-change: transform, opacity; }
.gx-f1 { background: #bcd0ff; box-shadow: 0 0 10px 3px rgba(150,180,255,.6); } .gx-f2 { width: 3px; height: 3px; }
.gx-vig { position: absolute; inset: 0; background: radial-gradient(125% 95% at 50% 46%, transparent 52%, rgba(4,8,32,.58) 100%); }
.gx-flash { position: absolute; inset: 0; background: #f4f6fa; opacity: 0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .gx-flash { background: #0e131c; } }

/* the glass card */
.gx-wrap { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px 16px 56px; }
.gx-card { position: relative; isolation: isolate; width: min(100%, 430px); padding: 30px 26px 26px; border-radius: 30px; color: #fff; text-align: center; overflow: hidden;
  font-family: var(--gx-font, "Cairo", Tahoma, "Segoe UI", system-ui, sans-serif); box-sizing: border-box;
  background: linear-gradient(155deg, rgba(255,255,255,.22), rgba(255,255,255,.07) 46%, rgba(16,26,84,.26));
  border: 1px solid rgba(255,255,255,.32);
  box-shadow: 0 34px 80px -22px rgba(5,9,40,.7), inset 0 1px 0 rgba(255,255,255,.5), inset 0 -1px 0 rgba(255,255,255,.08);
  -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%);
  animation: gxRise 1s cubic-bezier(.2,.8,.2,1) .25s both; }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .gx-card { background: rgba(22,34,100,.86); } }
.gx-card::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: radial-gradient(120% 70% at 50% -10%, rgba(255,255,255,.26), transparent 60%); }
.gx-card::after { content: ""; position: absolute; top: -20%; bottom: -20%; width: 38%; left: -60%; z-index: -1; background: linear-gradient(100deg, transparent, rgba(255,255,255,.2), transparent); transform: skewX(-18deg); animation: gxSheen 8s ease-in-out 1.6s infinite; }
.gx-card > * { animation: gxItem .7s cubic-bezier(.2,.8,.2,1) both; }
.gx-card > :nth-child(1) { animation-delay: .5s; } .gx-card > :nth-child(2) { animation-delay: .6s; } .gx-card > :nth-child(3) { animation-delay: .7s; } .gx-card > :nth-child(4) { animation-delay: .8s; } .gx-card > :nth-child(5) { animation-delay: .9s; } .gx-card > :nth-child(6) { animation-delay: 1s; } .gx-card > :nth-child(7) { animation-delay: 1.1s; }
.gx-card.gx-wide { width: min(100%, 460px); }
.gx-card h1 { margin: 2px 0 6px; font-size: 24px; font-weight: 800; line-height: 1.4; color: #fff; text-shadow: 0 1px 14px rgba(8,14,60,.45); }
.gx-card p { margin: 0 0 18px; font-size: 14px; line-height: 1.9; font-weight: 500; color: rgba(255,255,255,.86); }
.gx-card p.gx-s { margin: 14px 0 0; font-size: 12.5px; color: rgba(255,255,255,.7); }
.gx-mark { width: 78px; height: 78px; margin: 0 auto 14px; border-radius: 26px; display: grid; place-items: center; background: linear-gradient(145deg, rgba(255,255,255,.34), rgba(255,255,255,.08)); border: 1px solid rgba(255,255,255,.4); box-shadow: 0 14px 34px -10px rgba(8,16,70,.6), inset 0 1px 0 rgba(255,255,255,.5); }
.gx-mark svg { width: 52px; height: 52px; overflow: visible; }
.gx-mark .gx-bk { transform-box: fill-box; transform-origin: center; animation: gxBrick .7s cubic-bezier(.2,1.3,.4,1) both; }
.gx-mark .gx-bk:nth-child(1) { animation-delay: .75s; } .gx-mark .gx-bk:nth-child(2) { animation-delay: .85s; } .gx-mark .gx-bk:nth-child(3) { animation-delay: .95s; } .gx-mark .gx-bk:nth-child(4) { animation-delay: 1.05s; } .gx-mark .gx-bk:nth-child(5) { animation-delay: 1.15s; } .gx-mark .gx-bk:nth-child(6) { animation-delay: 1.25s; } .gx-mark .gx-bk:nth-child(7) { animation-delay: 1.35s; }
.gx-mark .gx-acc { animation: gxBrick .7s cubic-bezier(.2,1.3,.4,1) 1.05s both, gxGlowB 3.6s ease-in-out 2s infinite alternate; }

.gx-field { display: flex; align-items: center; gap: 10px; height: 58px; padding: 0 18px; border-radius: 999px; background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.34); transition: border-color .2s, background .2s, box-shadow .2s; }
.gx-field:focus-within { border-color: rgba(255,255,255,.8); background: rgba(255,255,255,.2); box-shadow: 0 0 0 4px rgba(127,169,255,.3); }
.gx-field > svg { flex: none; width: 21px; height: 21px; color: rgba(255,255,255,.85); }
.gx-field input, .gx-field textarea { flex: 1; min-width: 0; width: 100%; background: transparent; border: 0; outline: 0; color: #fff; font: 700 clamp(12.5px, 4.1vw, 18px)/1.2 ui-monospace, Menlo, Consolas, "Courier New", monospace; letter-spacing: .08em; text-align: center; direction: ltr; padding: 0; margin: 0; box-shadow: none; }
.gx-field input::placeholder, .gx-field textarea::placeholder { color: rgba(255,255,255,.55); letter-spacing: .08em; font-weight: 600; }
.gx-field.gx-ta { height: auto; min-height: 92px; border-radius: 22px; padding: 12px 16px; align-items: stretch; }
.gx-field.gx-ta textarea { resize: none; font-size: 14px; line-height: 1.5; letter-spacing: .03em; text-align: start; }
.gx-eye { flex: none; width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: rgba(255,255,255,.85); display: grid; place-items: center; cursor: pointer; padding: 0; width: 34px; margin-inline: -6px; }
.gx-eye:hover { background: rgba(255,255,255,.14); } .gx-eye svg { width: 20px; height: 20px; }
.gx-rm { display: flex; align-items: center; gap: 9px; margin: 12px 4px 0; font-size: 13.5px; color: rgba(255,255,255,.86); cursor: pointer; user-select: none; text-align: start; }
.gx-rm input { width: 18px; height: 18px; accent-color: #2f7de1; margin: 0; }
.gx-gap { height: 14px; }

.gx-btn { position: relative; overflow: hidden; width: 100%; height: 58px; border: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; font: 800 17px/1 var(--gx-font, "Cairo", Tahoma, system-ui, sans-serif); color: #fff; letter-spacing: .01em;
  background: linear-gradient(100deg, #0b57d0 0%, #2f7de1 58%, #6f80ff 100%); box-shadow: 0 14px 32px -10px rgba(47,125,225,.85), inset 0 1px 0 rgba(255,255,255,.4); transition: transform .15s, filter .2s, box-shadow .2s; box-sizing: border-box; margin: 0; }
.gx-btn::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.38), transparent); transform: skewX(-20deg); animation: gxSheen 4.5s ease-in-out 2s infinite; }
.gx-btn:hover { transform: translateY(-1px); filter: brightness(1.08); } .gx-btn:active { transform: translateY(1px) scale(.99); }
.gx-btn:focus-visible { outline: 3px solid rgba(255,255,255,.85); outline-offset: 3px; }
.gx-btn svg { width: 22px; height: 22px; flex: none; transition: transform .2s; } .gx-btn:hover svg { transform: translateX(-4px); }
html[dir="ltr"] .gx-btn svg { transform: scaleX(-1); } html[dir="ltr"] .gx-btn:hover svg { transform: scaleX(-1) translateX(-4px); }
.gx-btn[disabled] { cursor: wait; filter: saturate(.85) brightness(.95); transform: none; } .gx-btn[disabled] svg { display: none; }
.gx-btn[disabled]::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; animation: gxSpin .8s linear infinite; }
.gx-btn.gx-out { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.4); box-shadow: none; margin-top: 10px; }
.gx-card p.gx-err { margin: 14px 0 0; padding: 10px 14px; border-radius: 16px; font-size: 13.5px; font-weight: 600; line-height: 1.7; color: #fff; background: rgba(130,18,40,.55); border: 1px solid rgba(255,150,140,.65); animation: gxItem .35s ease both; text-align: center; }
.gx-card p.gx-err:empty, .gx-card p:empty { display: none; }
.gx-card.gx-bad { animation: gxRise 0s both, gxShake .5s ease; } .gx-card.gx-bad .gx-field { border-color: rgba(255,138,128,.85); box-shadow: 0 0 0 4px rgba(229,72,62,.25); }
.gx-credit { position: fixed; left: 0; right: 0; bottom: 14px; z-index: 2; text-align: center; font: 600 12.5px/1.6 var(--gx-font, "Cairo", Tahoma, system-ui, sans-serif); letter-spacing: .02em; color: rgba(255,255,255,.82); text-shadow: 0 1px 8px rgba(4,8,40,.7); pointer-events: none; }
.gx-credit bdi { color: #fff; font-weight: 800; letter-spacing: .08em; } .gx-credit .sep { margin: 0 8px; opacity: .7; }
.gx-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* checking a remembered device / a code in a link: only the mark + a ring */
.gx-busy .gx-field, .gx-busy .gx-btn, .gx-busy .gx-rm, .gx-busy .gx-gap { display: none; }
.gx-load { display: none; width: 34px; height: 34px; margin: 4px auto 4px; border-radius: 50%; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; animation: gxSpin .9s linear infinite; }
.gx-busy .gx-load { display: block; }
.gx-busy .gx-card p.gx-err { background: none; border: 0; color: rgba(255,255,255,.88); padding: 0; }
/* success: the card melts away and the scene fades into the program's own background */
.gx-ok .gx-card { animation: gxOut .55s cubic-bezier(.4,0,.2,1) forwards !important; }
.gx-ok .gx-flash { animation: gxFlash .6s ease .12s forwards; }
body.gx-on { background: #060a22; }
body.gx-on .credit { position: fixed; left: 0; right: 0; bottom: 14px; z-index: 2; padding: 0; color: rgba(255,255,255,.82); text-shadow: 0 1px 8px rgba(4,8,40,.7); pointer-events: none; }
body.gx-on .credit bdi { color: #fff; }
.gx-on .trial-over { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; padding: 20px 0 56px; }

@keyframes gxScene { from { opacity: 0; transform: scale(1.06); transform-origin: 50% 100%; } to { opacity: 1; transform: none; } }
@keyframes gxRise { from { opacity: 0; transform: translateY(34px) scale(.95); filter: blur(10px); } to { opacity: 1; transform: none; filter: blur(0); } }
@keyframes gxItem { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes gxBrick { from { opacity: 0; transform: translateY(-18px) scale(.7); } to { opacity: 1; transform: none; } }
@keyframes gxGlowB { from { filter: drop-shadow(0 0 2px rgba(255,190,90,.4)); } to { filter: drop-shadow(0 0 9px rgba(255,170,70,.95)); } }
@keyframes gxSheen { 0%, 62% { left: -60%; } 100% { left: 130%; } }
@keyframes gxShake { 0%, 100% { transform: none; } 18% { transform: translateX(-9px); } 36% { transform: translateX(8px); } 54% { transform: translateX(-6px); } 72% { transform: translateX(4px); } }
@keyframes gxSpin { to { transform: rotate(360deg); } }
@keyframes gxDriftA { from { transform: translate3d(-1.4%, 0, 0) scale(1.05); } to { transform: translate3d(1.4%, 0, 0) scale(1.05); } }
@keyframes gxDriftB { from { transform: translate3d(1.8%, 0, 0) scale(1.06); } to { transform: translate3d(-1.8%, 0, 0) scale(1.06); } }
@keyframes gxSun { from { opacity: .82; transform: scale(1); } to { opacity: 1; transform: scale(1.08); } }
@keyframes gxTw { from { opacity: .25; } to { opacity: 1; } }
@keyframes gxBar { from { transform: translateX(-38px); } to { transform: translateX(38px); } }
@keyframes gxFlick { 0%, 100% { opacity: 1; } 45% { opacity: .78; } 70% { opacity: .95; } }
@keyframes gxSway { from { transform: skewX(-.8deg); } to { transform: skewX(.8deg); } }
@keyframes gxCloud { from { transform: translate3d(-70vw, 0, 0); } to { transform: translate3d(115vw, 0, 0); } }
@keyframes gxFly { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: .95; } 85% { opacity: .8; } 100% { opacity: 0; transform: translate(var(--dx, 0), var(--dy, -80px)); } }
@keyframes gxOut { to { opacity: 0; transform: scale(1.07); filter: blur(8px); } }
@keyframes gxFlash { to { opacity: 1; } }
@media (max-width: 420px) { .gx-card { padding: 26px 18px 22px; border-radius: 26px; } .gx-card h1 { font-size: 21px; } }
@media (max-width: 340px) { .gx-field { padding: 0 12px; gap: 8px; } .gx-field input { letter-spacing: .04em; } }
@media (prefers-reduced-motion: reduce) { .gx-scene, .gx-scene *, .gx-card, .gx-card *, .gx-card::after, .gx-btn::after { animation: none !important; } .gx-card > * { opacity: 1; } }

</style></head><body>

function hashParams() { try { return new URLSearchParams(location.hash.replace(/^#/, '')); } catch (e) { return new URLSearchParams(''); } }

async function open_(kb, p, remember) {
  const html = await decrypt(kb, p);
  if (remember) LS.set(CK, D.kind === 'dev' ? b64u(kb) : p + '.' + b64u(kb));
  document.body.classList.add('gx-ok');
  await new Promise(r => setTimeout(r, REDUCE ? 0 : 560));
  launch(html);
}
async function byPass(pw, remember) {
  if (!pw || !D.pass) throw new Error('short');
  await open_(await unwrap(pw, D.pass), 'dev', remember);
}
/* the code (XXXX-XXXX-XXXX-XXXX): its first 4 letters pick a slot on the code server, the other 12 open it.
   The slot holds the signed code token, which program it is for (p: d demo / r real) and that program's key, so the code itself carries nothing readable. */
async function byCode(raw) {
  const c = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (c.length !== 16) throw new Error('short');
  if (!D.srv) throw new Error('net');
  let slot = null, reached = false;
  try { const r = await jsonp(D.srv, { a: 'slot', id: c.slice(0, 4) }, 10000); if (r && r.ok) { reached = true; slot = r.slot || null; } } catch (e) { /* server unreachable */ }
  if (!slot) throw new Error(reached ? 'unknown' : 'net');
  const o = JSON.parse(new TextDecoder().decode(await unwrap(c.slice(4), slot))); /* throws when the code is wrong */
  if (!blobOf(o.p)) throw new Error('unknown');
  history.replaceState(null, '', location.pathname + location.search + '#t=' + o.t);
  await open_(u8(o.k), o.p, true);
}
const codeMsg = e => e.message === 'net' ? 'تعذر الاتصال. تأكد من الإنترنت وحاول مرة أخرى.' : 'الكود غير صحيح، أو لم يُفعَّل بعد. لو أرسله لك المصمم الآن انتظر دقيقة وحاول مرة أخرى.';
/* the code is shown as XXXX-XXXX-XXXX-XXXX while typing; a pasted link that carries c=… is understood too */
const CODE_RX = /(?:^|[#&?\s])c=([A-Za-z0-9-]+)/;
const normCode = v => (CODE_RX.exec(v) ? CODE_RX.exec(v)[1] : v).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 16);
const dashCode = c => c.replace(/(.{4})(?=.)/g, '$1-');
function autoFormat(inp) {
  inp.addEventListener('input', () => {
    const v = inp.value, nv = dashCode(normCode(v)); if (nv === v) return;
    const n = CODE_RX.test(v) ? 99 : v.slice(0, inp.selectionStart == null ? v.length : inp.selectionStart).replace(/[^A-Za-z0-9]/g, '').length;
    let p = 0, k = 0; while (p < nv.length && k < n) { if (nv[p] !== '-') k++; p++; }
    inp.value = nv; try { inp.setSelectionRange(p, p); } catch (e) { /* not selectable */ }
  });
}
function form() {
  const f = $('#f'); busy(false); $('#e').textContent = '';
  if (D.kind === 'gate') {
    f.innerHTML = '<label class="gx-field">' + ICO.key + '<span class="gx-sr">الكود</span><input id="i" type="text" inputmode="text" enterkeyhint="go" spellcheck="false" autocomplete="off" autocapitalize="characters" maxlength="200" placeholder="XXXX-XXXX-XXXX-XXXX"></label><div class="gx-gap"></div>' + btnHtml;
    const go = async () => {
      const c = normCode($('#i').value);
      if (c.length !== 16) { $('#i').focus(); return fail('الكود غير مكتمل. اكتبه كاملاً كما أرسله المصمم.'); }
      const b = $('#b'); b.disabled = true; btnLabel('جارٍ التحقق…'); say('');
      try { await byCode(c); } catch (e) { b.disabled = false; btnLabel('دخول'); fail(codeMsg(e)); $('#i').focus(); }
    };
    autoFormat($('#i')); $('#b').onclick = go; $('#i').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
    $('#i').focus(); return;
  }
  f.innerHTML = '<label class="gx-field">' + ICO.lock + '<span class="gx-sr">كلمة المرور</span><input id="i" type="password" autocomplete="off" spellcheck="false" placeholder="كلمة المرور" style="text-align:start;letter-spacing:.04em"><button class="gx-eye" id="eye" type="button" aria-label="إظهار كلمة المرور">' + ICO.eye + '</button></label><label class="gx-rm"><input type="checkbox" id="r"><span>تذكر هذا الجهاز</span></label><div class="gx-gap"></div>' + btnHtml;
  $('#eye').onclick = () => { const i = $('#i'), show = i.type === 'password'; i.type = show ? 'text' : 'password'; $('#eye').innerHTML = show ? ICO.eyeOff : ICO.eye; i.focus(); };
  const go = async () => {
    const v = $('#i').value; if (!v.trim()) return;
    const b = $('#b'); b.disabled = true; btnLabel('جارٍ التحقق…'); say('');
    try { await byPass(v, $('#r').checked); }
    catch (e) { b.disabled = false; btnLabel('دخول'); fail('كلمة المرور غير صحيحة.'); $('#i').focus(); }
  };
  $('#b').onclick = go; $('#i').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#i').focus();
}

(async function start() {
  if (!S) { $('#f').innerHTML = ''; return fail('افتح هذه الصفحة من رابط https في متصفح حديث.'); }
  const P = hashParams();
  if (D.kind === 'gate' && P.get('c')) { /* a code typed on the card inside the program (or sent as a link) wins over what this device remembers */
    busy(true); say('جارٍ التحقق من الكود…');
    try { await byCode(P.get('c')); return; } catch (e) { form(); return fail(codeMsg(e)); }
  }
  const ck = LS.get(CK);
  if (ck) {
    busy(true); say('جارٍ فتح البرنامج…');
    try {
      if (D.kind === 'dev') await open_(u8(ck), 'dev', false);
      else { const i = ck.indexOf('.'); await open_(u8(ck.slice(i + 1)), ck.slice(0, i), false); }
      return;
    } catch (e) { LS.del(CK); }
  }
  form();
})();
})();
