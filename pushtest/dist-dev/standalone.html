    `<div class="isum"><div class="ic">${top1}${ln('المدفوع نقداً:', money(invPaidAll(r)), 'big')}${st ? ln('تحصيلات لاحقة:', money(st), 'sub') : ''}</div><div class="ic">${rn ? ln('مرتجعات:', '− ' + money(rn), 'sub') : ''}${r.over > 0 ? ln('المتبقي للعميل:', '− ' + money(r.over), 'big') : ln('المتبقي (أجل):', money(left), 'big')}${st && !rn ? '<div class="l sub sp"><span>&nbsp;</span></div>' : ''}</div></div>` +
    (isVoid ? `<div class="vstamp">ملغاة</div>` : ''), 'inv' + (isVoid ? ' void' : ''));
}

/* customer statement: every invoice (debit) and everything paid at issue or collected later (credit), with a running balance */
function custLedger(c) {
  const mv = [];
  db.invoices.filter(i => i.customerId === c.id && i.status !== 'void').forEach(i => {
    mv.push({ d: i.date, t: `فاتورة رقم ${i.no}`, debit: i.net, credit: 0 });
    if (i.deposit > 0) mv.push({ d: i.date, t: `عربون مخصوم — فاتورة ${i.no}`, debit: 0, credit: i.deposit });
    if (i.paid > 0) mv.push({ d: i.date, t: `مدفوع نقداً عند الإصدار — فاتورة ${i.no}`, debit: 0, credit: i.paid });
  });
  db.returns.filter(r => r.customerId === c.id).forEach(r => { /* the goods come back (credit), cash given back is a debit again */
    mv.push({ d: r.date, t: `مرتجع — فاتورة ${r.invNo}`, debit: 0, credit: r.net });
    if (r.refund > 0) mv.push({ d: r.date, t: `رد نقدي للعميل — مرتجع ${r.no}`, debit: r.refund, credit: 0 });
  });
  const vd = voidIds();
  db.payments.filter(x => x.customerId === c.id).forEach(x => { /* the part that sat on a cancelled invoice went back to him, so it is not shown */
    const cr = round2(x.amount - payVoided(x, vd)), live = (x.alloc || []).filter(a => !vd.has(a.inv));
    if (cr > 0) mv.push({ d: x.date, t: 'تحصيل' + (live.length ? ' — فاتورة ' + live.map(a => a.no).join('، ') : ''), debit: 0, credit: cr });
  });
  mv.sort((a, b) => String(a.d).localeCompare(String(b.d))); /* oldest first (equal times keep their order); byDate reads .date and would not sort these rows */
  let run = 0; mv.forEach(m => { run = round2(run + m.debit - m.credit); m.bal = run; });
  return mv;
}
function custPaper(c) {
  const mv = custLedger(c), debt = customerDebt(c.id), total = customerTotal(c.id), nInv = db.invoices.filter(i => i.customerId === c.id && i.status !== 'void').length;
  const ln = (a, b, k = '') => `<div class="l${k ? ' ' + k : ''}"><span>${a}</span><b>${b}</b></div>`;
  const rows = mv.map(m => `<tr><td class="dt"><bdi dir="ltr">${ymd(m.d)}</bdi></td><td class="bn">${esc(m.t)}</td><td>${m.debit ? fmt(m.debit) : ''}</td><td>${m.credit ? fmt(m.credit) : ''}</td><td class="bl">${fmt(m.bal)}</td></tr>`).join('') || '<tr><td colspan="5">لا توجد حركة لهذا العميل.</td></tr>';
  return paper(letterhead(letterOf()) + `<div class="rt"><h3>كشف حساب عميل</h3></div>` +
    `<div class="ibox"><span>اسم العميل: <b>${esc(c.name)}</b></span>${c.code ? `<span>الكود: <b><bdi dir="ltr">${esc(c.code)}</bdi></b></span>` : ''}${c.phone ? `<span>الموبايل: <b><bdi dir="ltr">${esc(c.phone)}</bdi></b></span>` : ''}${c.address ? `<span>العنوان: <b>${esc(c.address)}</b></span>` : ''}<span>التاريخ: <b><bdi dir="ltr">${ymd(new Date())}</bdi></b></span></div>` +
    `<table class="itbl st"><colgroup><col style="width:17%"><col style="width:37%"><col style="width:15%"><col style="width:15%"><col style="width:16%"></colgroup><thead><tr><th>التاريخ</th><th>البيان</th><th>فواتير</th><th>مدفوع</th><th>الرصيد</th></tr></thead><tbody>${rows}</tbody></table>` +
    `<div class="isum"><div class="ic">${ln('إجمالي المشتريات:', money(total))}${ln('إجمالي المسدَّد:', money(round2(total - debt)), 'big')}</div><div class="ic">${ln('عدد الفواتير:', fmt(nInv))}${ln('المتبقي على العميل:', money(debt), 'big')}</div></div>`, 'inv');
}

function detailPaper(from, to) {
  const L = ledger(from, to), out = L.out.concat(L.tip).sort((a, b) => a.d.localeCompare(b.d));
  const inT = sumA(L.inn), outT = sumA(out);
  const mix = [...L.inn.map(e => ({ ...e, s: 'داخل' })), ...out.map(e => ({ ...e, s: 'خارج' }))];
  return paper(repHeader('A', 'تقرير تفصيلي للحركة', from, to) +
    secA('تفاصيل الداخل (التحصيلات)', L.inn, 'إجمالي تفاصيل الداخل (التحصيلات)', inT) +
    secA('تفاصيل الخارج (المصروفات)', out, 'إجمالي تفاصيل الخارج (المصروفات)', outT) +
    (taxOn() ? secA('تفاصيل القيمة المضافة', L.vat, 'إجمالي تفاصيل القيمة المضافة', sumA(L.vat)) : '') +
    secA('تفاصيل الأرباح', L.gain, 'إجمالي تفاصيل الأرباح', sumA(L.gain)) +
    (L.loss.length ? secA('تفاصيل الخسائر', L.loss, 'إجمالي تفاصيل الخسائر', sumA(L.loss)) : '') +
    secA('تفاصيل صافي الخزينة', mix, 'إجمالي تفاصيل صافي الخزينة', round2(inT - outT), { sign: true }) +
    secA('تفاصيل الإجمالي الكلي للحركة', mix, 'إجمالي تفاصيل الإجمالي الكلي للحركة', round2(inT + outT), { sign: true, unit: 'حركة' }));
}

function shiftPaper(from, to, carry) {
  const L = ledger(from, to), inT = sumA(L.inn), outT = sumA(L.out), tipT = sumA(L.tip), net = round2(inT - outT - tipT - carry);
  return paper(repHeader('B', 'تقفيل وردية', from, to) +
    secB('تفاصيل الداخل (التحصيلات)', L.inn, 'إجمالي الداخل (التحصيلات)', inT) +
    secB('تفاصيل الخارج (المصروفات ودفعات الموردين)', L.out, 'إجمالي الخارج (المصروفات ودفعات الموردين)', outT) +
    secB('تفاصيل الإكراميات والخصومات', L.tip, 'إجمالي الإكراميات والخصومات', tipT) +
    (taxOn() ? secB('تفاصيل القيمة المضافة', L.vat, 'إجمالي القيمة المضافة', sumA(L.vat)) : '') +
    secB('تفاصيل الأرباح', L.gain, 'إجمالي الأرباح', sumA(L.gain)) +
    secB('تفاصيل الخسائر', L.loss, 'إجمالي الخسائر', sumA(L.loss)) +
    `<div class="rsum"><div><span>إجمالي الداخل:</span><b>${fmt(inT)} جنيه</b></div><div><span>إجمالي الخارج:</span><b>${fmt(outT)} جنيه</b></div>` +
    (tipT ? `<div><span>الإكراميات والخصومات المدفوعة:</span><b>${fmt(tipT)} جنيه</b></div>` : '') +
    `<div><span>الخصم المرحَّل للوردية التانية:</span><b>${fmt(carry)} جنيه</b></div><div class="fin"><span>الإجمالي الصافي:</span><b>${fmt(net)} جنيه</b></div></div>`);
}

function printRep(name) { /* the PDF file name comes from the page title */
  const t0 = document.title; document.title = trText(name); /* English UI: the saved-PDF name is English too */
  const done = () => { document.title = t0; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done); setTimeout(done, 60000);
  window.print();
}

/* every line of the movement as a table for Excel */
function ledgerCSV(from, to, name) {
  const L = ledger(from, to), S = { inn: 'داخل (تحصيلات)', out: 'خارج (مصروفات وموردين)', tip: 'إكراميات وخصومات', vat: 'قيمة مضافة', gain: 'أرباح', loss: 'خسائر' };
  const rows = []; Object.keys(S).forEach(k => { if (k === 'vat' && !taxOn()) return; L[k].forEach(e => rows.push([S[k], ymd(e.d), e.w, e.a])); });
  return { name: name + '_' + from + '_' + to, head: ['القسم', 'التاريخ', 'البيان', 'المبلغ'], rows };
}

/* collect money from a customer: split over his open invoices (oldest first), or put on one given invoice */
function collectModal(cid, invId, done) {
  const c = db.customers.find(x => x.id === cid); if (!c) return;
  const inv = invId ? db.invoices.find(x => x.id === invId) : null;
  const max = inv ? Math.min(invLeft(inv), customerDebt(cid)) : customerDebt(cid);
  if (max <= 0) return toast('لا يوجد متبقٍ للتحصيل');
  modal(`<h3>تحصيل من ${esc(c.name)}</h3>
    <p>${inv ? `على الفاتورة رقم <b>${esc(inv.no)}</b>` : 'يُسجَّل على فواتير العميل المفتوحة من الأقدم إلى الأحدث'}</p><p>المتبقي: <b>${money(max)}</b></p>
    <div class="field"><label for="m-amt">المبلغ المحصّل (جنيه)</label><input id="m-amt" class="inp" inputmode="decimal" value="${max}" autocomplete="off"></div>
    <div class="actions"><button class="btn" data-ok>تسجيل التحصيل</button><button class="btn ghost" data-no>إلغاء</button></div>`, (d, close) => {
    $('#m-amt').addEventListener('input', e => { e.target.value = cleanNum(e.target.value); });
    $('[data-no]', d).onclick = close;
    $('[data-ok]', d).onclick = () => {
      const a = num($('#m-amt').value);
      if (a <= 0) return toast('اكتب مبلغاً أكبر من صفر');
      if (a > max + 0.004) return toast(inv ? 'المبلغ أكبر من المتبقي على الفاتورة' : 'المبلغ أكبر من المتبقي على العميل');
      const alloc = allocate(cid, a, invId);
      db.payments.push({ id: uid(), customerId: cid, amount: round2(a), date: new Date().toISOString(), alloc });
      logA('pay_in', custName(cid), money(round2(a)), alloc.length ? alloc.map(x => x.no).join(' ') : ''); save(); close(); toast(alloc.length ? `تم التحصيل وسُجّل على فاتورة ${alloc.map(x => x.no).join('، ')}` : 'تم تسجيل التحصيل', 'ok'); if (done) done();
    };
  });
}

screens.setCo = (p, v) => {
  let logo = db.settings.logo;
  v.innerHTML = setHead() + `<section class="panel"><h2 class="panel-t">بيانات المنشأة</h2>
    <div class="form-grid">
      <div class="field"><label for="c-name">اسم المنشأة (يظهر أعلى الشاشة الرئيسية وفي الفاتورة والتقارير)</label><input id="c-name" class="inp" value="${esc(db.settings.company)}" placeholder="اكتب اسم المنشأة" maxlength="80" autocomplete="off"></div>

      <div class="field" style="grid-column:1/-1"><label for="c-phones">أرقام التواصل (سطر لكل رقم، ويمكن كتابة الاسم قبله مثل «المدير: 0100…»)</label><textarea id="c-phones" class="inp ta-s" rows="3" maxlength="400" autocomplete="off">${esc(db.settings.phones)}</textarea></div>
    </div>
    <div class="field" style="margin-top:16px"><span class="lbl">شعار المنشأة (اختياري) — يظهر على جانبي ترويسة الفاتورة والتقارير وكعلامة مائية خفيفة، وفي شاشة الخروج</span>
      <div class="logo-pick"><div class="logo-prev" id="c-prev"></div>
        <div class="actions"><label class="btn outline" for="c-file">اختيار صورة</label><input id="c-file" type="file" accept="image/*" class="sr"><button class="btn ghost" id="c-rm" type="button">إزالة الشعار</button></div></div></div>
    <div class="field" style="margin-top:16px"><span class="lbl">معاينة ترويسة الفاتورة</span><div class="paper pv inv" id="c-pv"></div></div>
    <div class="actions" style="margin-top:20px"><button class="btn" id="c-save" type="button">${ICON.save}<span>حفظ البيانات</span></button></div></section>`;
  const preview = () => letterhead({ logo, name: $('#c-name').value.trim() || 'اسم المنشأة', phones: toLat($('#c-phones').value).split('\n').map(x => x.trim()).filter(Boolean).join(' | '), addr: $('#c-addr').value.trim() });
  const paint = () => { $('#c-prev').innerHTML = logo ? `<img src="${logo}" alt="الشعار">` : `<span>بدون شعار</span>`; $('#c-rm').hidden = !logo; $('#c-pv').innerHTML = preview(); };
  paint(); ['#c-name', '#c-addr', '#c-phones'].forEach(q => $(q).addEventListener('input', paint));
  $('#c-rm').onclick = () => { logo = ''; paint(); };
  $('#c-file').onchange = e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    if (!/^image\//.test(f.type)) return toast('اختر ملف صورة');
    const r = new FileReader(); r.onerror = () => toast('تعذر قراءة الصورة');
    r.onload = () => {
      const im = new Image(); im.onerror = () => toast('تعذر قراءة الصورة');
      im.onload = () => {
        const w0 = im.naturalWidth || 300, h0 = im.naturalHeight || 300, k = Math.min(1, 520 / Math.max(w0, h0));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w0 * k)); c.height = Math.max(1, Math.round(h0 * k));
        const x = c.getContext('2d'); x.drawImage(im, 0, 0, c.width, c.height);
        let u = c.toDataURL('image/png');

      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  };
  $('#c-save').onclick = async () => {

    db.settings.company = $('#c-name').value.trim(); db.settings.logo = logo;
    db.settings.address = $('#c-addr').value.trim(); db.settings.phones = toLat($('#c-phones').value).split('\n').map(x => x.trim()).filter(Boolean).join('\n');

  };
};

/* security: admin PIN (guards saving in Settings) + optional login PIN (set by the admin only) */
screens.setSec = (p, v) => {
  const S = db.settings;
  if (usersOn()) { v.innerHTML = setHead() + `<section class="panel"><h2 class="panel-t">الأمان والرقم السري</h2><p class="lbl" style="margin:0 0 14px;line-height:1.9">المستخدمون مفعّلون: كل مستخدم له رقمه السري، وموافقة المدير تكون برقمه هو. تُدار الأرقام من «المستخدمون والصلاحيات».</p><div class="actions"><button class="btn" data-act="go" data-to="setUsers" type="button">فتح المستخدمين والصلاحيات</button></div></section>`; return; }
  v.innerHTML = setHead() + `<div class="stack">
  <section class="panel"><h2 class="panel-t">الرقم السري للمسؤول <span class="badge ${S.adminPin ? 'on' : ''}">${S.adminPin ? 'مفعّل' : 'غير مفعّل'}</span></h2>
    <p class="lbl" style="margin:0 0 14px">يُطلب عند حفظ أي تغيير في الإعدادات (الأصناف والأسعار، بيانات المنشأة، مسح البيانات، الاسترجاع). من 4 إلى 8 أرقام.</p>
    <div class="form-grid">${S.adminPin ? pinInput('a-old', 'الرقم الحالي') : ''}${pinInput('a-new', S.adminPin ? 'الرقم الجديد' : 'الرقم السري')}${pinInput('a-new2', 'تأكيد الرقم')}</div>
    <div class="actions" style="margin-top:18px"><button class="btn" id="a-save" type="button">${ICON.save}<span>حفظ الرقم السري</span></button>${S.adminPin ? '<button class="btn danger" id="a-off" type="button">إلغاء الرقم السري</button>' : ''}</div></section>
  <section class="panel"><h2 class="panel-t">رقم سري الدخول (اختياري) <span class="badge ${S.loginPin ? 'on' : ''}">${S.loginPin ? 'مفعّل' : 'غير مفعّل'}</span></h2>
    <p class="lbl" style="margin:0 0 14px">${S.adminPin ? 'لو عيّنته، يطلبه التطبيق عند الفتح وبعد تسجيل الخروج. المسؤول فقط يقدر يضيفه أو يغيّره.' : 'عيّن الرقم السري للمسؤول أولاً، ثم يمكنك تعيين رقم دخول اختياري.'}</p>
    <div class="form-grid">${pinInput('l-new', 'رقم الدخول')}${pinInput('l-new2', 'تأكيد الرقم')}</div>
    <div class="actions" style="margin-top:18px"><button class="btn" id="l-save" type="button" ${S.adminPin ? '' : 'disabled'}>${ICON.save}<span>حفظ رقم الدخول</span></button>${S.loginPin ? '<button class="btn danger" id="l-off" type="button">إلغاء رقم الدخول</button>' : ''}</div></section>
  <p class="lbl note-s">ملاحظة: الحماية هنا على مستوى المتصفح، تمنع المستخدم العادي من الدخول أو التعديل، لكنها ليست تأمينًا كاملاً. التأمين الكامل (حسابات ومستخدمين على سيرفر) خطوة لاحقة.</p></div>`;
  bindPin(v);
  const ok4 = x => x.length >= 4;
  const checkOld = () => {
    const w = waitSecs('admin'); if (w) { toast(`محاولات كثيرة. حاول بعد ${w} ثانية`); return false; }
    if (!checkPin(cleanPin($('#a-old').value), S.adminPin)) { pinFail('admin'); toast('الرقم الحالي غير صحيح'); return false; }
    delete tries.admin; return true;
  };
  $('#a-save').onclick = () => {
    const n = cleanPin($('#a-new').value), n2 = cleanPin($('#a-new2').value);
    if (S.adminPin && !checkOld()) return;
    if (!ok4(n)) return toast('الرقم السري من 4 إلى 8 أرقام');
    if (n !== n2) return toast('تأكيد الرقم غير مطابق');
    if (S.loginPin && checkPin(n, S.loginPin)) return toast('يجب أن يختلف عن رقم الدخول');
    S.adminPin = makePin(n); adminUntil = Date.now() + 10 * 60 * 1000; logA('pin', 'تعيين الرقم السري للمسؤول'); save(); render(); toast('تم حفظ الرقم السري للمسؤول', 'ok');
  };
  if (S.adminPin) $('#a-off').onclick = async () => {
    if (!checkOld()) return;
    if (!await confirmBox('', 'إلغاء الرقم السري يجعل الإعدادات مفتوحة لأي مستخدم. هل تريد المتابعة؟', 'نعم')) return;

  };

    if (!ok4(n)) return toast('رقم الدخول من 4 إلى 8 أرقام');
    if (n !== n2) return toast('تأكيد الرقم غير مطابق');
    if (checkPin(n, S.adminPin)) return toast('رقم الدخول يجب أن يختلف عن رقم المسؤول');
    if (!await requireAdmin()) return;
    S.loginPin = makePin(n); logA('pin', 'تعيين رقم الدخول'); save(); render(); toast('تم حفظ رقم الدخول', 'ok');
  };
  if (S.loginPin) $('#l-off').onclick = async () => {
    if (!await requireAdmin()) return;
    S.loginPin = null; logA('pin', 'إلغاء رقم الدخول'); save(); render(); toast('تم إلغاء رقم الدخول', 'ok');
  };
};

/* ---------- Logout / lock screen & boot ---------- */
/* A program opened from the hosted code page (the gate) has a real exit: it forgets the code on this device and goes back to the code page.
   The business data stays on the device; the code (or the designer's password) is asked for again. The gate leaves its storage key in sessionStorage ('gx.ck'). */
function gateExit() {
  let ck = ''; try { ck = sessionStorage.getItem('gx.ck') || ''; } catch (e) { /* no storage */ }
  if (!ck) return false;
  confirmBox('الخروج', 'سيُغلق البرنامج ويطلب الكود عند الدخول مرة أخرى، فاحتفظ بالكود. بياناتك محفوظة على جهازك ولن تُمسح.', 'خروج', false).then(ok => {
    if (!ok) return;
    CUR_USER = null; adminUntil = 0; closePop();
    try { localStorage.removeItem(ck); sessionStorage.removeItem('gx.ck'); } catch (e) { /* storage blocked */ }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* keep the address */ }
    Promise.resolve(typeof pushForget === 'function' ? pushForget() : 0).catch(() => 0).then(() => location.reload()); /* the gate page loads again and shows the code box (first this device stops getting phone alarms) */
  });
  return true;
}
function lockScreen() {
  if (!usersOn() && !db.settings.loginPin && gateExit()) return; /* no PIN / accounts: "exit" really leaves (a PIN or accounts keep the lock screen, which switches the user) */
  hReset(); adminUntil = 0; closePop(); CUR_USER = null;
  const S = db.settings, U = usersOn(), locked = U || !!S.loginPin, t0 = Date.now(), v = $('#view');
  let lastU = ''; try { lastU = localStorage.getItem(KEY + '.user') || ''; } catch (e) { /* no storage */ }
  v.innerHTML = `<div class="lock${locked ? '' : ' tap'}"${locked ? '' : ' tabindex="0" role="button" aria-label="اضغط للدخول"'}><div class="lock-in">
    <div class="lock-logo">${S.logo ? `<img src="${S.logo}" alt="">` : ICON.company}</div>
    <h2 class="brand lock-name">${brandHTML()}</h2>
    ${locked ? `<div class="lock-form">${U ? `<div class="sel"><select id="l-user" aria-label="المستخدم">${db.users.map(u => `<option value="${u.id}"${u.id === lastU ? ' selected' : ''}>${esc(u.name)}</option>`).join('')}</select></div>` : ''}<input id="l-pin" class="inp" type="password" inputmode="numeric" maxlength="8" placeholder="الرقم السري" aria-label="الرقم السري" autocomplete="off"><button class="btn lg" id="l-go" type="button">دخول</button></div>` : `<p class="hint">اضغط في أي مكان للدخول</p>`}
  </div></div>`;
  const box = $('.lock', v);
  const enter = () => { box.classList.add('leave'); setTimeout(render, 240); };
  if (locked) {
    const inp = $('#l-pin'), submit = () => {
      const u = U ? db.users.find(x => x.id === $('#l-user').value) : null, k = U ? 'u' + (u ? u.id : '') : 'login';
      const w = waitSecs(k); if (w) return toast(`محاولات كثيرة. حاول بعد ${w} ثانية`);
      if (U ? u && checkPin(cleanPin(inp.value), u.pin) : checkPin(cleanPin(inp.value), S.loginPin)) {
        delete tries[k];
        if (u) { CUR_USER = { id: u.id, name: u.name, role: u.role }; u.last = new Date().toISOString(); markAudit(); logA('u_login', u.name, roleOf(u).n); save(); try { localStorage.setItem(KEY + '.user', u.id); } catch (e) { /* no storage */ } }
        enter();
      } else { pinFail(k); inp.value = ''; inp.focus(); toast('الرقم السري غير صحيح'); }
    };
    $('#l-go').onclick = submit; onEnter(inp, submit); inp.addEventListener('input', () => { inp.value = cleanPin(inp.value); }); inp.focus();
  } else {
    box.onclick = () => { if (Date.now() - t0 > 400) enter(); };
    box.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); } });
    box.focus();
  }
}

/* ---------- Operations: cancel / edit invoices, sales returns, cash count & period close, audit log, tax switch, Excel export ---------- */

/* ===== cancel an invoice ===== */
function canVoid(i) { /* a cancelled (or edited) invoice must leave nothing half-done: no returns, not in a closed period. Later collections (instalments) are no obstacle: cancel pays them back to the customer, edit carries them over to the new invoice */
  if (i.status === 'void') return { ok: false, why: 'الفاتورة ملغاة بالفعل' };
  if (db.returns.some(r => r.invId === i.id)) return { ok: false, why: 'عليها مرتجع ولا يمكن إلغاؤها أو تعديل أصنافها (اسم العميل فقط يتعدّل من «تعديل الاسم»)' };
  if (isLocked(i.date)) return { ok: false, why: 'الفاتورة في فترة مقفولة، سجّل مرتجعاً بدل الإلغاء (اسم العميل فقط يتعدّل من «تعديل الاسم»)' };
  if (db.bookings.some(b => b.fromInv === i.no && (b.uses.length || b.refunds.length))) return { ok: false, why: 'الرصيد الزائد المسجَّل للعميل من هذه الفاتورة استُخدم أو رُدّ، سجّل مرتجعاً بدل الإلغاء' };
  return { ok: true };
}
function backToStock(l, w) { /* goods come back to the shelf (of the line's own warehouse); the average cost is kept fair */
  const it = itemById(l.itemId); if (!it) return;
  const q = round3(it.qty + l.qty);
  if (l.cost != null && q > 0) it.cost = round2((Math.max(it.qty, 0) * it.cost + l.qty * l.cost) / q); /* an old line with no saved cost leaves the average as it is */
  stockMove(it, l.wh || w || WH0, l.qty);
}
function voidCore(i, reason, keepPays) { /* keepPays: an edit, the instalments are not paid back, they move to the new invoice */
  i.rows.forEach(l => backToStock(l, i.wh));
  db.bookings.forEach(b => { b.uses = b.uses.filter(u => u.inv !== i.no); }); /* a booking deposit it used becomes free again */
  db.bookings.forEach(b => { if (b.fromInv === i.no) { const o = bkOpen(b); if (o > 0) b.refunds.push({ a: o, date: new Date().toISOString() }); } }); /* the extra the customer paid on it goes back to him */
  db.quotes.forEach(q => { if (q.status === 'done' && q.invNo === i.no) { q.status = 'open'; q.invNo = ''; } }); /* the quotation it came from is open again */
  const coll = keepPays ? 0 : invSettled(i); /* what was collected on it after issue: paid back to the customer on the day of the cancel */
  i.status = 'void'; i.void = { at: new Date().toISOString(), reason: reason || '', by: CUR_USER ? CUR_USER.name : '' };
  if (coll > 0) i.void.coll = coll;
}
async function voidModal(i) {
  i = db.invoices.find(x => x.id === i.id) || i;
  const c = canVoid(i); if (!c.ok) return toast(c.why);
  if (!await requireAdmin('اكتب الرقم السري للمسؤول لإلغاء الفاتورة')) return;
  modal(`<h3>إلغاء الفاتورة رقم ${esc(i.no)}</h3>
    <p>يرجع ما فيها من أصناف إلى المخزن، وتبقى الفاتورة في السجل بعلامة «ملغاة».</p>
    ${invPaidAll(i) + invSettled(i) > 0 ? `<p>سيُسجَّل رد المبلغ المدفوع (<b>${money(round2(invPaidAll(i) + invSettled(i)))}</b>) كخارج من الخزينة.</p>` : ''}
    ${invSettled(i) > 0 ? `<p class="muted"><small>منه ${money(invPaidAll(i))} عند الإصدار، و${money(invSettled(i))} تحصيلات لاحقة (${invPays(i).length} دفعة)</small></p>` : ''}
    ${i.deposit > 0 ? '<p>يعود العربون المخصوم إلى الحجز.</p>' : ''}
    <div class="field"><label for="v-why">سبب الإلغاء</label><input id="v-why" class="inp" maxlength="120" autocomplete="off"></div>

/* ===== sales returns ===== */
const retLines = i => i.rows.map((l, li) => ({ li, l, done: round3(db.returns.filter(r => r.invId === i.id).reduce((s, r) => s + r.rows.filter(x => x.li === li).reduce((a, x) => a + x.qty, 0), 0)) }));
function retCalc(i, q) { /* value of the returned quantities, with the invoice's own discount and VAT share; the last piece takes the exact remainder */
  let sub = 0, cost = 0, full = true;
  retLines(i).forEach(x => { const k = q[x.li] || 0; sub += round2(k * x.l.price); cost += k * (x.l.cost || 0); if (x.l.qty - round3(x.done + k) > 1e-9) full = false; });
  const prev = db.returns.filter(r => r.invId === i.id), sum = f => prev.reduce((s, r) => s + r[f], 0);
  sub = round2(sub); let discAmt = round2(sub * (i.discPct || 0) / 100), vatAmt = i.vatOn ? round2((sub - discAmt) * (i.vatPct || 0) / 100) : 0, net = round2(sub - discAmt + vatAmt);
  if (full && sub > 0) { /* the last piece: what is left of the invoice, so all the returns add up exactly to its net */
    sub = round2(i.subtotal - sum('subtotal')); net = round2(i.net - sum('net'));
    if (i.vatOn) { discAmt = round2(i.discAmt - sum('discAmt')); vatAmt = round2(net - sub + discAmt); } else { vatAmt = 0; discAmt = round2(sub - net); }
  }
  const credit = round2(Math.min(net, invLeft(i)));
  return { sub, discAmt, vatAmt, net, cost: round2(cost), credit, refund: round2(net - credit) };
}
screens.invReturn = (p, v) => {
  const i = db.invoices.find(x => x.id === p.id); if (!i || i.status === 'void') return back();
  const L = retLines(i), q = L.map(() => 0);

/* VAT report: the invoices that carry VAT, less the VAT of returns */

  rows.sort((a, b) => a.d.localeCompare(b.d)); return rows;
}
function vatPaper(from, to) {

  return paper(repHeader('A', 'تقرير القيمة المضافة', from, to) + `<section class="rsec"><table class="rtbl"><thead><tr><th>التاريخ</th><th>الرقم</th><th>البيان</th><th>قبل الضريبة</th><th>القيمة المضافة</th></tr></thead><tbody>${rows.map(x => `<tr><td><bdi dir="ltr">${ymd(x.d)}</bdi></td><td>${esc(x.no)}</td><td>${esc(x.w)}</td><td class="amt"><bdi>${fmt(x.base)}</bdi></td><td class="amt"><bdi>${fmt(x.vat)}</bdi></td></tr>`).join('') || '<tr><td colspan="5">لا توجد فواتير بقيمة مضافة في هذه الفترة.</td></tr>'}</tbody>

/* ===== item card: every movement of one item with a running balance ===== */
function itemMovements(it, wid) {
  const mv = [], inW = w => !wid || (w || WH0) === wid;
  db.invoices.forEach(i => {
    i.rows.forEach(l => {
      if (l.itemId !== it.id || !inW(l.wh || i.wh)) return;
      mv.push({ d: i.date, t: `بيع — فاتورة ${i.no} (${i.name})`, q: -l.qty });
      if (i.status === 'void' && i.void) mv.push({ d: i.void.at, t: `إلغاء فاتورة ${i.no}`, q: l.qty });
    });
  });
  db.returns.forEach(r => { const iv = db.invoices.find(x => x.id === r.invId); r.rows.forEach(l => { if (l.itemId === it.id && inW(l.wh || (iv && iv.wh))) mv.push({ d: r.date, t: `مرتجع ${r.no} — فاتورة ${r.invNo}`, q: l.qty }); }); });
  db.moves.forEach(m => { if (m.itemId === it.id && inW(m.wh)) mv.push({ d: m.date, t: MV[m.type] + (m.ref ? ' — ' + m.ref : ''), q: m.qty }); });
  mv.sort(byDate);
  const cur = wid ? whQty(it, wid) : it.qty, open = round3(cur - mv.reduce((s, m) => s + m.q, 0));
  let run = open; mv.forEach(m => { run = round3(run + m.q); m.bal = run; });
  return { open, mv, cur };
}

/* ===== income statement ===== */
function incomeData(from, to) {
  const inR = d => { const k = ymd(d); return k >= from && k <= to; };
  const live = liveInvoices().filter(i => inR(i.date)), rets = db.returns.filter(r => inR(r.date));
  const sales = round2(live.reduce((s, i) => s + i.subtotal - i.discAmt, 0)), retV = round2(rets.reduce((s, r) => s + r.subtotal - r.discAmt, 0));
  const cogs = round2(live.reduce((s, i) => s + invCost(i), 0) - rets.reduce((s, r) => s + (r.cost || 0), 0));
  const by = {}; db.expenses.filter(e => inR(e.date)).forEach(e => { const k = (e.cat === 'tip' ? 'إكراميات وخصومات: ' : '') + (e.title || CATS[e.cat] || CATS.misc); by[k] = round2((by[k] || 0) + e.amount); });
  let exp = Object.entries(by).sort((a, b) => b[1] - a[1]); if (exp.length > 14) { const rest = round2(exp.slice(13).reduce((s, x) => s + x[1], 0)); exp = exp.slice(0, 13).concat([['مصروفات أخرى', rest]]); }
  const expT = round2(exp.reduce((s, x) => s + x[1], 0));
  const dmg = round2(db.damages.filter(x => inR(x.date)).reduce((s, x) => s + x.value, 0)), cnt = round2(db.counts.filter(c => inR(c.date)).reduce((s, c) => s + c.value, 0));
  const netSales = round2(sales - retV), gross = round2(netSales - cogs), net = round2(gross - expT - dmg + cnt);
  const vat = round2(live.filter(i => i.vatOn).reduce((s, i) => s + i.vatAmt, 0) - rets.reduce((s, r) => s + (r.vatAmt || 0), 0));
  return { sales, retV, netSales, cogs, gross, exp, expT, dmg, cnt, net, vat, nInv: live.length, nRet: rets.length };
}
function incomeLines(from, to) {
  const d = incomeData(from, to), L = [], pct = d.netSales ? ` (${fmt(d.gross / d.netSales * 100)}%)` : '';
  L.push(['المبيعات (بعد الخصم وقبل الضريبة)', d.sales]); L.push(['− مرتجعات المبيعات', -d.retV]); L.push(['صافي المبيعات', d.netSales, 'sub']);
  L.push(['− تكلفة البضاعة المباعة', -d.cogs]); L.push(['مجمل الربح' + pct, d.gross, 'sub']);
  d.exp.forEach(([k, a]) => L.push(['− ' + k, -a, 'ind'])); L.push(['− إجمالي المصروفات', -d.expT]);
  if (d.dmg) L.push(['− خسائر التالف', -d.dmg]);
  if (d.cnt) L.push([d.cnt < 0 ? '− عجز الجرد' : '+ زيادة الجرد', d.cnt]);
  L.push(['صافي الربح', d.net, 'sub fin']);
  return { d, L };
}
function incomePaper(from, to) {
  const { d, L } = incomeLines(from, to);
  return paper(repHeader('A', 'قائمة الدخل', from, to) + `<section class="rsec"><table class="rtbl inc"><thead><tr><th>البند</th><th>المبلغ (جنيه)</th></tr></thead><tbody>${L.map(([t, a, c]) => `<tr${c ? ` class="${c}"` : ''}><td>${esc(t)}</td><td class="amt"><bdi>${a < 0 ? '(' + fmt(-a) + ')' : fmt(a)}</bdi></td></tr>`).join('')}</tbody></table>

/* ===== debts: every open invoice by age (days since it was issued) ===== */
function agingData() {
  const m = settledMap(), rc = retCreditMap(), t0 = dayNum(ymd(new Date())), map = new Map();
  liveInvoices().forEach(i => {
    const left = invLeft(i, m, rc); if (left <= 0) return;
    const cu = i.customerId ? custById(i.customerId) : null, key = cu ? cu.id : 'n:' + i.name;
    let r = map.get(key);
    if (!r) { r = { key, cid: cu ? cu.id : null, name: cu ? cu.name : i.name, phone: cu ? cu.phone : (i.phone || ''), limit: cu ? (cu.limit || 0) : 0, b: [0, 0, 0, 0], total: 0, oldest: 0, first: i.id }; map.set(key, r); }
    const age = Math.max(Math.round(t0 - dayNum(ymd(i.date))), 0), k = age <= 30 ? 0 : age <= 60 ? 1 : age <= 90 ? 2 : 3;
    r.b[k] = round2(r.b[k] + left); r.total = round2(r.total + left); if (age > r.oldest) { r.oldest = age; r.first = i.id; }
  });
  const rows = [...map.values()].sort((a, b) => b.total - a.total), tot = [0, 1, 2, 3].map(k => round2(rows.reduce((s, r) => s + r.b[k], 0)));
  return { rows, tot, all: round2(tot.reduce((s, x) => s + x, 0)), late: round2(tot[1] + tot[2] + tot[3]) };
}

async function dlStep(d, to) {

      if (uname && unorm(uname).length < 2) return toast('اسم المستخدم لازم يكون حرفين على الأقل');
      const pl = { v: 2, p, i: b64u(crypto.getRandomValues(new Uint8Array(6))), c: now, m: mins, s, o: s === 'r' ? now + OPEN_DAYS[p] * 864e5 : 0, n: note };
      const mb = $('#d-make'); mb.disabled = true;
      try {
        const pb = TXT_E.encode(JSON.stringify(pl)), sig = new Uint8Array(await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, devKey, pb));
        const t = b64u(pb) + '.' + b64u(sig), st = dget(); let id; do { id = cRand(4); } while (st.list.some(x => x.k.slice(0, 4) === id));
        const k = id + cRand(12), w = await wrapSecret(usecret(uname, k.slice(4)), TXT_E.encode(JSON.stringify({ p, k: p === 'r' ? devSec.kc : devSec.kt, t })));
        const e = { k, p, i: pl.i, c: now, m: mins, s, o: pl.o, n: note, un: unorm(uname) ? uname : '', w, live: false };
        st.list.unshift(e); dset(st);
        try { await srvPutCode(e); upd(k, x => { x.live = true; x.w = null; }); e.live = true; } catch (x) { toast(srvMsg(x)); }
        keep(); show(e); drawLog(); drawPend(); if (e.live) toast('تم إنشاء الكود — جاهز للاستخدام الآن', 'ok');
      } catch (x) { toast('تعذر إنشاء الكود'); }
      mb.disabled = false;
    };
  }
  drawLog(); drawPend(); srvSync(); srvStatus();
  /* live: the countdowns tick every second, and the server is asked every 15 s whether a customer opened a code */
  const logEl = $('#d-log'), gone = () => !document.body.contains(logEl) || !devOpen();
  const t1 = setInterval(() => { if (gone()) return clearInterval(t1); const now = Date.now() + srvDiff; $$('[data-left]', logEl).forEach(b => { const end = +b.dataset.left; b.textContent = end > now ? dLeft(end - now) : 'انتهت المدة'; }); }, 1000);
  const t2 = setInterval(() => { if (gone()) return clearInterval(t2); if (!document.hidden) srvSync(); }, 15000);
}

/* ---------- Boot ---------- */
applyZoom(); hInit();
if (needLogin()) lockScreen(); else render();

})();
