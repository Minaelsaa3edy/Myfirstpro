  --green: #1e8e3e;
  --amber: #f5a623;
  --orange: #f26a2e;
  --teal: #2fb59b;

  --overlay: rgba(15, 22, 36, 0.45);
  --font: "Cairo", Tahoma, "Segoe UI", system-ui, sans-serif;
}

/* Layout: one full-width column. Home = header band over a 3x2 tile grid that fills the viewport; sub-screens = centered title with back button, then cards. Whole page scrolls. */
html { direction: rtl; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.3px);
  background-size: 22px 22px;
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
svg { display: block; }
:focus-visible { outline: 3px solid var(--blue-ring); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { min-height: calc(100vh / var(--z, 1)); display: flex; flex-direction: column; padding-inline: clamp(0px, 2.4vw, 36px); padding-block: clamp(14px, 2.6vw, 30px); }
#view { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ---------- Credit ---------- */
.credit { text-align: center; font-size: 12.5px; font-weight: 600; color: var(--fg3); padding-top: clamp(16px, 2vw, 26px); letter-spacing: .02em; }
.credit bdi { color: var(--fg2); font-weight: 800; letter-spacing: .08em; }

/* ---------- Home ---------- */
.home { flex: 1; display: flex; flex-direction: column; gap: clamp(14px, 2.2vw, 28px); }
.top {
  display: grid; grid-template-columns: minmax(120px, 1fr) minmax(0, 2.6fr) minmax(120px, 1fr); align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
  padding: clamp(14px, 2.4vw, 32px) clamp(16px, 2.6vw, 34px);
}
.clock { display: grid; grid-template-columns: auto auto; justify-content: start; align-items: baseline; column-gap: 6px; line-height: 1.15; }
.clock b { font-size: clamp(20px, 2vw, 28px); font-weight: 800; font-variant-numeric: tabular-nums; }
.clock small { font-size: 12px; font-weight: 700; color: var(--fg2); }
.clock .dt { grid-column: 1 / -1; font-size: clamp(10.5px, 0.85vw, 12px); color: var(--fg3); margin-top: 3px; }
.brand {
  margin: 0; font-size: clamp(19px, 2.55vw, 38px); font-weight: 800; line-height: 1.3; text-align: center; text-wrap: balance;
}
.brand span { display: block; }
.brand .b1 { color: var(--brand-a); }
.brand .b2 { color: var(--brand-b); }
.tools { display: flex; gap: 8px; justify-content: flex-end; }
.tool {
  position: relative; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  background: var(--tile); border: 1px solid var(--line); transition: transform .15s, box-shadow .15s;
}
.tool:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.tool svg { width: 18px; height: 18px; }
.tool .dot { position: absolute; top: 6px; inset-inline-end: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); border: 2px solid var(--tile); }
.tiles { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(150px, 1fr); gap: clamp(14px, 2.2vw, 28px); }
.tile {
  position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(10px, 1.3vw, 18px);
  background: var(--tile); border: 1.5px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
  font-size: clamp(17px, 1.78vw, 25px); font-weight: 700; padding: 18px; transition: transform .18s, box-shadow .18s, border-color .18s, background .18s;
}
.tile svg { width: clamp(40px, 4.2vw, 60px); height: clamp(40px, 4.2vw, 60px); }
.tile::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--blue); opacity: 0; transition: opacity .18s; }
.tile:hover { border-color: var(--blue); background: var(--surface); box-shadow: var(--shadow-h); transform: translateY(-2px); }
.tile:hover::before { opacity: 1; }
.tile:active { transform: translateY(0) scale(.99); }

/* ---------- Sub screens ---------- */
.sub-head { position: relative; text-align: center; padding: 6px 48px 16px; border-bottom: 1px solid var(--line); margin-bottom: clamp(16px, 2.2vw, 26px); }
.sub-head h1 { margin: 0; font-size: clamp(21px, 2.45vw, 35px); font-weight: 800; }
.back {
  position: absolute; inset-inline-start: 0; top: 2px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  background: var(--tile); border: 1px solid var(--line); transition: background .15s, color .15s, transform .15s;
}
.back svg { width: 18px; height: 18px; }
.back:hover, .back:active { background: var(--blue); color: #fff; border-color: var(--blue); }
.menu { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(14px, 2vw, 26px); margin-top: clamp(8px, 2vw, 24px); }
.opt {
  width: min(350px, 100%); height: clamp(150px, 14vw, 195px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: var(--tile); border: 1.5px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
  font-size: clamp(17px, 1.8vw, 25px); font-weight: 700; transition: transform .18s, box-shadow .18s, border-color .18s, background .18s;
}
.opt svg { width: 54px; height: 54px; }
.opt:hover { border-color: var(--ac, var(--blue)); background: var(--surface); box-shadow: var(--shadow-h); transform: translateY(-2px); }
.opt:active { transform: translateY(0) scale(.99); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: clamp(14px, 1.9vw, 24px); box-shadow: var(--shadow); min-width: 0; }
.panel + .panel { margin-top: clamp(14px, 1.6vw, 20px); }
.panel-t { margin: 0 0 14px; font-size: 14.5px; font-weight: 700; color: var(--fg); display: flex; align-items: center; gap: 8px; }
.panel-t.big { font-size: 17px; font-weight: 800; }
.panel-t svg { width: 20px; height: 20px; }
.panel-t.blue { color: var(--blue-t); }
.stack { display: flex; flex-direction: column; gap: clamp(14px, 1.6vw, 20px); }

/* ---------- Inputs ---------- */
.inp, .sel select, .tbl input {
  width: 100%; height: 40px; border-radius: 10px; background: var(--input); border: 1px solid var(--input-line);
  padding: 0 12px; font-size: 14px; text-align: center; outline: none; transition: background .15s, border-color .15s, box-shadow .15s;
}
.inp::placeholder, .tbl input::placeholder { color: var(--fg3); opacity: 1; }
.inp:focus, .sel select:focus, .tbl input:focus { background: var(--input-focus); border-color: var(--blue-line); box-shadow: 0 0 0 3px var(--blue-ring); }
.inp[readonly] { opacity: .8; }
.sel { position: relative; }
.sel select { appearance: none; -webkit-appearance: none; padding-inline: 12px 30px; cursor: pointer; text-align-last: center; }
.sel::after { content: ""; position: absolute; inset-inline-end: auto; left: 12px; top: 50%; width: 7px; height: 7px; border-left: 2px solid var(--fg2); border-bottom: 2px solid var(--fg2); transform: translateY(-70%) rotate(-45deg); pointer-events: none; }
.sel select option { background: var(--surface); color: var(--fg); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: 12.5px; font-weight: 600; color: var(--fg2); }
.ltr { text-align: left; }
.iconin { position: relative; }
.iconin .inp { text-align: left; padding-inline: 40px 12px; font-variant-numeric: tabular-nums; }
.iconin > svg, .iconin > .pct { position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--fg2); pointer-events: none; }
.iconin > .pct { font-size: 14px; font-weight: 700; text-align: center; line-height: 18px; }

.chk { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; color: var(--fg2); font-weight: 600; cursor: pointer; user-select: none; }
.chk input { position: absolute; opacity: 0; width: 0; height: 0; }
.chk i { width: 19px; height: 19px; flex: none; border-radius: 6px; border: 1.5px solid var(--input-line); background: var(--surface); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.chk i svg { width: 12px; height: 12px; color: #fff; opacity: 0; transform: scale(.6); transition: .15s; }
.chk input:checked + i { background: var(--blue); border-color: var(--blue); }
.chk input:checked + i svg { opacity: 1; transform: none; }
.chk input:focus-visible + i { outline: 3px solid var(--blue-ring); outline-offset: 2px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 22px; border-radius: 11px;
  background: var(--blue); color: #fff; font-weight: 700; font-size: 14.5px; transition: filter .15s, transform .1s, background .15s;
}
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: scale(.98); }
.btn.ghost { background: var(--tile); color: var(--fg); border: 1px solid var(--line); }
.btn.danger { background: var(--red); }
.btn.ok { background: var(--green); }
.btn.outline { background: transparent; color: var(--blue-t); border: 1.5px solid var(--blue-line); }
.btn.outline:hover { background: var(--blue-soft); filter: none; }
.btn.sm { height: 34px; padding: 0 16px; font-size: 13px; border-radius: 9px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.btn.lg { height: 50px; font-size: 16px; padding: 0 34px; border-radius: 13px; }
.btn svg { width: 18px; height: 18px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- Tables ---------- */
.tbl-wrap { overflow-x: auto; border-radius: 12px; }
table.grid, table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; min-width: 560px; }
table.grid thead th, table.tbl thead th { background: var(--blue); color: #fff; font-size: 13.5px; font-weight: 700; padding: 13px 8px; text-align: center; }
table.grid thead th:first-child, table.tbl thead th:first-child { border-start-start-radius: 12px; }
table.grid thead th:last-child, table.tbl thead th:last-child { border-start-end-radius: 12px; }
table.grid td, table.tbl td { padding: 10px 8px; text-align: center; font-size: 14px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: middle; }
table.grid tbody tr, table.tbl tbody tr { transition: background .12s; }
table.grid tbody tr:hover, table.tbl tbody tr:hover { background: var(--row-hover); }
td.qty { color: var(--green); font-weight: 800; }
td.val { color: var(--blue-t); font-weight: 700; }
td.muted { color: var(--fg3); }
.del { width: 34px; height: 34px; border-radius: 9px; background: var(--red); color: #fff; display: inline-grid; place-items: center; transition: filter .15s, transform .1s; }
.del:hover { filter: brightness(1.12); }
.del:active { transform: scale(.94); }
.del svg { width: 17px; height: 17px; }
.mini { height: 32px; padding: 0 12px; border-radius: 9px; font-size: 13px; font-weight: 700; background: var(--blue-soft); color: var(--blue-t); }
.mini:hover { background: var(--blue-soft-h); }
.total-box { border: 1.5px dashed var(--input-line); background: var(--tile); border-radius: 12px; padding: 14px 16px; text-align: center; font-size: 15px; font-weight: 700; margin-bottom: 16px; }
.total-box b { color: var(--blue-t); font-size: 17px; font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--fg3); padding: 28px 12px; font-size: 14px; }

/* ---------- Invoice form ---------- */
.cust { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 14px; align-items: center; }
.items-t { table-layout: fixed; }
.tbl td.rt { font-weight: 700; }
.tbl tbody tr:hover td { background: transparent; }
.tbl tbody tr:hover { background: var(--row-hover); }
.add-row {
  width: 100%; margin-top: 12px; height: 46px; border-radius: 11px; border: 1.5px dashed var(--blue-line); background: var(--blue-soft); color: var(--blue-t);
  font-weight: 700; font-size: 14.5px; transition: background .15s;
}
.add-row:hover, .add-row:active { background: var(--blue-soft-h); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(14px, 1.6vw, 20px); margin-top: clamp(14px, 1.6vw, 20px); }
.two .panel + .panel { margin-top: 0; }
.pay { display: flex; flex-direction: column; gap: 14px; }
.sum-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 2px; border-bottom: 1px dotted var(--input-line); font-size: 14px; color: var(--fg2); font-weight: 600; }
.sum-row b { color: var(--fg); font-size: 15px; font-variant-numeric: tabular-nums; }
.sum-row.red, .sum-row.red b { color: var(--red-t); }
.net { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; background: var(--tile); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-weight: 800; font-size: 14.5px; }
.net b { color: var(--blue-t); font-size: clamp(20px, 2vw, 26px); font-weight: 800; font-variant-numeric: tabular-nums; }
.rem { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; background: var(--red-soft); border: 1px dashed var(--red-line); border-radius: 12px; padding: 12px 16px; color: var(--red-t); font-weight: 800; font-size: 14.5px; }
.rem span { display: inline-flex; align-items: center; gap: 7px; }
.rem svg { width: 18px; height: 18px; }
.rem b { font-size: 17px; font-variant-numeric: tabular-nums; }
.submit { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: clamp(16px, 2vw, 26px); padding-bottom: 10px; }

/* ---------- Invoice sheet ---------- */
.sheet { max-width: 820px; margin: 0 auto; }
.sheet h2 { margin: 0; font-size: 22px; font-weight: 800; }
.sheet .meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin: 14px 0 18px; font-size: 13.5px; color: var(--fg2); }
.sheet .meta b { color: var(--fg); }
.sheet .totals { margin: 16px 0 0 auto; width: min(340px, 100%); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.pill.ok { background: rgba(30, 142, 62, .14); color: var(--green); }
.pill.bad { background: var(--red-soft); color: var(--red-t); }

/* ---------- Reports ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.stat { background: var(--tile); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.stat span { font-size: 12.5px; font-weight: 600; color: var(--fg2); }
.stat b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat.pos b { color: var(--green); }
.stat.neg b { color: var(--red-t); }
.stat.blue b { color: var(--blue-t); }
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar .inp { max-width: 340px; text-align: start; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; align-items: end; }
textarea.inp { height: 160px; padding: 10px 12px; text-align: left; direction: ltr; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; resize: vertical; }

/* ---------- Toast / modal / popover ---------- */
#toasts { position: fixed; z-index: 50; inset-inline-end: auto; left: max(20px, env(safe-area-inset-left, 0px)); bottom: max(20px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 12px; background: var(--surface); color: var(--fg); border-radius: 14px; border-inline-start: 5px solid var(--red);
  padding: 14px 18px; font-weight: 700; font-size: 14.5px; box-shadow: 0 10px 30px rgba(10, 20, 40, .22), 0 0 0 1px var(--line); max-width: min(92vw, 460px);
  opacity: 0; transform: translateX(-24px); transition: opacity .25s, transform .25s; pointer-events: auto;
}
.toast.in { opacity: 1; transform: none; }
.toast.ok { border-inline-start-color: var(--green); }
.toast .tx { width: 20px; height: 20px; flex: none; color: var(--red-t); display: grid; place-items: center; cursor: pointer; }

/* ---------- Settings ---------- */
.tiles.sm { flex: none; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(130px, auto); gap: clamp(12px, 1.6vw, 20px); }

.note { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--blue-soft); border: 1px dashed var(--blue-line); color: var(--blue-t); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; font-weight: 600; margin-bottom: clamp(14px, 1.6vw, 20px); }

.logo-pick { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.logo-prev { width: 160px; height: 100px; background: #fff; border: 1.5px dashed var(--input-line); border-radius: 12px; display: grid; place-items: center; overflow: hidden; color: #8a94a1; font-size: 13px; font-weight: 600; }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

@media (max-width: 900px) {

}

}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print { .credit { display: none; } body { background: #fff; } .sub-head, .actions, .tools, .submit { display: none !important; } .panel { box-shadow: none; border-color: #ccc; } }

/* ---- new: info pill, cash-sale bar, phones box ---- */
.pill.info { background: var(--blue-soft); color: var(--blue-t); }
.cashbar { display: flex; align-items: center; gap: 14px; }

textarea.inp.ta-s { height: auto; min-height: 84px; direction: rtl; text-align: start; font-family: var(--font); font-size: 14px; line-height: 1.8; }
.muted small, small.muted { font-size: 11.5px; }

/* ---- printable reports: always black on white, like the paper original ---- */

.rh { display: grid; grid-template-columns: clamp(52px, 12vw, 92px) minmax(0, 1fr) clamp(52px, 12vw, 92px); align-items: center; gap: 10px; text-align: center; padding-bottom: 14px; border-bottom: 3px solid #111; }
.rh img { width: 100%; max-height: 92px; object-fit: contain; display: block; }

.dtot { display: flex; justify-content: space-between; gap: 12px; margin-top: 7px; padding: 6px 12px; border: 1.5px dashed #555; border-radius: 8px; font-size: 13.5px; font-weight: 800; }

.rsum div { display: flex; justify-content: space-between; gap: 12px; font-size: clamp(13px, 3vw, 16px); font-weight: 800; }

.paper.inv .rh h2 { font-size: clamp(18px, 4.2vw, 27px); }
.paper.inv .rh .ph { font-size: clamp(12px, 2.9vw, 16.5px); margin: 6px 0 4px; }

.ibox { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px 16px; margin-top: 16px; padding: 9px 14px; border: 1.5px solid #111; border-radius: 10px; font-size: clamp(12px, 2.8vw, 14.5px); font-weight: 700; }
.ibox b { font-weight: 800; }
.itbl { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 14px; border: 1.5px solid #111; }
.itbl th, .itbl td { border: 1px solid #111; padding: 7px 6px; text-align: center; font-size: clamp(11px, 2.6vw, 14px); overflow-wrap: anywhere; }

.pv { max-width: 640px; margin: 8px 0 0; padding: 12px 14px; border-radius: 12px; }
.credit .sep { margin: 0 8px; opacity: .55; }
.credit .ver { color: var(--fg2); font-weight: 700; letter-spacing: .04em; }
@media (max-width: 520px) { .isum { flex-direction: column; } }
@page { size: A4; margin: 10mm; }
@media print {
  html, body { background: #fff !important; }
  #app { zoom: 1 !important; padding: 0 !important; max-width: none !important; }
  .noprint, #toasts, #modals { display: none !important; }
  .paper { border: 0; border-radius: 0; padding: 0; max-width: none; overflow: visible; }

/* ---------- Home: compact tiles + visible alerts ---------- */
.home { gap: clamp(12px, 1.8vw, 20px); }

/* ---------- customer <-> invoice links ---------- */
.lnk { color: var(--blue-t); font-weight: 700; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; padding: 0; cursor: pointer; }
.lnk:hover { text-decoration-style: solid; }
.toolbar .lbl { flex: 1; }

/* ---------- bell popover: above tiles/alerts, never clipped ---------- */
.top { position: relative; z-index: 25; }
.pop { top: calc(100% + 8px); inset-inline-end: 12px; width: min(360px, calc(100% - 24px)); max-height: min(62vh, 440px); overflow-y: auto; }
.pop .it { width: 100%; text-align: start; background: none; }

/* ---------- customer statement + later-collections line ---------- */
.ic .l.sub { margin-top: 2px; font-size: clamp(11.5px, 2.6vw, 13.5px); }

/* ---------- developer section ---------- */

/* ---- English: left to right ---- */

.tool .lt { font: 800 12px/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .02em; }

html[dir="ltr"] .itbl th, html[dir="ltr"] .itbl td { padding-inline: 3px; }

/* five tools in the home bar (sound, language, theme, bell, logout) must fit small phones */

  .tool { width: 33px; height: 33px; border-radius: 10px; }

}
@media (max-width: 340px) {

}

/* ---- v2.6: cancelled invoices, returns ---- */
.paper .vstamp { position: absolute; z-index: 2; top: 42%; left: 50%; transform: translate(-50%, -50%) rotate(-18deg); font-size: clamp(38px, 12vw, 96px); font-weight: 900; letter-spacing: 2px; color: #c62828; border: 6px solid #c62828; border-radius: 14px; padding: 2px 22px; opacity: .22; pointer-events: none; white-space: nowrap; }
.paper.void .nm, .paper.void td { text-decoration-color: #c62828; }
tr.vd td { color: var(--fg3); }

/* v2.7: stock */
.whs { display: block; font-size: 11px; font-weight: 600; color: var(--fg3); line-height: 1.5; margin-top: 2px; }
td.val.neg { color: var(--red-t); }
.rtbl.inc th:nth-child(1) { width: 72%; } .rtbl.inc th:nth-child(2) { width: 28%; }
.rtbl.inc td:nth-child(1) { white-space: normal; text-align: right; font-size: clamp(11px, 2.4vw, 13.5px); padding-inline-start: 10px; }

.inote { margin: 10px 0 0; font-size: 12px; color: #555; text-align: center; }

/* ---- v2.8: credit limit note, aging paper, dashboard ---- */
.note.over { background: var(--red-soft); border-color: var(--red); color: var(--red-t); }

.rtbl.age tfoot td { font-size: clamp(11px, 2.4vw, 14px); padding: 8px 4px; }
.dash { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.dash .wide { grid-column: 1 / -1; }
@media (max-width: 760px) { .dash { grid-template-columns: minmax(0, 1fr); } }
.bars { display: flex; align-items: flex-end; gap: 10px; height: 190px; padding-top: 6px; }
.bar { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; }
.bar i { display: block; width: 100%; max-width: 58px; min-height: 2px; background: var(--blue); border-radius: 8px 8px 0 0; }
.bar b { font-size: 11px; font-weight: 700; color: var(--fg2); font-variant-numeric: tabular-nums; }
.bar span { font-size: 11px; color: var(--fg3); }
.mini.on { background: var(--blue); color: #fff; border-color: var(--blue); }
/* 9 home tiles: three per row on phones, and tighter rows on short screens, so the alerts stay on the first screen */
@media (max-width: 560px) {
  .home .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 80px; gap: 8px; }
  .home .tile { padding: 6px 4px; font-size: 12.5px; gap: 4px; line-height: 1.25; border-radius: 14px; }
  .home .tile svg { width: 28px; height: 28px; }
}
@media (max-height: 650px) and (min-width: 561px) { .home .tiles { grid-auto-rows: 66px; } .home .tile svg { width: 30px; height: 30px; } }

/* phones: every data table becomes a stack of cards that uses the whole width of the screen, whatever the phone (the JS in 02-util.js gives each plain table the class cardt and each cell its column title in data-l); nothing is hidden behind a sideways scroll.

/* ---------- PIN hashing: salted SHA-256 (sync, pure JS) so PINs are never stored as plain text ---------- */
const sha256 = (() => {
  const K = [], H0 = [];
  for (let n = 2, c = 0; c < 64; n++) {
    let p = true; for (let d = 2; d * d <= n; d++) if (n % d === 0) { p = false; break; }
    if (!p) continue;
    if (c < 8) H0[c] = Math.floor((Math.sqrt(n) % 1) * 4294967296);
    K[c] = Math.floor((Math.cbrt(n) % 1) * 4294967296); c++;
  }
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  return function (str) {
    const b = new TextEncoder().encode(str), l = b.length, n = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(n);
    m.set(b); m[l] = 0x80;
    const dv = new DataView(m.buffer); dv.setUint32(n - 8, Math.floor(l / 536870912)); dv.setUint32(n - 4, (l << 3) >>> 0);
    const h = H0.slice(), w = new Array(64);
    for (let o = 0; o < n; o += 64) {

const subHead = title => `<div class="sub-head"><h1>${esc(title)}</h1><button class="back" data-act="back" aria-label="رجوع">${ICON.back}</button></div>`;

/* ---------- Business logic ---------- */
const itemById = id => db.items.find(i => i.id === id);
const stockValue = () => db.items.reduce((s, i) => s + i.qty * i.cost, 0);
/* warehouses: every item keeps its total (qty) and the part held in each warehouse (wh); stockMove is the only way stock changes */
const whName = id => { const w = db.warehouses.find(x => x.id === id); return w ? w.name : '—'; };
const whQty = (it, w) => round3((it.wh && it.wh[w]) || 0);
function pickWh(it) { /* the warehouse a sale draws from by default: the item's own warehouse when it has stock there, else the one holding the most */
  if (!it) return WH0; const home = it.home && db.warehouses.some(w => w.id === it.home) ? it.home : '';
  if (home && whQty(it, home) > 0) return home;
  let best = '', bq = 0; db.warehouses.forEach(w => { const q = whQty(it, w.id); if (q > bq) { bq = q; best = w.id; } });
  return best || home || WH0;
}
const invPaidAll = i => round2((i.paid || 0) + (i.over || 0)); /* what the customer handed over at issue (the part above the invoice is his deposit) */
function stockMove(it, w, d) { it.wh = it.wh || {}; w = w || WH0; it.wh[w] = round3((+it.wh[w] || 0) + d); it.qty = round3(Object.values(it.wh).reduce((s, x) => s + x, 0)); }
function logMove(it, w, type, qty, ref) { db.moves.push({ id: uid(), date: new Date().toISOString(), itemId: it.id, wh: w || WH0, type, qty: round3(qty), ref: ref || '' }); if (db.moves.length > 20000) db.moves.splice(0, db.moves.length - 20000); }
const lowLimit = i => i.min > 0 ? i.min : 5; /* an item with no minimum of its own warns at 5, as before */
const dayNum = s => { const d = String(s).slice(0, 10).split('-'); return Date.UTC(+d[0], +d[1] - 1, +d[2]) / 864e5; };
const daysTo = s => Math.round(dayNum(s) - dayNum(ymd(new Date()))); /* whole days from today to a date (negative = in the past) */
const liveInvoices = () => db.invoices.filter(i => i.status !== 'void'); /* cancelled invoices stay on file but count for nothing */
const retCreditMap = () => { const m = {}; db.returns.forEach(r => { m[r.invId] = round2((m[r.invId] || 0) + (r.credit || 0)); }); return m; }; /* the part of each return taken off what the customer still owes */
const voidIds = () => new Set(db.invoices.filter(i => i.status === 'void').map(i => i.id));
const payVoided = (p, vd = voidIds()) => round2((p.alloc || []).filter(a => vd.has(a.inv)).reduce((s, a) => s + a.a, 0)); /* the part of a collection that sat on an invoice later cancelled: it went back to the customer, so it settles nothing */
function customerDebt(cid) {
  const rc = retCreditMap(), vd = voidIds();
  const inv = db.invoices.filter(i => i.customerId === cid && i.status !== 'void').reduce((s, i) => s + i.remaining - (rc[i.id] || 0), 0);
  const pay = db.payments.filter(p => p.customerId === cid).reduce((s, p) => s + p.amount - payVoided(p, vd), 0);
  return Math.max(round2(inv - pay), 0);
}
/* ---------- Collections are tied to invoices: every payment records which invoices it settled (oldest first) ---------- */
function settledMap() { const m = {}; db.payments.forEach(p => (p.alloc || []).forEach(a => { m[a.inv] = round2((m[a.inv] || 0) + a.a); })); return m; }
const invSettled = (i, m = settledMap()) => m[i.id] || 0; /* collected after the invoice was issued */
const invLeft = (i, m = settledMap(), rc = retCreditMap()) => i.status === 'void' ? 0 : Math.max(round2(i.remaining - (m[i.id] || 0) - (rc[i.id] || 0)), 0);
const invPaidNow = (i, m = settledMap()) => round2(i.paid + (m[i.id] || 0));
const byDate = (a, b) => String(a.date) < String(b.date) ? -1 : String(a.date) > String(b.date) ? 1 : 0;
function allocate(cid, amount, onlyInv) { /* split a collection over the customer's open invoices, oldest first */
  const m = settledMap(), out = []; let left = round2(amount);
  db.invoices.filter(i => i.customerId === cid && i.status !== 'void' && (!onlyInv || i.id === onlyInv)).sort(byDate).forEach(i => {
    const open = invLeft(i, m);
    if (open > 0 && left > 0) { const a = round2(Math.min(open, left)); out.push({ inv: i.id, no: i.no, a }); left = round2(left - a); }
  });
  return out;
}
function linkPayments() { const old = db.payments.filter(p => !Array.isArray(p.alloc)).sort(byDate); old.forEach(p => { p.alloc = allocate(p.customerId, p.amount); }); return old.length; }
const invPays = i => db.payments.flatMap(p => (p.alloc || []).filter(a => a.inv === i.id).map(a => ({ id: p.id, date: p.date, a: a.a })));
if (linkPayments()) save(); /* old collections get tied to the invoices they settled (runs once; later loads find alloc already set) */
const invCost = i => i.rows.reduce((s, l) => s + l.qty * (l.cost || 0), 0);
const invProfit = i => round2((i.subtotal - i.discAmt) - invCost(i)); /* sales after discount, before VAT, minus cost of goods */
const invRetNet = i => round2(db.returns.filter(r => r.invId === i.id).reduce((s, r) => s + r.net, 0)); /* value of what came back on this invoice */
const customerTotal = cid => round2(db.invoices.filter(i => i.customerId === cid && i.status !== 'void').reduce((s, i) => s + i.net - invRetNet(i), 0));
function notifications() {
  const out = [];
  db.items.filter(i => i.qty <= 0).forEach(i => out.push({ c: 'var(--red)', to: 'invView', t: `نفد الصنف «${i.name}» من المخزن` }));
  db.items.filter(i => i.qty > 0 && i.qty <= lowLimit(i)).forEach(i => out.push({ c: 'var(--amber)', to: i.min > 0 ? 'shopList' : 'invView', t: `رصيد «${i.name}» منخفض: ${fmtq(i.qty)} ${i.unit}${i.min > 0 ? ` (الحد الأدنى ${fmtq(i.min)})` : ''}` }));
  db.cheques.filter(c => c.status === 'pending' && daysTo(c.due) <= 3).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 8).forEach(c => {
    const n = daysTo(c.due), when = n < 0 ? `متأخر ${-n} يوم` : n === 0 ? 'يستحق اليوم' : `يستحق بعد ${n} يوم`;
    out.push({ c: n < 0 ? 'var(--red)' : 'var(--amber)', to: 'cheques', t: c.kind === 'in' ? `شيك وارد رقم ${c.no} من ${c.name} بمبلغ ${money(c.amount)}: ${when}` : `شيك صادر رقم ${c.no} إلى ${c.name} بمبلغ ${money(c.amount)}: ${when}` });
  });
  db.deliveries.filter(x => (x.status === 'pending' || x.status === 'out') && x.date && daysTo(x.date) <= 0).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 6).forEach(x => {
    const n = daysTo(x.date), st = n < 0 ? `متأخر ${-n} يوم` : x.status === 'out' ? 'في الطريق اليوم' : 'موعده اليوم';
    out.push({ c: n < 0 ? 'var(--red)' : 'var(--amber)', to: 'deliveries', t: x.invNo ? `توصيل ${x.name} (فاتورة ${x.invNo}): ${st}` : `توصيل ${x.name}: ${st}` });
  });
  db.quotes.filter(q => q.status === 'open' && q.valid && daysTo(q.valid) >= 0 && daysTo(q.valid) <= 2).sort((a, b) => a.valid.localeCompare(b.valid)).slice(0, 4).forEach(q => {
    const n = daysTo(q.valid); out.push({ c: 'var(--amber)', to: 'quotes', t: `عرض السعر رقم ${q.no} لـ ${q.name}: ${n === 0 ? 'ينتهي اليوم' : `ينتهي بعد ${n} يوم`}` });
  });
  db.customers.filter(c => c.limit > 0 && customerDebt(c.id) > c.limit).forEach(c => out.push({ c: 'var(--red)', to: 'debts', t: `تجاوز ${c.name} حده الائتماني (${money(customerDebt(c.id))} من ${money(c.limit)})` }));
  db.customers.map(c => ({ c, d: customerDebt(c.id) })).filter(x => x.d > 0).sort((a, b) => b.d - a.d).slice(0, 6)
    .forEach(x => out.push({ c: 'var(--blue)', to: 'customers', t: `على ${x.c.name} مبلغ ${money(x.d)}` }));
  return out.filter(n => canScreen(n.to)); /* nobody is told about screens he cannot open */
}

/* ---------- The red dot on the bell means "something new you have not seen": opening the bell marks what is listed as seen (kept on this device only); a different alert makes it come back ---------- */

/* ---------- Click sound: the dry little "tok" of a key on the iPhone keyboard, made from numbers with the Web Audio API (no audio files); can be muted from the home bar ----------
   About 25 ms: a sharp tap, a small wooden body near 1.25 kHz that dies in ~12 ms, a bright overtone and just a hint of weight underneath. The same on every device. */
let AC = null, lastTick = 0, tickBuf = null, tickRate = 0;
function tickWave(sr) { /* the samples of one click at sample rate sr (peak 0.5) */
  const n = Math.round(sr * .06), d = new Float32Array(n); let seed = 20261116, ph = 0, prev = 0, pk = 0;
  const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 2147483648 - 1; }; /* the same noise every time */
  for (let i = 0; i < n; i++) {
    const t = i / sr, atk = 1 - Math.exp(-t / .0002); /* 0.2 ms rise: no pop at the very start */
    const x = rnd(), tap = (x - prev) * Math.exp(-t / .0012); prev = x; /* the tap: noise with the lows taken out, gone in ~3 ms */
    ph += 2 * Math.PI * 1250 * (1 + .12 * Math.exp(-t / .008)) / sr; /* the body: 1.25 kHz, starts a little higher */
    d[i] = atk * (.9 * Math.sin(ph) * Math.exp(-t / .006) + .3 * Math.sin(2 * Math.PI * 2800 * t) * Math.exp(-t / .0035) + .12 * Math.sin(2 * Math.PI * 220 * t) * Math.exp(-t / .006)) + .55 * tap;
    pk = Math.max(pk, Math.abs(d[i]));
  }
  const fade = Math.round(sr * .006); for (let i = 0; i < fade; i++) d[n - 1 - i] *= i / fade; /* the last 6 ms fade out: no click at the end */
  for (let i = 0; i < n; i++) d[i] = d[i] / pk * .5;

}

  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    AC = AC || new A(); if (AC.state === 'suspended') AC.resume();
    if (!tickBuf || tickRate !== AC.sampleRate) { const w = tickWave(AC.sampleRate); tickBuf = AC.createBuffer(1, w.length, AC.sampleRate); tickBuf.getChannelData(0).set(w); tickRate = AC.sampleRate; }

    s.connect(g); g.connect(AC.destination); s.start(AC.currentTime);

}

/* automatic folder (Chrome / Edge on a computer): the folder handle lives in this browser's IndexedDB */
const canFolder = () => typeof window.showDirectoryPicker === 'function' && typeof indexedDB !== 'undefined';
const idbOpen = () => new Promise((res, rej) => { const r = indexedDB.open('accounts-backup', 1); r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const idbGet = async k => { const d = await idbOpen(); return new Promise(res => { const q = d.transaction('h').objectStore('h').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); };
const idbSet = async (k, v) => { const d = await idbOpen(); return new Promise((res, rej) => { const t = d.transaction('h', 'readwrite'); t.objectStore('h').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); };
async function folderState() {
  try { const h = await idbGet(KEY); if (!h) return { h: null, ok: false }; return { h, ok: (await h.queryPermission({ mode: 'readwrite' })) === 'granted' }; } catch (e) { return { h: null, ok: false }; }
}
async function pickBackupFolder() {
  try { const h = await window.showDirectoryPicker({ mode: 'readwrite' }); await idbSet(KEY, h); db.settings.autoDir = h.name; logA('backup', 'اختيار مجلد النسخ التلقائي'); save(); await autoBackup(true); return true; }
  catch (e) { return false; }
}
async function allowFolder() { try { const h = await idbGet(KEY); if (h && (await h.requestPermission({ mode: 'readwrite' })) === 'granted') { await autoBackup(true); return true; } } catch (e) { /* refused */ } return false; }
async function autoBackup(force) {
  if (!BACKUP_OK || !db.settings.autoDir || (!force && !bkDirty)) return false;
  const st = await folderState(); if (!st.ok) return false;
  try {
    const name = 'backup-' + ymd(new Date()) + '.json', f = await st.h.getFileHandle(name, { create: true }), w = await f.createWritable();
    await w.write(JSON.stringify(backupObj())); await w.close();
    const names = []; for await (const [n, e] of st.h.entries()) if (e.kind === 'file' && /^backup-\d{4}-\d{2}-\d{2}\.json$/.test(n)) names.push(n);
    names.sort().slice(0, Math.max(0, names.length - 14)).forEach(n => st.h.removeEntry(n).catch(() => {})); /* keep the newest 14 days */
    bkDirty = false; db.settings.lastBackup = new Date().toISOString(); db.settings.lastAuto = db.settings.lastBackup; try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* memory only */ }
    return true;
  } catch (e) { return false; }
}
setInterval(() => { if (BACKUP_OK && db.settings.autoDir) autoBackup(false); }, 5 * 60 * 1000);
setTimeout(() => { if (BACKUP_OK && db.settings.autoDir) autoBackup(true); }, 4000);

/* ---------- Phone layout: a data table becomes a stack of cards on a narrow screen (CSS: table.cardt). Every plain table gets that class here and each cell its column title (data-l),
   so no screen has to be changed one by one and a phone of any size shows the whole row. Runs again whenever the page changes (a new screen, a redrawn list, a translated heading). ---------- */
function cardTables(scope) {
  (scope || document).querySelectorAll('table.grid, table.tbl:not(.items-t)').forEach(t => {
    const hr = t.querySelector('thead tr'); if (!hr) return;
    t.classList.add('cardt');
    const names = []; [...hr.children].forEach(h => { const n = (h.textContent || '').replace(/\s+/g, ' ').trim(); for (let k = 0, m = h.colSpan || 1; k < m; k++) names.push(n); });
    t.querySelectorAll('tbody > tr').forEach(r => {
      let i = 0;
      [...r.children].forEach(td => {
        const span = td.colSpan || 1;
        if (span === 1) { if (!td.hasAttribute('data-l') && names[i]) td.setAttribute('data-l', names[i]); }
        else td.classList.add('full');
        const act = !!td.querySelector('.actions') || (td.children.length > 0 && [...td.children].every(c => c.tagName === 'BUTTON'));
        if (act) td.classList.add('act', 'full');
        else if (td.querySelector('select, textarea, .sel') || (td.textContent || '').trim().length > 24) td.classList.add('full');
        td.classList.toggle('nil', !td.children.length && !(td.textContent || '').trim());
        i += span;
      });
    });
  });
}
(() => {
  let queued = false;
  const run = () => { queued = false; try { cardTables(document.body); } catch (e) { /* layout only: never stop the program */ } };
  new MutationObserver(() => { if (!queued) { queued = true; requestAnimationFrame(run); } }).observe(document.body, { childList: true, subtree: true, characterData: true });
  queued = true; requestAnimationFrame(run);
})();

/* another tab changed the data: take the new copy so two tabs can never overwrite each other with an old one */
window.addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  let o; try { o = JSON.parse(e.newValue); } catch (x) { return; }
  if (!o || !Array.isArray(o.invoices) || !o.settings) return;
  db = o; migrateSettings(db.settings); upgradeDB(db);
  if ($('.lock')) return; /* the lock screen stays; the screens read the new data once it is unlocked */
  const m = $('#modals'); if (m) m.innerHTML = '';
  if (cur.name === 'invForm') toast('تغيّرت البيانات من نافذة أخرى، راجع الكميات قبل إصدار الفاتورة'); else { render(); toast('تم تحديث البيانات بعد تغييرها من نافذة أخرى'); }
});

function itemEdit(it) {
  modal(`<h3>تعديل (${esc(it.name)}):</h3><div class="field"><label for="e-cost">سعر الشراء</label><input id="e-cost" class="inp" inputmode="decimal" value="${it.cost || 0}" autocomplete="off"></div>

    <div class="field"><label for="e-wh">مخزن الصنف</label><div class="sel"><select id="e-wh">${db.warehouses.map(w => `<option value="${esc(w.id)}"${w.id === (it.home || WH0) ? ' selected' : ''}>${esc(w.name)}</option>`).join('')}</select></div></div>
    <div class="field"><label for="e-min">الحد الأدنى للمخزون (0 = بدون)</label><input id="e-min" class="inp" inputmode="decimal" value="${it.min || 0}" autocomplete="off"></div><div class="actions"><button class="btn ok" data-ok>تأكيد</button><button class="btn outline" data-no>إلغاء</button></div>`, (d, close) => {
    const inp = $('#e-price', d); setTimeout(() => inp.select(), 0);
    const mn = $('#e-min', d), cs = $('#e-cost', d); [inp, mn, cs].forEach(x => x.addEventListener('input', () => { x.value = cleanNum(x.value); }));
    const ok = async () => {
      const val = num(inp.value), m = Math.max(round3(num(mn.value)), 0), c = Math.max(round2(num(cs.value)), 0), h = $('#e-wh', d).value || WH0; if (val <= 0) return toast('اكتب سعر بيع أكبر من صفر');
      close(); if (!await requireAdmin()) return;
      if (round2(val) !== it.price) logA('item_price', it.name, money(round2(val))); if (m !== (it.min || 0)) logA('item_min', it.name, fmtq(m));
      if (c !== (it.cost || 0)) logA('item_cost', it.name, money(c)); if (h !== (it.home || WH0)) logA('item_home', it.name, whName(h));
      it.price = round2(val); it.min = m; it.cost = c; it.home = h; save(); render(); toast('تم التعديل بنجاح', 'ok');
    };
    $('[data-ok]', d).onclick = ok; [inp, mn, cs].forEach(x => onEnter(x, ok)); $('[data-no]', d).onclick = close;
  });
}

  </section>`;
  let paidTouched = false;
  const buyTotal = () => round2(num($('#a-qty').value) * num($('#a-cost').value));
  const syncBuy = () => {
    const sid = $('#a-sup').value, on = sid && sid !== '__new';
    $('#a-paidw').hidden = !on; $('#a-hint').hidden = !on;
    if (!on) return;
    if (!paidTouched) $('#a-paid').value = buyTotal() || '';
    const left = Math.max(round2(buyTotal() - num($('#a-paid').value)), 0);
    $('#a-hint').textContent = `إجمالي المشتريات ${money(buyTotal())}${left > 0 ? ` — يبقى للمورد ${money(left)}` : ' — مدفوعة بالكامل'}`;
  };
  ['a-qty', 'a-cost', 'a-price', 'a-paid'].forEach(id => $('#' + id).addEventListener('input', e => { e.target.value = cleanNum(e.target.value); if (id === 'a-paid') paidTouched = true; syncBuy(); }));

      return;

      const now = new Date().toISOString();
      db.purchases.push({ id: uid(), supplierId: sup.id, itemId: it.id, name, qty, cost, total, date: now });

/* ---------- Invoice form ---------- */
let inv = null;
const blankRow = () => ({ itemId: '', qty: '', price: '', wh: '' });
const rowWh = r => r.wh || inv.wh || WH0; /* each line draws from its own warehouse */
function usedElsewhere(i) { const r = inv.rows[i], w = rowWh(r); return inv.rows.reduce((s, x, k) => s + (k !== i && x.itemId === r.itemId && rowWh(x) === w ? num(x.qty) : 0), 0); }
const backQty = (id, w) => (inv && inv.back && inv.back[w + '|' + id]) || 0; /* when editing, what the old invoice took out of each warehouse comes back */
function available(i) { const r = inv.rows[i], it = itemById(r.itemId), w = rowWh(r); return it ? Math.max(round3(whQty(it, w) + backQty(it.id, w) - usedElsewhere(i)), 0) : 0; }
const custById = id => db.customers.find(c => c.id === id);
const specialPrice = itemId => { const c = inv && inv.cid ? custById(inv.cid) : null, q = c && c.prices ? +c.prices[itemId] : 0; return q > 0 ? q : 0; }; /* this customer's own price for the item (0 = none) */
const basePrice = it => specialPrice(it.id) || it.price;
function unitPrice(r) { const it = itemById(r.itemId); return r.price !== '' ? num(r.price) : (it ? basePrice(it) : 0); }
const rowTotal = r => num(r.qty) * unitPrice(r);
const CASH_NAME = 'مبيعات نقدية مباشرة';
/* open booking deposits that belong to the customer being invoiced (matched by registry id, phone or exact name) */
function openBookingsFor() {
  if (!inv || inv.mode === 'cash') return [];
  const ph = toLat(inv.phone).trim(), nm = inv.name.trim();
  return db.bookings.filter(b => bkOpenFor(b) > 0 && (inv.cid ? b.customerId === inv.cid : ((ph && b.phone === ph) || (nm && b.name === nm))))
    .sort((a, b) => a.date.localeCompare(b.date));
}
const bkOpenFor = b => round2(bkOpen(b) + (inv && inv.editNo ? b.uses.filter(u => u.inv === inv.editNo).reduce((s, u) => s + u.a, 0) : 0)); /* a deposit the old invoice used is free again while editing */
const depAvail = () => round2(openBookingsFor().reduce((s, b) => s + bkOpenFor(b), 0));
const depApplied = t => (inv.dep ? Math.min(depAvail(), t.net) : 0);
function totals() {
  const items = round2(inv.rows.reduce((s, r) => s + round2(rowTotal(r)), 0)); /* the sum of the printed line totals */
  const tr = Math.max(round2(num(inv.trans)), 0), sub = round2(items + tr); /* "نقل" is one more line of the invoice, its amount typed by hand */
  const dp = Math.min(100, Math.max(0, num(inv.disc)));
  const discAmt = round2(sub * dp / 100), after = round2(sub - discAmt);
  const vatAmt = inv.vat && taxOn() ? round2(after * db.settings.vat / 100) : 0;
  return { sub, items, tr, dp, discAmt, vatAmt, net: round2(after + vatAmt) };
}

/* show/hide the "use booking deposit" box for the customer on the form */
function refreshDep() {
  const av = depAvail(), box = $('#depBox');
  if (!av) inv.dep = false;
  if (box) { box.hidden = !av; $('#dep').checked = inv.dep; $('#depTxt').textContent = `خصم عربون الحجز (متاح ${fmt(av)} جنيه)`; }
  calc();
}

function calc() {
  const t = totals(), dep = depApplied(t), due = round2(t.net - dep);
  inv.rows.forEach((r, i) => { const el = $('#r' + i + '-tot'); if (el) el.textContent = fmt(rowTotal(r)); });
  const cashM = inv.mode === 'cash'; if (cashM) { inv.paid = String(due); $('#paid').value = inv.paid; } /* a cash sale is paid in full; otherwise the paid box stays as typed (zero until then) */
  $('#depRow').hidden = !dep; $('#s-dep').textContent = money(dep);
  $('#s-sub').textContent = money(t.items); $('#trRow').hidden = !(t.tr > 0); $('#s-tr').textContent = money(t.tr);
  $('#s-disc').textContent = fmt(t.dp) + ' %';
  $('#vatRow').hidden = !inv.vat; $('#s-vat').textContent = money(t.vatAmt);
  const rem = round2(due - num(inv.paid)); /* below zero = the customer paid more than the invoice */
  $('#s-rem').textContent = rem < 0 ? '− ' + money(-rem) : money(rem);
  $('#s-rem-l').textContent = rem < 0 ? 'المتبقي للعميل' : rem > 0 ? 'المتبقي (آجل على العميل)' : 'المتبقي';
  const rr = $('#remRow'); rr.classList.toggle('cr', rem < 0); rr.classList.toggle('clear', rem === 0);
  const pf = $('#paidF'), zero = !cashM && due > 0 && num(inv.paid) <= 0;
  if (pf) { pf.classList.toggle('zero', zero); pf.classList.toggle('ok', !cashM && !zero && due > 0); const hn = $('#paidHint'); if (hn) { hn.hidden = !zero; hn.textContent = zero ? 'لم يُسدَّد أي مبلغ — الفاتورة كلها آجل على العميل. اكتب المدفوع إن وُجد أو اضغط «سداد كامل».' : ''; } const pb = $('#payFull'); if (pb) pb.hidden = !(due > 0) || num(inv.paid) === due; }
  const on = $('#overNote'); if (on) {
    on.hidden = !(rem < 0);
    if (rem < 0) { const bks = dep > 0 ? openBookingsFor() : [], known = inv.cid || inv.save || bks.length; on.classList.toggle('over', !known); on.innerHTML = `<span>الزيادة (${money(-rem)}) تُسجَّل رصيداً للعميل (عربون) ويُخصم من فاتورته القادمة${known ? '' : ' — احفظ العميل في السجل (أو اختر عميلاً مسجَّلاً) ليُسجَّل له الرصيد.'}</span>`; }
  }
  const ln = $('#limNote'), cu = inv.mode !== 'cash' && inv.cid ? custById(inv.cid) : null;
  if (ln) { /* the customer's credit limit, live */
    if (cu && cu.limit > 0) { const after = projectedDebt(cu.id, Math.max(rem, 0)); ln.hidden = false; ln.classList.toggle('over', after > cu.limit + 0.004); const ov = after > cu.limit + 0.004; ln.innerHTML = `<span>${ov ? '<b>تنبيه:</b> ' : ''}<span>الحد الائتماني للعميل ${money(cu.limit)} — رصيده الحالي ${money(customerDebt(cu.id))} — بعد هذه الفاتورة ${money(after)}</span>${ov ? ' <b>(يتجاوز الحد)</b>' : ''}</span>`; }
    else ln.hidden = true;
  }
}

function onInput(e) {
  const t = e.target;
  if (t.dataset.f && t.type !== 'checkbox') { inv[t.dataset.f] = t.value; if (t.dataset.f === 'name' || t.dataset.f === 'phone') refreshDep(); return; }
  if (t.dataset.r !== undefined && t.dataset.k !== 'item' && t.dataset.k !== 'wh') {
    const i = +t.dataset.r, r = inv.rows[i];
    t.value = cleanNum(t.value); r[t.dataset.k] = t.value;
    if (t.dataset.k === 'qty' && t.value !== '') {
      if (!r.itemId) { toast('اختر الصنف أولاً'); r.qty = ''; t.value = ''; }
      else {
        const av = available(i);
        if (num(r.qty) > av) { toast(`الكمية المتبقية المتاحة في المخزن هي ${fmtq(av)} فقط!`); r.qty = String(av); t.value = r.qty; }
      }
    }
    calc(); return;
  }
  if (t.id === 'trans') { t.value = cleanNum(t.value); inv.trans = t.value; calc(); return; }
  if (t.id === 'disc') {
    t.value = cleanNum(t.value); if (num(t.value) > 100) t.value = '100'; inv.disc = t.value; calc(); return;
  }
  if (t.id === 'paid') {
    t.value = cleanNum(t.value); inv.paidTouched = true; inv.paid = t.value; calc();
  }
}

function onChange(e) {
  const t = e.target;
  if (t.id === 'c-save') { inv.save = t.checked; return; }
  if (t.dataset.r !== undefined && t.dataset.k === 'wh') { /* another warehouse for this line: what is available changes, so the quantities are checked again */
    inv.rows[+t.dataset.r].wh = t.value; let cut = false;
    inv.rows.forEach((r, i) => { if (r.itemId && num(r.qty) > available(i)) { r.qty = available(i) > 0 ? String(available(i)) : ''; cut = true; } });
    if (cut) toast('عُدّلت الكميات حسب المتاح في هذا المخزن'); drawRows(); calc(); return;
  }
  if (t.id === 'vat') { inv.vat = t.checked; calc(); return; }
  if (t.id === 'dep') { inv.dep = t.checked; calc(); return; }
  if (t.dataset.r !== undefined && t.dataset.k === 'item') {
    const i = +t.dataset.r, r = inv.rows[i];
    if (!t.value) { r.itemId = ''; r.wh = ''; r.price = ''; drawRows(); calc(); return; }
    r.itemId = t.value; r.wh = pickWh(itemById(t.value));
    if (available(i) <= 0) { toast('الصنف غير متوفر'); r.itemId = ''; r.wh = ''; r.qty = ''; r.price = ''; drawRows(); calc(); return; }
    r.price = '';
    if (num(r.qty) > available(i)) r.qty = String(available(i));

}

function onClick(e) {
  const d = e.target.closest('[data-del-row]');
  if (d) {
    inv.rows.splice(+d.dataset.delRow, 1);
    if (!inv.rows.length) inv.rows.push(blankRow());
    drawRows(); calc(); return;
  }
  if (e.target.closest('#addRow')) { inv.rows.push(blankRow()); drawRows(); calc(); return; }
  if (e.target.closest('#payFull')) { const t0 = totals(); inv.paid = String(round2(t0.net - depApplied(t0))); inv.paidTouched = true; $('#paid').value = inv.paid; calc(); return; }
  if (e.target.closest('#issue')) issueInvoice();
}

let issuing = false;
const projectedDebt = (cid, rem) => { const old = inv.editOf ? db.invoices.find(x => x.id === inv.editOf) : null; return round2(Math.max(customerDebt(cid) - (old && old.customerId === cid ? old.remaining : 0), 0) + rem); };
async function issueInvoice() {
  if (issuing) return; issuing = true;
  try { if (await creditOk()) issueCore(); } finally { issuing = false; }
}
/* a credit sale that takes the customer past his credit limit needs the admin's approval */
async function creditOk() {
  inv.over = null; if (inv.mode === 'cash') return true;
  const t = totals(), dep = depApplied(t), due = round2(t.net - dep), rem = round2(Math.max(due - Math.min(num(inv.paid), due), 0));
  const bks = dep > 0 ? openBookingsFor() : [], cid = inv.cid || (bks.length ? bks[0].customerId : null), c = cid ? custById(cid) : null;
  if (!c || !(c.limit > 0) || rem <= 0) return true;
  const after = projectedDebt(c.id, rem); if (after <= c.limit + 0.004) return true;
  if (!await confirmBox('', `حد ${c.name} الائتماني ${money(c.limit)}، وسيصل رصيده بعد هذه الفاتورة إلى ${money(after)}. هل تريد إصدار الفاتورة رغم ذلك؟`, 'نعم، أصدرها', false)) return false;
  if (!await requireAdmin('اكتب الرقم السري للمسؤول لتجاوز الحد الائتماني')) return false;
  inv.over = [c.name, money(after), money(c.limit)]; return true;
}
function issueCore() {
  const cash = inv.mode === 'cash', name = cash ? CASH_NAME : inv.name.trim();
  if (!name) { toast('اكتب اسم العميل'); $('#c-name').focus(); return; }
  const rows = inv.rows.filter(r => r.itemId && num(r.qty) > 0);
  if (!rows.length) { toast('أضف صنفاً واحداً على الأقل بكمية صحيحة'); return; }
  const need = {};
  rows.forEach(r => { const k = rowWh(r) + '|' + r.itemId; need[k] = round3((need[k] || 0) + round3(num(r.qty))); });
  for (const k in need) { const [w, id] = k.split('|'), it = itemById(id); if (!it || need[k] > whQty(it, w) + backQty(id, w) + 1e-9) { toast(`الكمية المطلوبة من «${it ? it.name : 'الصنف'}» أكبر من المتاح`); return; } }
  const t = totals(), dep = depApplied(t), due = round2(t.net - dep), paidAll = cash ? t.net : round2(num(inv.paid)), paid = Math.min(paidAll, due), over = round2(Math.max(paidAll - due, 0));
  if (over > 0 && !(inv.cid || inv.save || (dep > 0 && openBookingsFor().length))) { toast('لتسجيل الزيادة رصيداً للعميل احفظه في السجل أولاً أو اختر عميلاً مسجَّلاً'); return; }
  /* customer */
  let cid = cash ? null : inv.cid;
  const bks = dep > 0 ? openBookingsFor() : [];
  if (!cid && bks.length) cid = bks[0].customerId; /* the invoice belongs to the booking's registered customer */
  if (!cid && inv.save && !cash) {
    const phone = toLat(inv.phone).trim();
    let c = db.customers.find(x => (phone && x.phone === phone) || x.name === name);
    if (c) { c.name = name; if (phone) c.phone = phone; if (inv.addr.trim()) c.address = inv.addr.trim(); }
    else { c = { id: uid(), name, phone, address: inv.addr.trim() }; db.customers.push(c); }
    cid = c.id;
  }
  /* editing: the old invoice is cancelled first (its stock and booking deposit come back), then the new one is issued */
  const oldInv = inv.editOf ? db.invoices.find(x => x.id === inv.editOf) : null;
  if (oldInv) { const ok = canVoid(oldInv); if (!ok.ok) { toast(ok.why); return; }
    const coll = invSettled(oldInv), newRem = round2(Math.max(due - paid, 0)); /* the instalments already collected move over to the new invoice, so they must fit under it and stay with the same customer */
    if (coll > 0 && (cid || null) !== (oldInv.customerId || null)) { toast('عليها تحصيلات من عميلها الحالي، فلا يمكن نقلها إلى عميل آخر'); return; }
    if (coll > newRem + 0.004) { toast(`المحصَّل لاحقاً على الفاتورة ${money(coll)} أكبر من المتبقي على الفاتورة الجديدة ${money(newRem)}. ارفع قيمتها أو ألغِ الفاتورة ليُرد المحصَّل للعميل`); return; }
    voidCore(oldInv, 'تعديل الفاتورة', true); }
  /* stock + invoice */
  const lines = rows.map(r => { const it = itemById(r.itemId); const price = unitPrice(r); return { itemId: it.id, name: it.name, unit: it.unit, qty: round3(num(r.qty)), price, cost: it.cost, total: round2(round3(num(r.qty)) * price), wh: rowWh(r) }; });
  lines.forEach(l => stockMove(itemById(l.itemId), l.wh, -l.qty));
  db.seq += 1;
  const rec = {
    id: uid(), no: String(db.seq).padStart(4, '0'), date: new Date().toISOString(), customerId: cid || null, wh: lines[0].wh,
    name, phone: toLat(inv.phone).trim(), addr: inv.addr.trim(), rows: lines, transport: t.tr, subtotal: t.sub, discPct: t.dp, discAmt: t.discAmt,
    vatOn: inv.vat && taxOn(), vatPct: db.settings.vat, vatAmt: t.vatAmt, net: t.net, paid: round2(paid), over, deposit: dep, kind: cash ? 'cash' : 'credit',
    remaining: round2(Math.max(due - paid, 0)),
  };
  if (oldInv) { rec.replaces = oldInv.no; oldInv.replacedBy = rec.no; db.payments.forEach(x => (x.alloc || []).forEach(a => { if (a.inv === oldInv.id) { a.inv = rec.id; a.no = rec.no; } })); } /* its instalments now belong to the new invoice */
  if (dep > 0) { /* consume the customer's booking deposits, oldest first */
    let left = dep;
    bks.forEach(b => { const a = Math.min(left, bkOpen(b)); if (a > 0) { b.uses.push({ a: round2(a), inv: rec.no, date: rec.date }); left = round2(left - a); } });
  }
  const fromQ = inv.quote ? db.quotes.find(x => x.id === inv.quote && x.status === 'open') : (oldInv && oldInv.fromQuote ? db.quotes.find(x => x.no === oldInv.fromQuote) : null);
  if (fromQ) { fromQ.status = 'done'; fromQ.invNo = rec.no; rec.fromQuote = fromQ.no; if (inv.quote) logA('q_inv', `عرض سعر ${fromQ.no}`, `فاتورة ${rec.no}`, name); }
  if (over > 0) { /* what the customer paid above the invoice stays with us as his deposit, to be taken off his next invoice (or paid back) */
    const cu = custById(cid); db.bookings.push({ id: uid(), customerId: cid, name: cu ? cu.name : name, phone: cu ? (cu.phone || '') : rec.phone, desc: `رصيد زائد من فاتورة ${rec.no}`, amount: over, date: rec.date, uses: [], refunds: [], fromInv: rec.no });
    logA('bk_add', cu ? cu.name : name, money(over), 'رصيد زائد', `فاتورة ${rec.no}`);
  }
  if (inv.over) { logA('limit_over', ...inv.over, `فاتورة ${rec.no}`); inv.over = null; }
  db.invoices.push(rec); logA(oldInv ? 'inv_edit' : 'inv_add', oldInv ? `تعديل فاتورة ${oldInv.no} ← فاتورة ${rec.no}` : `فاتورة ${rec.no}`, name, money(rec.net)); save();
  toast(oldInv ? 'تم التعديل: أُلغيت الفاتورة القديمة وأُصدرت فاتورة جديدة' : 'تم إصدار الفاتورة وخصم الكميات من المخزن', 'ok');
  go('invDetail', { id: rec.id }, { replace: true });
}

async function autoDocFile(o) { /* the PDF of the paper (the same file the share button makes) */
  const key = pdfKey(o.base, o.no, o.html); let f = PDF_CACHE.get(key) || null;
  if (!f) { try { f = await paperPdf(o.html, pdfName(o.base, o.no)); PDF_CACHE.set(key, f); } catch (e) { f = null; } }
  return f;
}
async function autoSendDoc(o) {
  const A = autoCfg(), to = waPhone(o.phone);
  if (!to) return toast('رقم العميل غير مكتوب أو غير صحيح');
  toast('جاري الإرسال عبر n8n…');
  let doc = null; if (A.pdf) { try { const f = await autoDocFile(o); if (f) doc = { name: f.name, mime: 'application/pdf', base64: await fileB64(f) }; } catch (e) { doc = null; } }
  const ev = AUTO_EVT[o.base] || 'document', r = await autoPost(A.url, A.hdr, A.key, autoBase(ev, { to, name: o.what || '', text: o.full || o.cap || '', caption: o.cap || '', doc }));
  autoLog(ev, to, o.what, r);
  if (r.ok) toast('تم إرسال الطلب إلى n8n', 'ok'); else toast(autoWhy(r));
}
async function autoRoute(o) { /* true = handled here (sent, or cancelled); false = carry on with the normal WhatsApp window */
  const A = autoCfg(); if (autoIsTrial() || !A.on || !autoUrlOk(A.url)) return false;
  const how = A.mode === 'auto' ? 'auto' : await autoAsk(o);
  if (how === null) return true; if (how === 'manual') return false;
  await autoSendDoc(o); return true;
}

/* ----- the n8n file he imports once (Workflows ▸ Import from file) -----
   Verified on a real n8n 2.x: header-key auth, CORS preflight with the custom header, test / text / document branches.
   Credentials and the sender phone number are left empty on purpose: he picks his own inside n8n. */
function autoWorkflow() {
  const B = "$('Mina.Dev Webhook').item.json.body", id = n => '6c1f0a10-0000-4000-8000-0000000000' + n;
  const cond = (n, left, right, op) => ({ options: { caseSensitive: true, leftValue: '', typeValidation: 'strict', version: 2 }, conditions: [{ id: id(n), leftValue: left, rightValue: right, operator: op }], combinator: 'and' });
  const wa = (n, name, pos, extra) => ({ parameters: Object.assign({ operation: 'send', phoneNumberId: '', recipientPhoneNumber: '={{ ' + B + '.to }}' }, extra), id: id(n), name, type: 'n8n-nodes-base.whatsApp', typeVersion: 1.1, position: pos });
  const reply = (n, name, pos, msg) => ({ parameters: { respondWith: 'json', responseBody: '={{ { ok: true, message: "' + msg + '" } }}', options: {} }, id: id(n), name, type: 'n8n-nodes-base.respondToWebhook', typeVersion: 1.1, position: pos });
  const link = (to, i) => ({ node: to, type: 'main', index: i || 0 });
  return {
    name: 'Mina.Dev - WhatsApp sender',
    nodes: [
      { parameters: { content: '## Mina.Dev - WhatsApp sender\n\n1. Open **Mina.Dev Webhook** and choose (or create) a **Header Auth** credential: the header name and value must be the same as in the Mina.Dev app.\n2. Open both **WhatsApp** nodes, choose your **WhatsApp Business Cloud** credential and pick the **Sender Phone Number**.\n3. Activate the workflow, copy the **Production URL** of the webhook and paste it into Mina.Dev (Settings > WhatsApp automation).\n\nNote: WhatsApp only lets a business send free-form messages and documents to people who wrote to it in the last 24 hours. Otherwise use an approved template message.', height: 300, width: 520 }, id: id('01'), name: 'Read me', type: 'n8n-nodes-base.stickyNote', typeVersion: 1, position: [-380, -40] },
      { parameters: { httpMethod: 'POST', path: 'mina-dev-whatsapp', authentication: 'headerAuth', responseMode: 'responseNode', options: { allowedOrigins: '*' } }, id: id('02'), name: 'Mina.Dev Webhook', type: 'n8n-nodes-base.webhook', typeVersion: 2, position: [240, 160], webhookId: id('a1') },
      { parameters: { conditions: cond('b1', '={{ $json.body.event }}', 'test', { type: 'string', operation: 'equals' }), options: {} }, id: id('03'), name: 'Is it a test?', type: 'n8n-nodes-base.if', typeVersion: 2.2, position: [460, 160] },
      reply('04', 'Reply: connected', [700, 40], 'connected'),
      { parameters: { conditions: cond('b2', '={{ !!$json.body.doc }}', '', { type: 'boolean', operation: 'true', singleValue: true }), options: {} }, id: id('05'), name: 'Has a document?', type: 'n8n-nodes-base.if', typeVersion: 2.2, position: [700, 280] },
      { parameters: { operation: 'toBinary', sourceProperty: 'body.doc.base64', binaryPropertyName: 'data', options: { fileName: '={{ $json.body.doc.name }}', mimeType: '={{ $json.body.doc.mime }}' } }, id: id('06'), name: 'Base64 to file', type: 'n8n-nodes-base.convertToFile', typeVersion: 1.1, position: [940, 180] },
      Object.assign(wa('07', 'WhatsApp: send document', [1160, 180], { messageType: 'document', mediaPath: 'useMedian8n', mediaPropertyName: 'data', additionalFields: { mediaCaption: '={{ ' + B + '.caption }}' } }), { webhookId: id('a2') }),
      Object.assign(wa('08', 'WhatsApp: send text', [940, 400], { textBody: '={{ ' + B + '.text }}' }), { webhookId: id('a3') }),
      reply('09', 'Reply: sent', [1400, 280], 'sent')
    ],
    connections: {
      'Mina.Dev Webhook': { main: [[link('Is it a test?')]] },
      'Is it a test?': { main: [[link('Reply: connected')], [link('Has a document?')]] },
      'Has a document?': { main: [[link('Base64 to file')], [link('WhatsApp: send text')]] },
      'Base64 to file': { main: [[link('WhatsApp: send document')]] },
      'WhatsApp: send document': { main: [[link('Reply: sent')]] },
      'WhatsApp: send text': { main: [[link('Reply: sent')]] }
    },
    active: false, settings: { executionOrder: 'v1' }, pinData: {}, meta: { templateCredsSetupCompleted: false }
  };
}

function autoDownloadWf() { downloadFile('mina-dev-whatsapp.n8n.json', JSON.stringify(autoWorkflow(), null, 2), 'application/json'); toast('تم تحميل ملف n8n', 'ok'); }

/* supplier statement: the same paper as the customer's (printable, PDF) — every purchase (debit) and every payment (credit) with a running balance */
function supLedger(s) {
  const mv = [
    ...db.purchases.filter(x => x.supplierId === s.id).map(x => ({ d: x.date, t: `شراء: ${x.name} (${fmtq(x.qty)})`, debit: x.total, credit: 0, name: x.name, qty: x.qty, unit: '', cost: x.cost != null ? x.cost : (x.qty ? round2(x.total / x.qty) : 0) })),
    ...db.spurch.filter(x => x.supplierId === s.id).map(x => ({ d: x.date, t: `شراء: ${x.name} (${fmtq(x.qty)}${x.unit ? ' ' + x.unit : ''} × ${fmt(x.cost)})`, debit: x.total, credit: 0, name: x.name, qty: x.qty, unit: x.unit || '', cost: x.cost })),
    ...db.spay.filter(x => x.supplierId === s.id).map(x => ({ d: x.date, t: (x.kind === 'settle' ? 'سداد دفعة' : 'دفعة') + supPayNote(x.note), debit: 0, credit: x.amount })),
  ].sort((a, b) => String(a.d).localeCompare(String(b.d)));
  let run = 0; mv.forEach(m => { run = round2(run + m.debit - m.credit); m.bal = run; });
  return mv;
}
/* the note of a payment as the statement shows it: the payment that came with goods typed by hand reads «بضاعة» (+ the supplier's invoice no.), without the word «يدوي» */
const supPayNote = n => { if (!n) return ''; const m = /^بضاعة يدوي\s*(.*)$/.exec(n); return m ? ' — بضاعة' + (m[1] ? ' — ' + m[1] : '') : ' — ' + n; };
function supPaper(s) {
  const mv = supLedger(s), bought = supBought(s.id), paid = supPaid(s.id), bal = supBal(s.id);
  const nBuy = db.purchases.filter(x => x.supplierId === s.id).length + new Set(db.spurch.filter(x => x.supplierId === s.id).map(x => x.bid)).size;
  const ln = (a, b, k = '') => `<div class="l${k ? ' ' + k : ''}"><span>${a}</span><b>${b}</b></div>`;
  /* columns: date, item, quantity, price, total price — a payment takes one line across the middle with its amount (minus) in the total column */
  const rows = mv.map(m => m.credit
    ? `<tr class="sp-pay"><td class="dt"><bdi dir="ltr">${ymd(m.d)}</bdi></td><td class="bn" colspan="3">${esc(m.t)}</td><td class="bl"><bdi dir="ltr">-${fmt(m.credit)}</bdi></td></tr>`
    : `<tr><td class="dt"><bdi dir="ltr">${ymd(m.d)}</bdi></td><td class="bn">${esc(m.name)}</td><td>${fmtq(m.qty)}${m.unit ? ' ' + esc(m.unit) : ''}</td><td>${fmt(m.cost)}</td><td class="bl">${fmt(m.debit)}</td></tr>`).join('') || '<tr><td colspan="5">لا توجد حركة لهذا المورد.</td></tr>';
  return paper(letterhead(letterOf()) + `<div class="rt"><h3>كشف حساب مورد</h3></div>` +
    `<div class="ibox"><span>اسم المورد: <b>${esc(s.name)}</b></span>${s.code ? `<span>الكود: <b><bdi dir="ltr">${esc(s.code)}</bdi></b></span>` : ''}${s.phone ? `<span>الموبايل: <b><bdi dir="ltr">${esc(s.phone)}</bdi></b></span>` : ''}<span>التاريخ: <b><bdi dir="ltr">${ymd(new Date())}</bdi></b></span></div>` +
    `<table class="itbl st sp"><colgroup><col style="width:17%"><col style="width:33%"><col style="width:17%"><col style="width:15%"><col style="width:18%"></colgroup><thead><tr><th>التاريخ</th><th>الصنف</th><th>الكمية</th><th>السعر</th><th>إجمالي السعر</th></tr></thead><tbody>${rows}</tbody></table>` +
    `<div class="isum"><div class="ic">${ln('إجمالي المشتريات:', money(bought))}${ln('إجمالي المدفوع:', money(paid), 'big')}</div><div class="ic">${ln('عدد عمليات الشراء:', fmt(nBuy))}${bal < 0 ? ln('مدفوع مقدّماً للمورد:', money(-bal), 'big') : ln('المتبقي للمورد:', money(bal), 'big')}</div></div>`, 'inv');
}

/* ---------- Suppliers section: goods typed by hand at the purchase price ----------
   A separate home tile. Everything here lives in db.spurch / db.spay and the supplier's account; it NEVER touches the warehouses
   (no item, quantity or cost is changed) — the supplier handling inside «المخزن › إضافة بضاعة» stays exactly as it was. */
const spBatches = () => { /* one entry per saving (bid), newest first */
  const m = new Map(); db.spurch.forEach(x => { if (!m.has(x.bid)) m.set(x.bid, { bid: x.bid, supplierId: x.supplierId, date: x.date, ref: x.ref || '', note: x.note || '', lines: [] }); m.get(x.bid).lines.push(x); });
  return [...m.values()].map(b => Object.assign(b, { total: round2(b.lines.reduce((s, x) => s + x.total, 0)) })).sort((a, b) => b.date.localeCompare(a.date));
};

    </div></section>
  <section class="panel"><h2 class="panel-t">البضاعة</h2>
    <div class="tbl-wrap"><table class="tbl items-t sg-t">
      <colgroup><col style="width:19%"><col style="width:25%"><col style="width:20%"><col style="width:14%"><col style="width:14%"><col style="width:8%"></colgroup>

  </section>
  <div class="two">
    <section class="panel"><h2 class="panel-t big">${ICON.coins}<span>الدفع للمورد</span></h2>
      <div class="pay"><div class="field"><label for="sg-paid">المدفوع للمورد الآن (جنيه)</label><div class="iconin"><input id="sg-paid" class="inp" inputmode="decimal" placeholder="0" autocomplete="off"><button class="mini" id="sg-full" type="button">سداد كامل</button></div></div></div>

    const part = rows.filter(r => r.name.trim() || num(r.qty) || num(r.cost));
    if (!part.length) return toast('أضف بضاعة واحدة على الأقل');
    if (part.some(r => !r.name.trim() || num(r.qty) <= 0 || num(r.cost) <= 0)) return toast('اكتب الصنف وكميته وسعره في كل صف');
    part.forEach(r => { if (!r.date) r.date = today; });
    if (part.some(r => r.date > today)) return toast('لا يمكن تسجيل بضاعة بتاريخ لم يأتِ بعد');
    if (part.some(r => isLocked(r.date))) return toast('هذا التاريخ في فترة مقفولة');
    const now = new Date().toISOString(), iso = r => r.iso && r.date === ymd(r.iso) ? r.iso : r.date === today ? now : new Date(r.date + 'T12:00:00').toISOString();
    const date = iso(part[0]); /* the entry's own date (its payment, its place in the log) is its first line's */
    const total = round2(part.reduce((s, r) => s + rowTotal(r), 0)), paid = round2(num($('#sg-paid').value));
    if (paid > total + 0.004) return toast('المدفوع للمورد أكبر من إجمالي البضاعة');
    const bid = ed ? ed.bid : uid(), ref = $('#sg-ref').value.trim(), note = $('#sg-note').value.trim();
    const lines = part.map(r => ({ id: r.id || uid(), bid, supplierId: sup.id, name: r.name.trim(), unit: r.unit.trim(), qty: num(r.qty), cost: num(r.cost), total: rowTotal(r), date: iso(r), ref, note }));
    const payNote = 'بضاعة يدوي' + (ref ? ' ' + ref : '');
    if (ed) { /* replace the entry's lines where they were; keep one payment row tied to it (update it, create it, or drop it when nothing is paid) */
      const at = db.spurch.findIndex(x => x.bid === bid); db.spurch = db.spurch.filter(x => x.bid !== bid); db.spurch.splice(Math.max(0, Math.min(at, db.spurch.length)), 0, ...lines);
      const pr = db.spay.find(x => x.bid === bid); db.spay = db.spay.filter(x => x.bid !== bid || x === pr);
      if (paid > 0) { if (pr) Object.assign(pr, { supplierId: sup.id, name: sup.name, amount: paid, date, note: payNote }); else db.spay.push({ id: uid(), supplierId: sup.id, name: sup.name, amount: paid, date, kind: 'pay', note: payNote, bid }); }
      else db.spay = db.spay.filter(x => x.bid !== bid);
      logA('sup_goods_edit', sup.name, `${lines.length} صنف`, `${money(ed.total)} ← ${money(total)}`); save(); toast('تم حفظ التعديل', 'ok'); return go('supLog', {}, { replace: true });
    }
    db.spurch.push(...lines);
    if (paid > 0) db.spay.push({ id: uid(), supplierId: sup.id, name: sup.name, amount: paid, date, kind: 'pay', note: payNote, bid });
    logA('sup_goods', sup.name, `${lines.length} صنف`, money(total)); save(); toast('تم تسجيل البضاعة على حساب المورد', 'ok'); go('supDetail', { id: sup.id }, { replace: true });
  };
  drawRows(); if (ed) $('#sg-paid').value = oldPaid || ''; calc();
};

/* ---------- Reports: today's movement, detailed report, shift closing (modelled on the printed reports) ---------- */
const custName = id => (db.customers.find(c => c.id === id) || {}).name || 'عميل';
const sumA = a => round2(a.reduce((s, x) => s + x.a, 0));

/* every money movement between two local dates (YYYY-MM-DD, inclusive), split into the report sections */
function ledger(from, to) {
  const inR = d => { const k = ymd(d); return k >= from && k <= to; };
  const L = { inn: [], out: [], tip: [], vat: [], gain: [], loss: [] };
  const P = (arr, d, w, a) => { if (a > 0) arr.push({ d, w, a: round2(a) }); };
  const PN = (arr, d, w, a) => { if (a) arr.push({ d, w, a: round2(a) }); }; /* may be negative: a reversal of an earlier entry */
  const prof = (d, w, pr) => { if (pr > 0) P(L.gain, d, 'ربح من: ' + w, pr); else if (pr < 0) P(L.loss, d, 'خسارة في: ' + w, -pr); };
  const unprof = (d, w, pr) => { if (pr > 0) P(L.loss, d, 'عكس ربح: ' + w, pr); else if (pr < 0) P(L.gain, d, 'عكس خسارة: ' + w, -pr); };
  db.invoices.filter(i => inR(i.date)).forEach(i => {
    P(L.inn, i.date, 'فاتورة العميل: ' + i.name, i.paid);
    if (i.vatOn) P(L.vat, i.date, 'قيمة مضافة: ' + i.name, i.vatAmt);
    prof(i.date, i.name, invProfit(i)); /* recognised on the invoice total, whatever part was paid in cash */
  });
  db.invoices.filter(i => i.status === 'void' && i.void && inR(i.void.at)).forEach(i => { /* a cancelled invoice is reversed on the day it was cancelled */
    const w = 'إلغاء فاتورة ' + i.no + ': ' + i.name;
    P(L.out, i.void.at, w, i.paid);
    P(L.out, i.void.at, 'رد التحصيلات اللاحقة — إلغاء فاتورة ' + i.no + ': ' + i.name, i.void.coll || 0); /* the instalments he paid after issue go back to him */
    if (i.vatOn) PN(L.vat, i.void.at, 'قيمة مضافة ملغاة: ' + i.name, -i.vatAmt);
    unprof(i.void.at, w, invProfit(i));
  });
  db.returns.filter(r => inR(r.date)).forEach(r => { /* a return: cash given back, VAT and profit taken back */
    const w = 'مرتجع ' + r.no + ' — فاتورة ' + r.invNo + ': ' + r.name;
    P(L.out, r.date, 'مرتجع مبيعات — فاتورة ' + r.invNo + ': ' + r.name, r.refund);
    if (r.vatAmt) PN(L.vat, r.date, 'قيمة مضافة مرتجعة: ' + r.name, -r.vatAmt);
    unprof(r.date, w, round2(r.subtotal - r.discAmt - r.cost));
  });
  db.payments.filter(x => inR(x.date)).forEach(x => P(L.inn, x.date, 'تحصيل من العميل: ' + custName(x.customerId) + ((x.alloc || []).length ? ' (فاتورة ' + x.alloc.map(a => a.no).join('، ') + ')' : ''), x.amount));
  db.bookings.forEach(b => {
    if (inR(b.date)) P(L.inn, b.date, 'إيداع حجز - ' + b.desc, b.amount);
    b.refunds.filter(r => inR(r.date)).forEach(r => P(L.out, r.date, 'رد حجز - ' + b.desc + ': ' + b.name, r.a));
  });
  db.expenses.filter(e => inR(e.date)).forEach(e => P(e.cat === 'tip' ? L.tip : L.out, e.date, e.title, e.amount));
  db.spay.filter(x => inR(x.date)).forEach(x => P(L.out, x.date, (x.kind === 'settle' ? 'سداد دفعة للمورد: ' : 'دفعة لمورد: ') + ((supById(x.supplierId) || {}).name || x.name), x.amount));
  Object.values(L).forEach(a => a.sort((p, q) => p.d.localeCompare(q.d)));
  return L;
}

const letterOf = () => { const S = db.settings; return { logo: S.logo, name: S.company.trim(), phones: repPhones(), addr: S.address.trim(), tax: taxLine() }; };
function letterhead(o, style = 'A') {
  const lg = o.logo ? `<img src="${o.logo}" alt="">` : '<i></i>', lp = o.phones ? `<p class="ph">${esc(o.phones)}</p>` : '', la = o.addr ? `<p class="ad">${esc(o.addr)}</p>` : '', lx = o.tax ? `<p class="ad">${esc(o.tax)}</p>` : '';

function fsSet(v) {
  FS_V = Math.min(FS_MAX, Math.max(FS_MIN, Math.round(v * 20) / 20)); try { localStorage.setItem(FS_KEY, String(FS_V)); } catch (e) { /* kept for this visit only */ }
  $$('article.paper').forEach(a => a.style.setProperty('--fs', FS_V));

/* the printed invoice (matches the reference sheet): client/date box, items table, two summary boxes.
