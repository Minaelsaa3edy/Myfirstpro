<style>
:root {
  --bg: #f4f6fa;
  --dot: #dbe1ea;
  --surface: #ffffff;
  --tile: #f1f3f8;
  --line: #e1e6ee;
  --fg: #1b2333;
  --fg2: #566077;
  --fg3: #8a94a8;
  --input: #eceff4;
  --input-line: #dde2ea;
  --input-focus: #ffffff;
  --row-hover: #e4e8ee;
  --blue: #0b57d0;
  --blue-t: #0b57d0;
  --blue-ring: rgba(11, 87, 208, 0.2);
  --blue-soft: #d3e2f6;
  --blue-soft-h: #aecbf4;
  --blue-line: #8fb0e0;
  --red: #d93025;
  --red-t: #c4302b;
  --red-soft: #fdeeed;
  --red-line: #f0b5b1;
  --green: #1e8e3e;
  --amber: #f5a623;
  --orange: #f26a2e;
  --teal: #2fb59b;
  --purple: #9b51d1;
  --slate: #7b8794;
  --sky: #2f7de1;
  --brand-a: #e0912a;
  --brand-b: #2f5f9f;
  --shadow: 0 1px 2px rgba(20, 30, 50, 0.05), 0 6px 18px rgba(20, 30, 50, 0.06);
  --shadow-h: 0 2px 4px rgba(20, 30, 50, 0.06), 0 14px 28px rgba(20, 30, 50, 0.11);
  --overlay: rgba(15, 22, 36, 0.45);
  --font: "Cairo", Tahoma, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e131c;
  --dot: #1b2333;
  --surface: #171e2b;
  --tile: #1a2231;
  --line: #27324a;
  --fg: #e8ecf4;
  --fg2: #aab3c5;
  --fg3: #7c869b;
  --input: #212b3d;
  --input-line: #2d3a52;
  --input-focus: #131a27;
  --row-hover: #212b3d;
  --blue: #1d5fd1;
  --blue-t: #7fa9ff;
  --blue-ring: rgba(127, 169, 255, 0.28);
  --blue-soft: #1d2e4d;
  --blue-soft-h: #284170;
  --blue-line: #3d5c94;
  --red: #e5483e;
  --red-t: #ff8a80;
  --red-soft: #321a1d;
  --red-line: #6b2f33;
  --green: #5ccf80;
  --amber: #f5a623;
  --orange: #f47d46;
  --teal: #3cc4a9;
  --purple: #b277e3;
  --slate: #97a3b2;
  --sky: #5b9bf0;
  --brand-a: #f0a64a;
  --brand-b: #86abe0;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
  --shadow-h: 0 2px 4px rgba(0, 0, 0, 0.35), 0 14px 28px rgba(0, 0, 0, 0.35);
  --overlay: rgba(0, 0, 0, 0.6);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e131c;
  --dot: #1b2333;
  --surface: #171e2b;
  --tile: #1a2231;
  --line: #27324a;
  --fg: #e8ecf4;
  --fg2: #aab3c5;
  --fg3: #7c869b;
  --input: #212b3d;
  --input-line: #2d3a52;
  --input-focus: #131a27;
  --row-hover: #212b3d;
  --blue: #1d5fd1;
  --blue-t: #7fa9ff;
  --blue-ring: rgba(127, 169, 255, 0.28);
  --blue-soft: #1d2e4d;
  --blue-soft-h: #284170;
  --blue-line: #3d5c94;
  --red: #e5483e;
  --red-t: #ff8a80;
  --red-soft: #321a1d;
  --red-line: #6b2f33;
  --green: #5ccf80;
  --amber: #f5a623;
  --orange: #f47d46;
  --teal: #3cc4a9;
  --purple: #b277e3;
  --slate: #97a3b2;
  --sky: #5b9bf0;
  --brand-a: #f0a64a;
  --brand-b: #86abe0;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
  --shadow-h: 0 2px 4px rgba(0, 0, 0, 0.35), 0 14px 28px rgba(0, 0, 0, 0.35);
  --overlay: rgba(0, 0, 0, 0.6);
  color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }
/* Layout: one full-width column. Home = header band over a 3x2 tile grid that fills the viewport; sub-screens = centered title with back button, then cards. Whole page scrolls. */
html { direction: rtl; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.3px);
  background-size: 22px 22px;
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
svg { display: block; }
:focus-visible { outline: 3px solid var(--blue-ring); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { min-height: calc(100vh / var(--z, 1)); display: flex; flex-direction: column; padding-inline: clamp(0px, 2.4vw, 36px); padding-block: clamp(14px, 2.6vw, 30px); }
#view { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ---------- Credit ---------- */
.credit { text-align: center; font-size: 12.5px; font-weight: 600; color: var(--fg3); padding-top: clamp(16px, 2vw, 26px); letter-spacing: .02em; }
.credit bdi { color: var(--fg2); font-weight: 800; letter-spacing: .08em; }

/* ---------- Home ---------- */
.home { flex: 1; display: flex; flex-direction: column; gap: clamp(14px, 2.2vw, 28px); }
.top {
  display: grid; grid-template-columns: minmax(120px, 1fr) minmax(0, 2.6fr) minmax(120px, 1fr); align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
  padding: clamp(14px, 2.4vw, 32px) clamp(16px, 2.6vw, 34px);
}
.clock { display: grid; grid-template-columns: auto auto; justify-content: start; align-items: baseline; column-gap: 6px; line-height: 1.15; }
.clock b { font-size: clamp(20px, 2vw, 28px); font-weight: 800; font-variant-numeric: tabular-nums; }
.clock small { font-size: 12px; font-weight: 700; color: var(--fg2); }
.clock .dt { grid-column: 1 / -1; font-size: clamp(10.5px, 0.85vw, 12px); color: var(--fg3); margin-top: 3px; }
.brand {
  margin: 0; font-size: clamp(19px, 2.55vw, 38px); font-weight: 800; line-height: 1.3; text-align: center; text-wrap: balance;
}
.brand span { display: block; }
.brand .b1 { color: var(--brand-a); }
.brand .b2 { color: var(--brand-b); }
.tools { display: flex; gap: 8px; justify-content: flex-end; }
.tool {
  position: relative; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  background: var(--tile); border: 1px solid var(--line); transition: transform .15s, box-shadow .15s;
}
.tool:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.tool svg { width: 18px; height: 18px; }
.tool .dot { position: absolute; top: 6px; inset-inline-end: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); border: 2px solid var(--tile); }
.tiles { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(150px, 1fr); gap: clamp(14px, 2.2vw, 28px); }
.tile {
  position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(10px, 1.3vw, 18px);
  background: var(--tile); border: 1.5px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
  font-size: clamp(17px, 1.78vw, 25px); font-weight: 700; padding: 18px; transition: transform .18s, box-shadow .18s, border-color .18s, background .18s;
}
.tile svg { width: clamp(40px, 4.2vw, 60px); height: clamp(40px, 4.2vw, 60px); }
.tile::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--blue); opacity: 0; transition: opacity .18s; }
.tile:hover { border-color: var(--blue); background: var(--surface); box-shadow: var(--shadow-h); transform: translateY(-2px); }
.tile:hover::before { opacity: 1; }
.tile:active { transform: translateY(0) scale(.99); }

/* ---------- Sub screens ---------- */
.sub-head { position: relative; text-align: center; padding: 6px 48px 16px; border-bottom: 1px solid var(--line); margin-bottom: clamp(16px, 2.2vw, 26px); }
.sub-head h1 { margin: 0; font-size: clamp(21px, 2.45vw, 35px); font-weight: 800; }
.back {
  position: absolute; inset-inline-start: 0; top: 2px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  background: var(--tile); border: 1px solid var(--line); transition: background .15s, color .15s, transform .15s;
}
.back svg { width: 18px; height: 18px; }
.back:hover, .back:active { background: var(--blue); color: #fff; border-color: var(--blue); }
.menu { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(14px, 2vw, 26px); margin-top: clamp(8px, 2vw, 24px); }
.opt {
  width: min(350px, 100%); height: clamp(150px, 14vw, 195px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: var(--tile); border: 1.5px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
  font-size: clamp(17px, 1.8vw, 25px); font-weight: 700; transition: transform .18s, box-shadow .18s, border-color .18s, background .18s;
}
.opt svg { width: 54px; height: 54px; }
.opt:hover { border-color: var(--ac, var(--blue)); background: var(--surface); box-shadow: var(--shadow-h); transform: translateY(-2px); }
.opt:active { transform: translateY(0) scale(.99); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: clamp(14px, 1.9vw, 24px); box-shadow: var(--shadow); min-width: 0; }
.panel + .panel { margin-top: clamp(14px, 1.6vw, 20px); }
.panel-t { margin: 0 0 14px; font-size: 14.5px; font-weight: 700; color: var(--fg); display: flex; align-items: center; gap: 8px; }
.panel-t.big { font-size: 17px; font-weight: 800; }
.panel-t svg { width: 20px; height: 20px; }
.panel-t.blue { color: var(--blue-t); }
.stack { display: flex; flex-direction: column; gap: clamp(14px, 1.6vw, 20px); }

/* ---------- Inputs ---------- */
.inp, .sel select, .tbl input {
  width: 100%; height: 40px; border-radius: 10px; background: var(--input); border: 1px solid var(--input-line);
  padding: 0 12px; font-size: 14px; text-align: center; outline: none; transition: background .15s, border-color .15s, box-shadow .15s;
}
.inp::placeholder, .tbl input::placeholder { color: var(--fg3); opacity: 1; }
.inp:focus, .sel select:focus, .tbl input:focus { background: var(--input-focus); border-color: var(--blue-line); box-shadow: 0 0 0 3px var(--blue-ring); }
.inp[readonly] { opacity: .8; }
.sel { position: relative; }
.sel select { appearance: none; -webkit-appearance: none; padding-inline: 30px 12px; cursor: pointer; text-align-last: center; }
.sel::after { content: ""; position: absolute; inset-inline-end: auto; left: 12px; top: 50%; width: 7px; height: 7px; border-left: 2px solid var(--fg2); border-bottom: 2px solid var(--fg2); transform: translateY(-70%) rotate(-45deg); pointer-events: none; }
.sel select option { background: var(--surface); color: var(--fg); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: 12.5px; font-weight: 600; color: var(--fg2); }
.ltr { text-align: left; }
.iconin { position: relative; }
.iconin .inp { text-align: left; padding-inline: 40px 12px; font-variant-numeric: tabular-nums; }
.iconin > svg, .iconin > .pct { position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--fg2); pointer-events: none; }
.iconin > .pct { font-size: 14px; font-weight: 700; text-align: center; line-height: 18px; }

.chk { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; color: var(--fg2); font-weight: 600; cursor: pointer; user-select: none; }
.chk input { position: absolute; opacity: 0; width: 0; height: 0; }
.chk i { width: 19px; height: 19px; flex: none; border-radius: 6px; border: 1.5px solid var(--input-line); background: var(--surface); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.chk i svg { width: 12px; height: 12px; color: #fff; opacity: 0; transform: scale(.6); transition: .15s; }
.chk input:checked + i { background: var(--blue); border-color: var(--blue); }
.chk input:checked + i svg { opacity: 1; transform: none; }
.chk input:focus-visible + i { outline: 3px solid var(--blue-ring); outline-offset: 2px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 22px; border-radius: 11px;
  background: var(--blue); color: #fff; font-weight: 700; font-size: 14.5px; transition: filter .15s, transform .1s, background .15s;
}
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: scale(.98); }
.btn.ghost { background: var(--tile); color: var(--fg); border: 1px solid var(--line); }
.btn.danger { background: var(--red); }
.btn.ok { background: var(--green); }
.btn.outline { background: transparent; color: var(--blue-t); border: 1.5px solid var(--blue-line); }
.btn.outline:hover { background: var(--blue-soft); filter: none; }
.btn.sm { height: 34px; padding: 0 16px; font-size: 13px; border-radius: 9px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.btn.lg { height: 50px; font-size: 16px; padding: 0 34px; border-radius: 13px; }
.btn svg { width: 18px; height: 18px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- Tables ---------- */
.tbl-wrap { overflow-x: auto; border-radius: 12px; }
table.grid, table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; min-width: 560px; }
table.grid thead th, table.tbl thead th { background: var(--blue); color: #fff; font-size: 13.5px; font-weight: 700; padding: 13px 8px; text-align: center; }
table.grid thead th:first-child, table.tbl thead th:first-child { border-start-start-radius: 12px; }
table.grid thead th:last-child, table.tbl thead th:last-child { border-start-end-radius: 12px; }
table.grid td, table.tbl td { padding: 10px 8px; text-align: center; font-size: 14px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: middle; }
table.grid tbody tr, table.tbl tbody tr { transition: background .12s; }
table.grid tbody tr:hover, table.tbl tbody tr:hover { background: var(--row-hover); }
td.qty { color: var(--green); font-weight: 800; }
td.val { color: var(--blue-t); font-weight: 700; }
td.muted { color: var(--fg3); }
.del { width: 34px; height: 34px; border-radius: 9px; background: var(--red); color: #fff; display: inline-grid; place-items: center; transition: filter .15s, transform .1s; }
.del:hover { filter: brightness(1.12); }
.del:active { transform: scale(.94); }
.del svg { width: 17px; height: 17px; }
.mini { height: 32px; padding: 0 12px; border-radius: 9px; font-size: 13px; font-weight: 700; background: var(--blue-soft); color: var(--blue-t); }
.mini:hover { background: var(--blue-soft-h); }
.total-box { border: 1.5px dashed var(--input-line); background: var(--tile); border-radius: 12px; padding: 14px 16px; text-align: center; font-size: 15px; font-weight: 700; margin-bottom: 16px; }
.total-box b { color: var(--blue-t); font-size: 17px; font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--fg3); padding: 28px 12px; font-size: 14px; }

/* ---------- Invoice form ---------- */
.cust { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 14px; align-items: center; }
.items-t { table-layout: fixed; }
.tbl td.rt { font-weight: 700; }
.tbl tbody tr:hover td { background: transparent; }
.tbl tbody tr:hover { background: var(--row-hover); }
.add-row {
  width: 100%; margin-top: 12px; height: 46px; border-radius: 11px; border: 1.5px dashed var(--blue-line); background: var(--blue-soft); color: var(--blue-t);
  font-weight: 700; font-size: 14.5px; transition: background .15s;
}
.add-row:hover, .add-row:active { background: var(--blue-soft-h); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(14px, 1.6vw, 20px); margin-top: clamp(14px, 1.6vw, 20px); }
.two .panel + .panel { margin-top: 0; }
.pay { display: flex; flex-direction: column; gap: 14px; }
.sum-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 2px; border-bottom: 1px dotted var(--input-line); font-size: 14px; color: var(--fg2); font-weight: 600; }
.sum-row b { color: var(--fg); font-size: 15px; font-variant-numeric: tabular-nums; }
.sum-row.red, .sum-row.red b { color: var(--red-t); }
.net { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; background: var(--tile); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-weight: 800; font-size: 14.5px; }
.net b { color: var(--blue-t); font-size: clamp(20px, 2vw, 26px); font-weight: 800; font-variant-numeric: tabular-nums; }
.rem { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; background: var(--red-soft); border: 1px dashed var(--red-line); border-radius: 12px; padding: 12px 16px; color: var(--red-t); font-weight: 800; font-size: 14.5px; }
.rem span { display: inline-flex; align-items: center; gap: 7px; }
.rem svg { width: 18px; height: 18px; }
.rem b { font-size: 17px; font-variant-numeric: tabular-nums; }
.submit { display: flex; justify-content: center; margin-top: clamp(16px, 2vw, 26px); padding-bottom: 10px; }

/* ---------- Invoice sheet ---------- */
.sheet { max-width: 820px; margin: 0 auto; }
.sheet h2 { margin: 0; font-size: 22px; font-weight: 800; }
.sheet .meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin: 14px 0 18px; font-size: 13.5px; color: var(--fg2); }
.sheet .meta b { color: var(--fg); }
.sheet .totals { margin: 16px 0 0 auto; width: min(340px, 100%); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.pill.ok { background: rgba(30, 142, 62, .14); color: var(--green); }
.pill.bad { background: var(--red-soft); color: var(--red-t); }

/* ---------- Reports ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.stat { background: var(--tile); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.stat span { font-size: 12.5px; font-weight: 600; color: var(--fg2); }
.stat b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat.pos b { color: var(--green); }
.stat.neg b { color: var(--red-t); }
.stat.blue b { color: var(--blue-t); }
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar .inp { max-width: 340px; text-align: start; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; align-items: end; }
textarea.inp { height: 160px; padding: 10px 12px; text-align: left; direction: ltr; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; resize: vertical; }

/* ---------- Toast / modal / popover ---------- */
#toasts { position: fixed; z-index: 50; inset-inline-end: auto; left: max(20px, env(safe-area-inset-left, 0px)); bottom: max(20px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 12px; background: var(--surface); color: var(--fg); border-radius: 14px; border-inline-start: 5px solid var(--red);
  padding: 14px 18px; font-weight: 700; font-size: 14.5px; box-shadow: 0 10px 30px rgba(10, 20, 40, .22), 0 0 0 1px var(--line); max-width: min(92vw, 460px);
  opacity: 0; transform: translateX(-24px); transition: opacity .25s, transform .25s; pointer-events: auto;
}
.toast.in { opacity: 1; transform: none; }
.toast.ok { border-inline-start-color: var(--green); }
.toast .tx { width: 20px; height: 20px; flex: none; color: var(--red-t); display: grid; place-items: center; cursor: pointer; }
.toast.ok .tx { color: var(--green); }
.toast .tx svg { width: 16px; height: 16px; }
.ov { position: fixed; inset: 0; z-index: 40; background: var(--overlay); display: grid; place-items: center; padding: 16px; animation: fade .15s; }
.dlg { width: min(440px, 100%); background: var(--surface); border-radius: 18px; padding: 22px; box-shadow: 0 24px 60px rgba(0, 0, 0, .3); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow: auto; }
.dlg h3 { margin: 0; font-size: 18px; font-weight: 800; }

const sha256 = (() => {

    modal(`${title ? `<h3>${esc(title)}</h3>` : ''}<p${title ? '' : ' class="msg"'}>${esc(msg)}</p><div class="actions"><button class="btn ${danger ? 'danger' : ''}" data-ok>${esc(okLabel)}</button><button class="btn outline" data-no>إلغاء</button></div>`, (d, close) => {
      $('[data-ok]', d).onclick = () => { close(); res(true); };
      $('[data-no]', d).onclick = () => { close(); res(false); };
    }, () => res(false));
  });
}

/* ---------- Admin PIN guard (client-side only: it keeps staff out of Settings, it is not real security) ---------- */
let adminUntil = 0;
const leaveHooks = []; /* run when the user leaves Settings (the developer section registers one to lock itself) */
const adminOpen = () => !db.settings.adminPin || Date.now() < adminUntil;
const cleanPin = s => toLat(s).replace(/\D/g, '').slice(0, 8);
const tries = {};
const waitSecs = k => { const t = tries[k]; return t && t.until > Date.now() ? Math.ceil((t.until - Date.now()) / 1000) : 0; };
const pinFail = k => { const t = tries[k] = tries[k] || { n: 0, until: 0 }; if (++t.n >= 5) { t.n = 0; t.until = Date.now() + 30000; } };
function requireAdmin(why = 'اكتب الرقم السري للمسؤول لحفظ التغييرات') {
  if (adminOpen()) return Promise.resolve(true);
  return new Promise(res => {
    modal(`<h3>الرقم السري للمسؤول</h3><p>${esc(why)}</p><input id="adm-pin" class="inp" type="password" inputmode="numeric" maxlength="8" autocomplete="off" aria-label="الرقم السري للمسؤول"><div class="actions"><button class="btn ok" data-ok>تأكيد</button><button class="btn outline" data-no>إلغاء</button></div>`, (d, close) => {
      const inp = $('#adm-pin', d);
      const submit = () => {
        const w = waitSecs('admin'); if (w) return toast(`محاولات كثيرة. حاول بعد ${w} ثانية`);
        if (checkPin(cleanPin(inp.value), db.settings.adminPin)) { delete tries.admin; adminUntil = Date.now() + 10 * 60 * 1000; close(); res(true); }
        else { pinFail('admin'); inp.value = ''; inp.focus(); toast('الرقم السري غير صحيح'); }
      };
      $('[data-ok]', d).onclick = submit; inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
      $('[data-no]', d).onclick = () => { close(); res(false); };
    }, () => res(false));
  });
}

/* ---------- Router ---------- */
let stack = [];
let cur = { name: 'home', p: {} };
const screens = {};
function go(name, p = {}, opt = {}) {
  if (!opt.replace) stack.push(cur);
  cur = { name, p };
  render(); window.scrollTo(0, 0);
}
function back() { cur = stack.pop() || { name: 'home', p: {} }; render(); window.scrollTo(0, 0); }
function render() {
  if (guardFn && guardFn()) return;
  closePop();
  if (!/^set/.test(cur.name)) { adminUntil = 0; leaveHooks.forEach(f => f()); } /* leaving Settings locks it again */
  const v = $('#view'); v.innerHTML = '';
  (screens[cur.name] || screens.home)(cur.p, v);
}
const subHead = title => `<div class="sub-head"><h1>${esc(title)}</h1><button class="back" data-act="back" aria-label="رجوع">${ICON.back}</button></div>`;

/* ---------- Business logic ---------- */
const itemById = id => db.items.find(i => i.id === id);
const stockValue = () => db.items.reduce((s, i) => s + i.qty * i.cost, 0);
function customerDebt(cid) {
  const inv = db.invoices.filter(i => i.customerId === cid).reduce((s, i) => s + i.remaining, 0);
  const pay = db.payments.filter(p => p.customerId === cid).reduce((s, p) => s + p.amount, 0);
  return Math.max(round2(inv - pay), 0);
}
/* ---------- Collections are tied to invoices: every payment records which invoices it settled (oldest first) ---------- */
function settledMap() { const m = {}; db.payments.forEach(p => (p.alloc || []).forEach(a => { m[a.inv] = round2((m[a.inv] || 0) + a.a); })); return m; }
const invSettled = (i, m = settledMap()) => m[i.id] || 0; /* collected after the invoice was issued */
const invLeft = (i, m = settledMap()) => Math.max(round2(i.remaining - (m[i.id] || 0)), 0);
const invPaidNow = (i, m = settledMap()) => round2(i.paid + (m[i.id] || 0));
const byDate = (a, b) => String(a.date) < String(b.date) ? -1 : String(a.date) > String(b.date) ? 1 : 0;
function allocate(cid, amount, onlyInv) { /* split a collection over the customer's open invoices, oldest first */
  const m = settledMap(), out = []; let left = round2(amount);
  db.invoices.filter(i => i.customerId === cid && (!onlyInv || i.id === onlyInv)).sort(byDate).forEach(i => {
    const open = invLeft(i, m);
    if (open > 0 && left > 0) { const a = round2(Math.min(open, left)); out.push({ inv: i.id, no: i.no, a }); left = round2(left - a); }
  });
  return out;
}
function linkPayments() { const old = db.payments.filter(p => !Array.isArray(p.alloc)).sort(byDate); old.forEach(p => { p.alloc = allocate(p.customerId, p.amount); }); return old.length; }
const invPays = i => db.payments.flatMap(p => (p.alloc || []).filter(a => a.inv === i.id).map(a => ({ id: p.id, date: p.date, a: a.a })));
if (linkPayments()) save(); /* old collections get tied to the invoices they settled (runs once; later loads find alloc already set) */
const invCost = i => i.rows.reduce((s, l) => s + l.qty * (l.cost || 0), 0);
const invProfit = i => round2((i.subtotal - i.discAmt) - invCost(i)); /* sales after discount, before VAT, minus cost of goods */
const customerTotal = cid => db.invoices.filter(i => i.customerId === cid).reduce((s, i) => s + i.net, 0);
function notifications() {
  const out = [];
  db.items.filter(i => i.qty <= 0).forEach(i => out.push({ c: 'var(--red)', to: 'invView', t: `نفد الصنف «${i.name}» من المخزن` }));
  db.items.filter(i => i.qty > 0 && i.qty <= 5).forEach(i => out.push({ c: 'var(--amber)', to: 'invView', t: `رصيد «${i.name}» منخفض: ${fmt(i.qty)} ${i.unit}` }));
  db.customers.map(c => ({ c, d: customerDebt(c.id) })).filter(x => x.d > 0).sort((a, b) => b.d - a.d).slice(0, 6)
    .forEach(x => out.push({ c: 'var(--blue)', to: 'customers', t: `على ${x.c.name} مبلغ ${money(x.d)}` }));
  return out;
}

/* ---------- Popover (bell) ---------- */
let popEl = null;
function closePop() { if (popEl) { popEl.remove(); popEl = null; } }
document.addEventListener('mousedown', e => { if (popEl && !popEl.contains(e.target) && !e.target.closest('[data-act="bell"]')) closePop(); });

/* ---------- Click sound: a short soft "tick" made with the Web Audio API (no audio files); can be muted from the home bar ---------- */
let AC = null, lastTick = 0, tickBuf = null;
function playTick() {
  if (db.settings.sound === false) return;
  const now = performance.now(); if (now - lastTick < 60) return; lastTick = now; /* a label click also fires a second click on its input */
  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    AC = AC || new A(); if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    if (!tickBuf) { const n = Math.round(AC.sampleRate * 0.035); tickBuf = AC.createBuffer(1, n, AC.sampleRate); const d = tickBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 4); }
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), o = AC.createOscillator(), og = AC.createGain();
    s.buffer = tickBuf; f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 1.1; g.gain.value = .55;
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t);
    o.type = 'sine'; o.frequency.setValueAtTime(1500, t); o.frequency.exponentialRampToValueAtTime(650, t + .03);
    og.gain.setValueAtTime(.09, t); og.gain.exponentialRampToValueAtTime(.0001, t + .045);
    o.connect(og); og.connect(AC.destination); o.start(t); o.stop(t + .05);
  } catch (e) { /* no audio available: stay silent */ }
}
document.addEventListener('click', e => {
  if (!e.isTrusted) return;
  const el = e.target.closest('button, [data-act], label.btn, label.chk, .lnk'); if (!el || el.disabled || el.closest('[disabled]')) return;
  playTick();
}, true);

/* ---------- Global click delegation ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'back') back();
  else if (act === 'go') go(t.dataset.to, t.dataset.p ? JSON.parse(t.dataset.p) : {});
  else if (act === 'theme') { toggleTheme(); render(); }
  else if (act === 'bell') {
    if (popEl) return closePop();
    const list = notifications();
    popEl = document.createElement('div'); popEl.className = 'pop';
    popEl.innerHTML = `<h4>آخر التنبيهات</h4>` + (list.length ? list.map(n => `<button class="it" data-act="go" data-to="${n.to}"><i style="background:${n.c}"></i><span>${esc(n.t)}</span></button>`).join('') : `<div class="none">لا توجد تنبيهات</div>`);
    (t.closest('.top') || t).append(popEl); /* hang it from the header bar (not the bell) so it stays inside the screen */
  }
  else if (act === 'sound') { db.settings.sound = db.settings.sound === false; save(); render(); lastTick = 0; playTick(); toast(db.settings.sound === false ? 'تم كتم صوت الضغط' : 'تم تشغيل صوت الضغط', 'ok'); }
  else if (act === 'logout') lockScreen();
});

/* ---------- Invoice form ---------- */
let inv = null;
const blankRow = () => ({ itemId: '', qty: '', price: '' });
function usedElsewhere(i) { const r = inv.rows[i]; return inv.rows.reduce((s, x, k) => s + (k !== i && x.itemId === r.itemId ? num(x.qty) : 0), 0); }
function available(i) { const it = itemById(inv.rows[i].itemId); return it ? Math.max(round2(it.qty - usedElsewhere(i)), 0) : 0; }
function unitPrice(r) { const it = itemById(r.itemId); return r.price !== '' ? num(r.price) : (it ? it.price : 0); }
const rowTotal = r => num(r.qty) * unitPrice(r);
const CASH_NAME = 'مبيعات نقدية مباشرة';
/* open booking deposits that belong to the customer being invoiced (matched by registry id, phone or exact name) */
function openBookingsFor() {
  if (!inv || inv.mode === 'cash') return [];
  const ph = toLat(inv.phone).trim(), nm = inv.name.trim();
  return db.bookings.filter(b => bkOpen(b) > 0 && (inv.cid ? b.customerId === inv.cid : ((ph && b.phone === ph) || (nm && b.name === nm))))
    .sort((a, b) => a.date.localeCompare(b.date));
}
const depAvail = () => round2(openBookingsFor().reduce((s, b) => s + bkOpen(b), 0));
const depApplied = t => (inv.dep ? Math.min(depAvail(), t.net) : 0);
function totals() {
  const sub = inv.rows.reduce((s, r) => s + rowTotal(r), 0);
  const dp = Math.min(100, Math.max(0, num(inv.disc)));
  const discAmt = sub * dp / 100, after = sub - discAmt;
  const vatAmt = inv.vat ? after * db.settings.vat / 100 : 0;
  return { sub: round2(sub), dp, discAmt: round2(discAmt), vatAmt: round2(vatAmt), net: round2(after + vatAmt) };
}

function drawRows() {

      <td data-l="الصنف"><div class="sel"><select id="r${i}-item" data-r="${i}" data-k="item" aria-label="الصنف">${o}</select></div></td>

      <td data-l="السعر"><input id="r${i}-price" class="ctr" data-r="${i}" data-k="price" inputmode="decimal" placeholder="${esc(ph)}" aria-label="السعر" value="${esc(r.price)}" autocomplete="off"></td>
      <td class="rt" data-l="الإجمالي" id="r${i}-tot">${fmt(rowTotal(r))}</td>
      <td><button class="del" type="button" data-del-row="${i}" aria-label="حذف الصف">${ICON.trash}</button></td></tr>`;
  }).join('');
}

/* show/hide the "use booking deposit" box for the customer on the form */
function refreshDep() {
  const av = depAvail(), box = $('#depBox');
  if (!av) inv.dep = false;
  if (box) { box.hidden = !av; $('#dep').checked = inv.dep; $('#depTxt').textContent = `خصم عربون الحجز (متاح ${fmt(av)} جنيه)`; }
  calc();
}

function calc() {
  const t = totals(), dep = depApplied(t), due = round2(t.net - dep);
  inv.rows.forEach((r, i) => { const el = $('#r' + i + '-tot'); if (el) el.textContent = fmt(rowTotal(r)); });
  if (inv.mode === 'cash' || !inv.paidTouched || num(inv.paid) > due + 0.004) { inv.paid = String(due); $('#paid').value = inv.paid; }
  $('#depRow').hidden = !dep; $('#s-dep').textContent = money(dep);
  $('#s-sub').textContent = money(t.sub);
  $('#s-disc').textContent = fmt(t.dp) + ' %';
  $('#vatRow').hidden = !inv.vat; $('#s-vat').textContent = money(t.vatAmt);
  $('#s-net').textContent = money(t.net);
  $('#s-rem').textContent = money(Math.max(round2(due - num(inv.paid)), 0));
}

function onInput(e) {
  const t = e.target;
  if (t.dataset.f && t.type !== 'checkbox') { inv[t.dataset.f] = t.value; if (t.dataset.f === 'name' || t.dataset.f === 'phone') refreshDep(); return; }
  if (t.dataset.r !== undefined && t.dataset.k !== 'item') {
    const i = +t.dataset.r, r = inv.rows[i];
    t.value = cleanNum(t.value); r[t.dataset.k] = t.value;
    if (t.dataset.k === 'qty' && t.value !== '') {
      if (!r.itemId) { toast('اختر الصنف أولاً'); r.qty = ''; t.value = ''; }
      else {
        const av = available(i);
        if (num(r.qty) > av) { toast(`الكمية المتبقية المتاحة في المخزن هي ${fmt(av)} فقط!`); r.qty = String(av); t.value = r.qty; }
      }
    }
    calc(); return;
  }
  if (t.id === 'disc') {
    t.value = cleanNum(t.value); if (num(t.value) > 100) t.value = '100'; inv.disc = t.value; calc(); return;
  }
  if (t.id === 'paid') {
    t.value = cleanNum(t.value); inv.paidTouched = true;
    const t0 = totals(), due = round2(t0.net - depApplied(t0));
    if (num(t.value) > due + 0.004) { toast('المدفوع أكبر من المطلوب سداده'); t.value = String(due); }
    inv.paid = t.value; calc();
  }
}

function onChange(e) {
  const t = e.target;
  if (t.id === 'c-save') { inv.save = t.checked; return; }
  if (t.id === 'vat') { inv.vat = t.checked; calc(); return; }
  if (t.id === 'dep') { inv.dep = t.checked; calc(); return; }
  if (t.dataset.r !== undefined && t.dataset.k === 'item') {
    const i = +t.dataset.r, r = inv.rows[i];
    if (!t.value) { r.itemId = ''; r.price = ''; drawRows(); calc(); return; }
    r.itemId = t.value;
    if (available(i) <= 0) { toast('الصنف غير متوفر'); r.itemId = ''; r.qty = ''; r.price = ''; drawRows(); calc(); return; }
    r.price = '';
    if (num(r.qty) > available(i)) r.qty = String(available(i));
    drawRows(); calc();
  }
}

function onClick(e) {
  const d = e.target.closest('[data-del-row]');
  if (d) {
    inv.rows.splice(+d.dataset.delRow, 1);
    if (!inv.rows.length) inv.rows.push(blankRow());
    drawRows(); calc(); return;
  }
  if (e.target.closest('#addRow')) { inv.rows.push(blankRow()); drawRows(); calc(); return; }
  if (e.target.closest('#issue')) issueInvoice();
}

function issueInvoice() {
  const cash = inv.mode === 'cash', name = cash ? CASH_NAME : inv.name.trim();
  if (!name) { toast('اكتب اسم العميل'); $('#c-name').focus(); return; }
  const rows = inv.rows.filter(r => r.itemId && num(r.qty) > 0);
  if (!rows.length) { toast('أضف صنفاً واحداً على الأقل بكمية صحيحة'); return; }
  const need = {};
  rows.forEach(r => { need[r.itemId] = (need[r.itemId] || 0) + num(r.qty); });
  for (const id in need) { const it = itemById(id); if (!it || need[id] > it.qty + 1e-9) { toast(`الكمية المطلوبة من «${it ? it.name : 'الصنف'}» أكبر من المتاح`); return; } }
  const t = totals(), dep = depApplied(t), due = round2(t.net - dep), paid = cash ? t.net : Math.min(num(inv.paid), due);
  /* customer */
  let cid = cash ? null : inv.cid;
  const bks = dep > 0 ? openBookingsFor() : [];
  if (!cid && bks.length) cid = bks[0].customerId; /* the invoice belongs to the booking's registered customer */
  if (!cid && inv.save && !cash) {
    const phone = toLat(inv.phone).trim();
    let c = db.customers.find(x => (phone && x.phone === phone) || x.name === name);
    if (c) { c.name = name; if (phone) c.phone = phone; if (inv.addr.trim()) c.address = inv.addr.trim(); }
    else { c = { id: uid(), name, phone, address: inv.addr.trim() }; db.customers.push(c); }
    cid = c.id;
  }
  /* stock + invoice */
  const lines = rows.map(r => { const it = itemById(r.itemId); const price = unitPrice(r); return { itemId: it.id, name: it.name, unit: it.unit, qty: num(r.qty), price, cost: it.cost, total: round2(num(r.qty) * price) }; });
  lines.forEach(l => { const it = itemById(l.itemId); it.qty = round2(it.qty - l.qty); });
  db.seq += 1;
  const rec = {
    id: uid(), no: String(db.seq).padStart(4, '0'), date: new Date().toISOString(), customerId: cid || null,
    name, phone: toLat(inv.phone).trim(), addr: inv.addr.trim(), rows: lines, subtotal: t.sub, discPct: t.dp, discAmt: t.discAmt,
    vatOn: inv.vat, vatPct: db.settings.vat, vatAmt: t.vatAmt, net: t.net, paid: round2(paid), deposit: dep, kind: cash ? 'cash' : 'credit',
    remaining: round2(Math.max(due - paid, 0)),
  };
  if (dep > 0) { /* consume the customer's booking deposits, oldest first */
    let left = dep;
    bks.forEach(b => { const a = Math.min(left, bkOpen(b)); if (a > 0) { b.uses.push({ a: round2(a), inv: rec.no, date: rec.date }); left = round2(left - a); } });
  }
  db.invoices.push(rec); save();
  toast('تم إصدار الفاتورة وخصم الكميات من المخزن', 'ok');
  go('invDetail', { id: rec.id }, { replace: true });
}

/* ---------- Reports: today's movement, detailed report, shift closing (modelled on the printed reports) ---------- */
const custName = id => (db.customers.find(c => c.id === id) || {}).name || 'عميل';
const sumA = a => round2(a.reduce((s, x) => s + x.a, 0));

/* every money movement between two local dates (YYYY-MM-DD, inclusive), split into the report sections */
function ledger(from, to) {
  const inR = d => { const k = ymd(d); return k >= from && k <= to; };
  const L = { inn: [], out: [], tip: [], vat: [], gain: [], loss: [] };
  const P = (arr, d, w, a) => { if (a > 0) arr.push({ d, w, a: round2(a) }); };
  db.invoices.filter(i => inR(i.date)).forEach(i => {
    P(L.inn, i.date, 'فاتورة العميل: ' + i.name, i.paid);
    if (i.vatOn) P(L.vat, i.date, 'قيمة مضافة: ' + i.name, i.vatAmt);
    const pr = invProfit(i); /* recognised on the invoice total, whatever part was paid in cash */
    if (pr > 0) P(L.gain, i.date, 'ربح من: ' + i.name, pr); else if (pr < 0) P(L.loss, i.date, 'خسارة في: ' + i.name, -pr);
  });
  db.payments.filter(x => inR(x.date)).forEach(x => P(L.inn, x.date, 'تحصيل من العميل: ' + custName(x.customerId) + ((x.alloc || []).length ? ' (فاتورة ' + x.alloc.map(a => a.no).join('، ') + ')' : ''), x.amount));
  db.bookings.forEach(b => {
    if (inR(b.date)) P(L.inn, b.date, 'إيداع حجز - ' + b.desc, b.amount);
    b.refunds.filter(r => inR(r.date)).forEach(r => P(L.out, r.date, 'رد حجز - ' + b.desc + ': ' + b.name, r.a));
  });
  db.expenses.filter(e => inR(e.date)).forEach(e => P(e.cat === 'tip' ? L.tip : L.out, e.date, e.title, e.amount));
  db.spay.filter(x => inR(x.date)).forEach(x => P(L.out, x.date, (x.kind === 'settle' ? 'سداد دفعة للمورد: ' : 'دفعة لمورد: ') + ((supById(x.supplierId) || {}).name || x.name), x.amount));
  Object.values(L).forEach(a => a.sort((p, q) => p.d.localeCompare(q.d)));
  return L;
}

};

/* ----- printable paper ----- */
const repPhones = () => db.settings.phones.split('\n').map(x => x.trim()).filter(Boolean).join(' | ');
/* the letterhead shared by invoices and reports: logo on both sides, name, phones, address, thick rule */
const letterOf = () => { const S = db.settings; return { logo: S.logo, name: S.company.trim(), phones: repPhones(), addr: S.address.trim() }; };
function letterhead(o, style = 'A') {
  const lg = o.logo ? `<img src="${o.logo}" alt="">` : '<i></i>', lp = o.phones ? `<p class="ph">${esc(o.phones)}</p>` : '', la = o.addr ? `<p class="ad">${esc(o.addr)}</p>` : '';
  return `<header class="rh"><div>${lg}</div><div class="rh-c">${o.name ? `<h2>${esc(o.name)}</h2>` : ''}${style === 'A' ? lp + la : la + lp}</div><div>${lg}</div></header>`;
}
function repHeader(style, title, from, to) {
  const rng = `من: ${from} إلى: ${to}`;
  return letterhead(letterOf(), style) +
    (style === 'A' ? `<div class="rt"><h3>${title}</h3><p>${rng}</p></div>` : `<div class="rbox"><b>${title} | ${rng}</b></div>`);
}
const repRows = (list, sign) => list.map(e => `<tr><td><bdi dir="ltr">${ymd(e.d)}</bdi></td><td>${esc(e.w)}</td><td class="amt">${sign ? `<span>(${e.s})</span> ` : ''}<bdi>${fmt(e.a)}</bdi></td></tr>`).join('');
const repTh = '<thead><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th></tr></thead>';
/* style A: the total sits in the table's last row */
const secA = (title, list, label, total, o = {}) => `<section class="rsec"><h4>${title}</h4><table class="rtbl">${repTh}<tbody>${repRows(list, o.sign)}</tbody><tfoot><tr><td colspan="2" class="tl">${label}</td><td class="tv">${fmt(total)} ${o.unit || 'جنيه'}</td></tr></tfoot></table></section>`;
/* style B: dashed total box under the table */
const secB = (title, list, label, total) => `<section class="rsec b"><h4>${title}</h4><table class="rtbl">${repTh}<tbody>${list.map(e => `<tr><td><bdi dir="ltr">${ymd(e.d)}</bdi></td><td>${esc(e.w)}</td><td class="amt">${fmt(e.a)} جنيه</td></tr>`).join('')}</tbody></table><div class="dtot"><span>${label}:</span><b>${fmt(total)} جنيه</b></div></section>`;
const paper = (body, cls = '') => `<article class="paper${cls ? ' ' + cls : ''}">${db.settings.logo ? `<img class="wm" src="${db.settings.logo}" alt="">` : ''}<div class="pp">${body}</div></article>`;

/* the printed invoice (matches the reference sheet): client/date box, items table, two summary boxes.
   Right box: items total on top, cash paid below the rule. Left box: net required on top, remaining (credit) below. */
function invPaper(r) {
  const st = invSettled(r), left = invLeft(r);
  const who = esc(r.name) + (r.phone ? ' • ' + esc(r.phone) : '') + (r.addr ? ' • ' + esc(r.addr) : '');
  const ln = (a, b, c = '') => `<div class="l${c ? ' ' + c : ''}"><span>${a}</span><b>${b}</b></div>`;
  const top1 = ln('إجمالي الأصناف:', money(r.subtotal)) + (r.discPct ? ln(`الخصم (${fmt(r.discPct)}%):`, '− ' + money(r.discAmt)) : '') + (r.vatOn ? ln(`القيمة المضافة (${r.vatPct}%):`, money(r.vatAmt)) : '') + (r.deposit ? ln('العربون المخصوم:', money(r.deposit)) : '');
  return paper(letterhead(letterOf()) +
    `<div class="ibox"><span>اسم العميل: <b>${who}</b></span><span>فاتورة رقم: <b><bdi dir="ltr">${esc(r.no)}</bdi></b></span><span>التاريخ: <b><bdi dir="ltr">${ymd(r.date)}</bdi></b></span></div>` +
    `<table class="itbl"><colgroup><col style="width:34%"><col style="width:16%"><col style="width:25%"><col style="width:25%"></colgroup><thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>` +
    r.rows.map(l => `<tr><td class="nm">${esc(l.name)}</td><td>${fmt(l.qty)} ${esc(l.unit)}</td><td>${money(l.price)}</td><td>${money(l.total)}</td></tr>`).join('') + `</tbody></table>` +
    `<div class="isum"><div class="ic">${top1}${ln('المدفوع نقداً:', money(r.paid), 'big')}${st ? ln('تحصيلات لاحقة:', money(st), 'sub') : ''}</div><div class="ic">${ln('الصافي المطلوب:', money(r.net))}${ln('المتبقي (أجل):', money(left), 'big')}${st ? '<div class="l sub sp"><span>&nbsp;</span></div>' : ''}</div></div>`, 'inv');
}

/* customer statement: every invoice (debit) and everything paid at issue or collected later (credit), with a running balance */
function custLedger(c) {
  const mv = [];
  db.invoices.filter(i => i.customerId === c.id).forEach(i => {
    mv.push({ d: i.date, t: `فاتورة رقم ${i.no}`, debit: i.net, credit: 0 });
    if (i.deposit > 0) mv.push({ d: i.date, t: `عربون مخصوم — فاتورة ${i.no}`, debit: 0, credit: i.deposit });
    if (i.paid > 0) mv.push({ d: i.date, t: `مدفوع نقداً عند الإصدار — فاتورة ${i.no}`, debit: 0, credit: i.paid });
  });
  db.payments.filter(x => x.customerId === c.id).forEach(x => mv.push({ d: x.date, t: 'تحصيل' + ((x.alloc || []).length ? ' — فاتورة ' + x.alloc.map(a => a.no).join('، ') : ''), debit: 0, credit: x.amount }));
  mv.sort(byDate);
  let run = 0; mv.forEach(m => { run = round2(run + m.debit - m.credit); m.bal = run; });
  return mv;
}
function custPaper(c) {
  const mv = custLedger(c), debt = customerDebt(c.id), total = customerTotal(c.id), nInv = db.invoices.filter(i => i.customerId === c.id).length;
  const ln = (a, b, k = '') => `<div class="l${k ? ' ' + k : ''}"><span>${a}</span><b>${b}</b></div>`;
  const rows = mv.map(m => `<tr><td class="dt"><bdi dir="ltr">${ymd(m.d)}</bdi></td><td class="bn">${esc(m.t)}</td><td>${m.debit ? fmt(m.debit) : ''}</td><td>${m.credit ? fmt(m.credit) : ''}</td><td class="bl">${fmt(m.bal)}</td></tr>`).join('') || '<tr><td colspan="5">لا توجد حركة لهذا العميل.</td></tr>';
  return paper(letterhead(letterOf()) + `<div class="rt"><h3>كشف حساب عميل</h3></div>` +
    `<div class="ibox"><span>اسم العميل: <b>${esc(c.name)}</b></span>${c.phone ? `<span>الموبايل: <b><bdi dir="ltr">${esc(c.phone)}</bdi></b></span>` : ''}${c.address ? `<span>العنوان: <b>${esc(c.address)}</b></span>` : ''}<span>التاريخ: <b><bdi dir="ltr">${ymd(new Date())}</bdi></b></span></div>` +
    `<table class="itbl st"><colgroup><col style="width:17%"><col style="width:37%"><col style="width:15%"><col style="width:15%"><col style="width:16%"></colgroup><thead><tr><th>التاريخ</th><th>البيان</th><th>فواتير</th><th>مدفوع</th><th>الرصيد</th></tr></thead><tbody>${rows}</tbody></table>` +
    `<div class="isum"><div class="ic">${ln('إجمالي المشتريات:', money(total))}${ln('إجمالي المسدَّد:', money(round2(total - debt)), 'big')}</div><div class="ic">${ln('عدد الفواتير:', fmt(nInv))}${ln('المتبقي على العميل:', money(debt), 'big')}</div></div>`, 'inv');
}

function detailPaper(from, to) {
  const L = ledger(from, to), out = L.out.concat(L.tip).sort((a, b) => a.d.localeCompare(b.d));
  const inT = sumA(L.inn), outT = sumA(out);
  const mix = [...L.inn.map(e => ({ ...e, s: 'داخل' })), ...out.map(e => ({ ...e, s: 'خارج' }))];
  return paper(repHeader('A', 'تقرير تفصيلي للحركة', from, to) +
    secA('تفاصيل الداخل (التحصيلات)', L.inn, 'إجمالي تفاصيل الداخل (التحصيلات)', inT) +
    secA('تفاصيل الخارج (المصروفات)', out, 'إجمالي تفاصيل الخارج (المصروفات)', outT) +
    secA('تفاصيل القيمة المضافة', L.vat, 'إجمالي تفاصيل القيمة المضافة', sumA(L.vat)) +
    secA('تفاصيل الأرباح', L.gain, 'إجمالي تفاصيل الأرباح', sumA(L.gain)) +
    (L.loss.length ? secA('تفاصيل الخسائر', L.loss, 'إجمالي تفاصيل الخسائر', sumA(L.loss)) : '') +
    secA('تفاصيل صافي الخزينة', mix, 'إجمالي تفاصيل صافي الخزينة', round2(inT - outT), { sign: true }) +
    secA('تفاصيل الإجمالي الكلي للحركة', mix, 'إجمالي تفاصيل الإجمالي الكلي للحركة', round2(inT + outT), { sign: true, unit: 'حركة' }));
}

function shiftPaper(from, to, carry) {
  const L = ledger(from, to), inT = sumA(L.inn), outT = sumA(L.out), tipT = sumA(L.tip), net = round2(inT - outT - tipT - carry);
  return paper(repHeader('B', 'تقفيل وردية', from, to) +
    secB('تفاصيل الداخل (التحصيلات)', L.inn, 'إجمالي الداخل (التحصيلات)', inT) +
    secB('تفاصيل الخارج (المصروفات ودفعات الموردين)', L.out, 'إجمالي الخارج (المصروفات ودفعات الموردين)', outT) +
    secB('تفاصيل الإكراميات والخصومات', L.tip, 'إجمالي الإكراميات والخصومات', tipT) +
    secB('تفاصيل القيمة المضافة', L.vat, 'إجمالي القيمة المضافة', sumA(L.vat)) +
    secB('تفاصيل الأرباح', L.gain, 'إجمالي الأرباح', sumA(L.gain)) +
    secB('تفاصيل الخسائر', L.loss, 'إجمالي الخسائر', sumA(L.loss)) +
    `<div class="rsum"><div><span>إجمالي الداخل:</span><b>${fmt(inT)} جنيه</b></div><div><span>إجمالي الخارج:</span><b>${fmt(outT)} جنيه</b></div>` +
    (tipT ? `<div><span>الإكراميات والخصومات المدفوعة:</span><b>${fmt(tipT)} جنيه</b></div>` : '') +
    `<div><span>الخصم المرحَّل للوردية التانية:</span><b>${fmt(carry)} جنيه</b></div><div class="fin"><span>الإجمالي الصافي:</span><b>${fmt(net)} جنيه</b></div></div>`);
}

function printRep(name) { /* the PDF file name comes from the page title */
  const t0 = document.title; document.title = name;
  const done = () => { document.title = t0; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done); setTimeout(done, 60000);
  window.print();
}

/* both printable reports share the same date controls */
function repScreen(v, o) {
  const today = ymd(new Date());
  v.innerHTML = subHead(o.title) + `<div class="stack">
    <section class="panel noprint"><div class="form-grid">
      <div class="field"><label for="r-from">من تاريخ</label><input id="r-from" class="inp" type="date" value="${today}"></div>
      <div class="field"><label for="r-to">إلى تاريخ</label><input id="r-to" class="inp" type="date" value="${today}"></div>
      ${o.carry ? `<div class="field"><label for="r-carry">الخصم المرحَّل للوردية التانية (جنيه)</label><input id="r-carry" class="inp" inputmode="decimal" value="0" autocomplete="off"></div>` : ''}
    </div>
    <div class="actions" style="margin-top:14px"><button class="mini" data-q="today" type="button">اليوم</button><button class="mini" data-q="yday" type="button">أمس</button><button class="mini" data-q="month" type="button">هذا الشهر</button>
      ${window.claude ? '' : `<button class="btn" id="r-print" type="button">${ICON.printer}<span>طباعة / حفظ PDF</span></button>`}</div>
    ${window.claude ? '<p class="lbl" style="margin:12px 0 0">الطباعة وحفظ PDF متاحان من الملف الكامل للبرنامج.</p>' : ''}</section>
    <div id="paper"></div></div>`;
  const rng = () => { let a = $('#r-from').value || today, b = $('#r-to').value || today; if (a > b) [a, b] = [b, a]; return [a, b]; };
  const draw = () => { const [a, b] = rng(); $('#paper').innerHTML = o.make(a, b, o.carry ? num($('#r-carry').value) : 0); };
  ['r-from', 'r-to'].forEach(id => $('#' + id).addEventListener('change', draw));
  if (o.carry) $('#r-carry').addEventListener('input', e => { e.target.value = cleanNum(e.target.value); draw(); });
  $$('[data-q]', v).forEach(b => b.onclick = () => {
    const n = new Date(); let a = n, z = n;
    if (b.dataset.q === 'yday') a = z = new Date(n.getFullYear(), n.getMonth(), n.getDate() - 1);
    if (b.dataset.q === 'month') a = new Date(n.getFullYear(), n.getMonth(), 1);
    $('#r-from').value = ymd(a); $('#r-to').value = ymd(z); draw();
  });
  const pb = $('#r-print'); if (pb) pb.onclick = () => { const [a, b] = rng(); printRep(o.file(a, b)); };
  draw();
}
screens.repDetail = (p, v) => repScreen(v, { title: 'تقرير تفصيلي للحركة', make: detailPaper, file: (a, b) => `تقرير_تفصيلي_${a}_الى_${b}` });

screens.customers = (p, v) => {
  v.innerHTML = subHead('العملاء') + `<section class="panel">

    <thead><tr><th>الاسم</th><th>الموبايل</th><th>العنوان</th><th>إجمالي المشتريات</th><th>المتبقي</th><th>إجراء</th></tr></thead><tbody id="rows"></tbody></table></div></section>`;
  const draw = () => {

    $('#rows').innerHTML = list.map(c => { const d = customerDebt(c.id); return `<tr>
      <td><button class="lnk" data-cs="${c.id}">${esc(c.name)}</button></td><td class="muted">${esc(c.phone)}</td><td class="muted">${esc(c.address)}</td>

      <td><div class="actions" style="justify-content:center;gap:6px"><button class="mini" data-cs="${c.id}">كشف الحساب</button>${d ? `<button class="mini" data-pay="${c.id}">تحصيل</button>` : ''}<button class="del" data-rm="${c.id}" aria-label="حذف ${esc(c.name)}">${ICON.trash}</button></div></td></tr>`; }).join('')
      || `<tr><td colspan="6" class="empty">${db.customers.length ? 'لا توجد نتائج' : 'السجل فارغ. أضف عميلاً أو فعّل «حفظ في السجل» عند إصدار فاتورة.'}</td></tr>`;
    $$('[data-pay]', v).forEach(b => b.onclick = () => collectModal(b.dataset.pay, null, draw));
    $$('[data-cs]', v).forEach(b => b.onclick = () => go('custDetail', { id: b.dataset.cs }));
    $$('[data-rm]', v).forEach(b => b.onclick = async () => {
      const c = db.customers.find(x => x.id === b.dataset.rm);
      if (c && await confirmBox('حذف العميل', `سيُحذف «${c.name}» من السجل. تبقى فواتيره القديمة كما هي.`)) {
        db.customers = db.customers.filter(x => x.id !== c.id); save(); draw(); toast('تم حذف العميل', 'ok');
      }

  $('#addC').onclick = () => modal(`<h3>إضافة عميل</h3>
    <div class="field"><label for="m-name">اسم العميل</label><input id="m-name" class="inp" autocomplete="off"></div>

/* collect money from a customer: split over his open invoices (oldest first), or put on one given invoice */
function collectModal(cid, invId, done) {
  const c = db.customers.find(x => x.id === cid); if (!c) return;
  const inv = invId ? db.invoices.find(x => x.id === invId) : null;
  const max = inv ? Math.min(invLeft(inv), customerDebt(cid)) : customerDebt(cid);
  if (max <= 0) return toast('لا يوجد متبقٍ للتحصيل');
  modal(`<h3>تحصيل من ${esc(c.name)}</h3>
    <p>${inv ? `على الفاتورة رقم <b>${esc(inv.no)}</b>` : 'يُسجَّل على فواتير العميل المفتوحة من الأقدم إلى الأحدث'}</p><p>المتبقي: <b>${money(max)}</b></p>
    <div class="field"><label for="m-amt">المبلغ المحصّل (جنيه)</label><input id="m-amt" class="inp" inputmode="decimal" value="${max}" autocomplete="off"></div>
    <div class="actions"><button class="btn" data-ok>تسجيل التحصيل</button><button class="btn ghost" data-no>إلغاء</button></div>`, (d, close) => {
    $('#m-amt').addEventListener('input', e => { e.target.value = cleanNum(e.target.value); });
    $('[data-no]', d).onclick = close;
    $('[data-ok]', d).onclick = () => {
      const a = num($('#m-amt').value);
      if (a <= 0) return toast('اكتب مبلغاً أكبر من صفر');
      if (a > max + 0.004) return toast(inv ? 'المبلغ أكبر من المتبقي على الفاتورة' : 'المبلغ أكبر من المتبقي على العميل');
      const alloc = allocate(cid, a, invId);
      db.payments.push({ id: uid(), customerId: cid, amount: round2(a), date: new Date().toISOString(), alloc });
      save(); close(); toast(alloc.length ? `تم التحصيل وسُجّل على فاتورة ${alloc.map(x => x.no).join('، ')}` : 'تم تسجيل التحصيل', 'ok'); if (done) done();
    };
  });
}

/* facility data: name (blank by default), logo, VAT */
screens.setCo = (p, v) => {
  let logo = db.settings.logo;
  v.innerHTML = setHead() + `<section class="panel"><h2 class="panel-t">بيانات المنشأة</h2>
    <div class="form-grid">
      <div class="field"><label for="c-name">اسم المنشأة (يظهر أعلى الشاشة الرئيسية وفي الفاتورة والتقارير)</label><input id="c-name" class="inp" value="${esc(db.settings.company)}" placeholder="اكتب اسم المنشأة" maxlength="80" autocomplete="off"></div>

      <div class="field" style="grid-column:1/-1"><label for="c-phones">أرقام التواصل (سطر لكل رقم، ويمكن كتابة الاسم قبله مثل «المدير: 0100…»)</label><textarea id="c-phones" class="inp ta-s" rows="3" maxlength="400" autocomplete="off">${esc(db.settings.phones)}</textarea></div>
    </div>
    <div class="field" style="margin-top:16px"><span class="lbl">شعار المنشأة (اختياري) — يظهر على جانبي ترويسة الفاتورة والتقارير وكعلامة مائية خفيفة، وفي شاشة الخروج</span>
      <div class="logo-pick"><div class="logo-prev" id="c-prev"></div>
        <div class="actions"><label class="btn outline" for="c-file">اختيار صورة</label><input id="c-file" type="file" accept="image/*" class="sr"><button class="btn ghost" id="c-rm" type="button">إزالة الشعار</button></div></div></div>
    <div class="field" style="margin-top:16px"><span class="lbl">معاينة ترويسة الفاتورة</span><div class="paper pv inv" id="c-pv"></div></div>
    <div class="actions" style="margin-top:20px"><button class="btn" id="c-save" type="button">${ICON.save}<span>حفظ البيانات</span></button></div></section>`;
  const preview = () => letterhead({ logo, name: $('#c-name').value.trim() || 'اسم المنشأة', phones: toLat($('#c-phones').value).split('\n').map(x => x.trim()).filter(Boolean).join(' | '), addr: $('#c-addr').value.trim() });
  const paint = () => { $('#c-prev').innerHTML = logo ? `<img src="${logo}" alt="الشعار">` : `<span>بدون شعار</span>`; $('#c-rm').hidden = !logo; $('#c-pv').innerHTML = preview(); };
  paint(); ['#c-name', '#c-addr', '#c-phones'].forEach(q => $(q).addEventListener('input', paint));
  $('#c-rm').onclick = () => { logo = ''; paint(); };
  $('#c-file').onchange = e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    if (!/^image\//.test(f.type)) return toast('اختر ملف صورة');
    const r = new FileReader(); r.onerror = () => toast('تعذر قراءة الصورة');
    r.onload = () => {
      const im = new Image(); im.onerror = () => toast('تعذر قراءة الصورة');
      im.onload = () => {
        const w0 = im.naturalWidth || 300, h0 = im.naturalHeight || 300, k = Math.min(1, 520 / Math.max(w0, h0));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w0 * k)); c.height = Math.max(1, Math.round(h0 * k));

        let u = c.toDataURL('image/png');

  };
};

/* security: admin PIN (guards saving in Settings) + optional login PIN (set by the admin only) */
screens.setSec = (p, v) => {
  const S = db.settings;
  v.innerHTML = setHead() + `<div class="stack">
  <section class="panel"><h2 class="panel-t">الرقم السري للمسؤول <span class="badge ${S.adminPin ? 'on' : ''}">${S.adminPin ? 'مفعّل' : 'غير مفعّل'}</span></h2>
    <p class="lbl" style="margin:0 0 14px">يُطلب عند حفظ أي تغيير في الإعدادات (الأصناف والأسعار، بيانات المنشأة، مسح البيانات، الاسترجاع). من 4 إلى 8 أرقام.</p>
    <div class="form-grid">${S.adminPin ? pinInput('a-old', 'الرقم الحالي') : ''}${pinInput('a-new', S.adminPin ? 'الرقم الجديد' : 'الرقم السري')}${pinInput('a-new2', 'تأكيد الرقم')}</div>
    <div class="actions" style="margin-top:18px"><button class="btn" id="a-save" type="button">${ICON.save}<span>حفظ الرقم السري</span></button>${S.adminPin ? '<button class="btn danger" id="a-off" type="button">إلغاء الرقم السري</button>' : ''}</div></section>
  <section class="panel"><h2 class="panel-t">رقم سري الدخول (اختياري) <span class="badge ${S.loginPin ? 'on' : ''}">${S.loginPin ? 'مفعّل' : 'غير مفعّل'}</span></h2>
    <p class="lbl" style="margin:0 0 14px">${S.adminPin ? 'لو عيّنته، يطلبه التطبيق عند الفتح وبعد تسجيل الخروج. المسؤول فقط يقدر يضيفه أو يغيّره.' : 'عيّن الرقم السري للمسؤول أولاً، ثم يمكنك تعيين رقم دخول اختياري.'}</p>
    <div class="form-grid">${pinInput('l-new', 'رقم الدخول')}${pinInput('l-new2', 'تأكيد الرقم')}</div>
    <div class="actions" style="margin-top:18px"><button class="btn" id="l-save" type="button" ${S.adminPin ? '' : 'disabled'}>${ICON.save}<span>حفظ رقم الدخول</span></button>${S.loginPin ? '<button class="btn danger" id="l-off" type="button">إلغاء رقم الدخول</button>' : ''}</div></section>
  <p class="lbl note-s">ملاحظة: الحماية هنا على مستوى المتصفح، تمنع المستخدم العادي من الدخول أو التعديل، لكنها ليست تأمينًا كاملاً. التأمين الكامل (حسابات ومستخدمين على سيرفر) خطوة لاحقة.</p></div>`;
  bindPin(v);
  const ok4 = x => x.length >= 4;
  const checkOld = () => {
    const w = waitSecs('admin'); if (w) { toast(`محاولات كثيرة. حاول بعد ${w} ثانية`); return false; }
    if (!checkPin(cleanPin($('#a-old').value), S.adminPin)) { pinFail('admin'); toast('الرقم الحالي غير صحيح'); return false; }
    delete tries.admin; return true;
  };
  $('#a-save').onclick = () => {
    const n = cleanPin($('#a-new').value), n2 = cleanPin($('#a-new2').value);
    if (S.adminPin && !checkOld()) return;
    if (!ok4(n)) return toast('الرقم السري من 4 إلى 8 أرقام');
    if (n !== n2) return toast('تأكيد الرقم غير مطابق');
    if (S.loginPin && checkPin(n, S.loginPin)) return toast('يجب أن يختلف عن رقم الدخول');
    S.adminPin = makePin(n); adminUntil = Date.now() + 10 * 60 * 1000; save(); render(); toast('تم حفظ الرقم السري للمسؤول', 'ok');
  };
  if (S.adminPin) $('#a-off').onclick = async () => {
    if (!checkOld()) return;
    if (!await confirmBox('', 'إلغاء الرقم السري يجعل الإعدادات مفتوحة لأي مستخدم. هل تريد المتابعة؟', 'نعم')) return;
    S.adminPin = null; adminUntil = 0; save(); render(); toast('تم إلغاء الرقم السري للمسؤول', 'ok');
  };
  $('#l-save').onclick = async () => {
    const n = cleanPin($('#l-new').value), n2 = cleanPin($('#l-new2').value);
    if (!ok4(n)) return toast('رقم الدخول من 4 إلى 8 أرقام');
    if (n !== n2) return toast('تأكيد الرقم غير مطابق');
    if (checkPin(n, S.adminPin)) return toast('رقم الدخول يجب أن يختلف عن رقم المسؤول');
    if (!await requireAdmin()) return;
    S.loginPin = makePin(n); save(); render(); toast('تم حفظ رقم الدخول', 'ok');
  };
  if (S.loginPin) $('#l-off').onclick = async () => {
    if (!await requireAdmin()) return;
    S.loginPin = null; save(); render(); toast('تم إلغاء رقم الدخول', 'ok');
  };
};

/* backup & restore (copy / paste JSON) */
screens.setBackup = (p, v) => {
  v.innerHTML = setHead() + `<section class="panel"><h2 class="panel-t">نسخة احتياطية</h2>
    <p class="lbl" style="margin:0 0 10px">البيانات محفوظة في هذا المتصفح فقط. اضغط «نسخ نسخة احتياطية» واحفظ النص في ملف عندك. لاسترجاعه الصقه في الخانة واضغط «استرجاع». الأرقام السرية لا تدخل في النسخة.</p>
    <textarea id="b-json" class="inp" aria-label="النسخة الاحتياطية" spellcheck="false" placeholder="هنا تظهر النسخة الاحتياطية، أو الصق نسخة سابقة للاسترجاع"></textarea>
    <div class="actions" style="margin-top:12px"><button class="btn" id="b-copy" type="button">نسخ نسخة احتياطية</button><button class="btn outline" id="b-restore" type="button">استرجاع من النص</button></div></section>`;
  const ta = $('#b-json');
  $('#b-copy').onclick = async () => {
    if (!await requireAdmin('اكتب الرقم السري للمسؤول لعرض النسخة الاحتياطية')) return;
    const o = JSON.parse(JSON.stringify(db)); o.settings.adminPin = null; o.settings.loginPin = null; ta.value = JSON.stringify(o);
    try { await navigator.clipboard.writeText(ta.value); toast('تم نسخ النسخة الاحتياطية', 'ok'); } catch (e) { ta.focus(); ta.select(); toast('حدّد النص وانسخه يدوياً'); }
  };
  $('#b-restore').onclick = async () => {
    let o; try { o = JSON.parse(ta.value); } catch (e) { return toast('النص غير صالح'); }
    if (!o || !Array.isArray(o.items) || !Array.isArray(o.invoices) || !o.settings) return toast('هذا النص ليس نسخة احتياطية للتطبيق');
    if (!await confirmBox('', 'ستُستبدل البيانات الحالية بالنسخة الموجودة في الخانة. هل تريد المتابعة؟', 'نعم')) return;
    if (!await requireAdmin()) return;
    const keep = db.settings;
    db = o; ARR.forEach(k => { if (!Array.isArray(db[k])) db[k] = []; });
    db.expenses.forEach(e => { if (!e.cat) e.cat = 'misc'; }); db.invoices.forEach(i => { if (!i.kind) i.kind = 'credit'; if (i.deposit == null) i.deposit = 0; }); linkPayments(); db.seq = db.seq || db.invoices.length;
    db.settings = Object.assign({ vat: 14, theme: '', zoom: 100, logo: '', company: '', address: '', phones: '' }, o.settings, { adminPin: keep.adminPin, loginPin: keep.loginPin, nameVer: 3 }); delete db.settings.pin;
    if (db.settings.company === APP_NAME) db.settings.company = '';
    save(); applyTheme(); applyZoom(); toast('تم استرجاع البيانات', 'ok'); render();
  };
};

/* ---------- Logout / lock screen & boot ---------- */
function lockScreen() {
  stack = []; cur = { name: 'home', p: {} }; adminUntil = 0; closePop();
  const S = db.settings, locked = !!S.loginPin, t0 = Date.now(), v = $('#view');
  v.innerHTML = `<div class="lock${locked ? '' : ' tap'}"${locked ? '' : ' tabindex="0" role="button" aria-label="اضغط للدخول"'}><div class="lock-in">
    <div class="lock-logo">${S.logo ? `<img src="${S.logo}" alt="">` : ICON.company}</div>
    <h2 class="brand lock-name">${brandHTML()}</h2>
    ${locked ? `<div class="lock-form"><input id="l-pin" class="inp" type="password" inputmode="numeric" maxlength="8" placeholder="الرقم السري" aria-label="الرقم السري" autocomplete="off"><button class="btn lg" id="l-go" type="button">دخول</button></div>` : `<p class="hint">اضغط في أي مكان للدخول</p>`}
  </div></div>`;
  const box = $('.lock', v);
  const enter = () => { box.classList.add('leave'); setTimeout(render, 240); };
  if (locked) {
    const inp = $('#l-pin'), submit = () => {
      const w = waitSecs('login'); if (w) return toast(`محاولات كثيرة. حاول بعد ${w} ثانية`);
      if (checkPin(cleanPin(inp.value), S.loginPin)) { delete tries.login; enter(); } else { pinFail('login'); inp.value = ''; inp.focus(); toast('الرقم السري غير صحيح'); }
    };
    $('#l-go').onclick = submit; onEnter(inp, submit); inp.addEventListener('input', () => { inp.value = cleanPin(inp.value); }); inp.focus();
  } else {
    box.onclick = () => { if (Date.now() - t0 > 400) enter(); };
    box.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); } });
    box.focus();
  }
}

/* ---------- Developer section (Settings): locked by the designer's password; first tool = trial-link maker.
   The password is never stored: it only unlocks (AES-GCM) the private signing key that ships encrypted inside this page. ---------- */
const DEV = {"it": 250000, "s": "1MmHAhNEO6sEMzFLOjZCQA", "iv": "N27YDumby0DnPKHf", "c": "5XyX90NLjq7p0vP7Ho2LFDcT82t9ox1G0kaOC4pIrLQzmipCxRfK1w_87rptY-Gf9_Fz5JJ6flFmZixwP6yPFuJZW3eQF3lxDUluDggmkdZYA3QVbhrwbgYh84HR8pbAXbOfqMfgO36kef1zQ34YN8RJGMccKF62xrJF9JqegCHXbSCOQsDzuaFSEdT6IlPC4fE8iPg-rYsWed5UuRWzd6Dww7jACyd6lSwEc1LGwgt79j-o9J-2saC32odVhF7-mN5rRFLcmkpEOmmn4xw6O3tEez9pV7665bGQh6Yx"}, TRIAL_URL0 = 'https://minaelsaa3edy.github.io/test1/trial.html', LINK_DAYS = 7, TURL = 'accounts.dev.turl';
/* the page trial links open (set once after the trial page is hosted; kept on this device only) */
const trialUrl = () => { try { return localStorage.getItem(TURL) || TRIAL_URL0; } catch (e) { return TRIAL_URL0; } };
const cleanUrl = s => { s = String(s || '').trim().replace(/#.*$/, ''); return /^https?:\/\/[^\s]+$/i.test(s) ? s : ''; };
const saveUrl = u => { try { localStorage.setItem(TURL, u); } catch (e) { /* blocked */ } };
let devKey = null, devUntil = 0, devFail = 0, devLock = 0;
leaveHooks.push(() => { devKey = null; devUntil = 0; }); /* leaving Settings locks it again */
const devOpen = () => !!devKey && Date.now() < devUntil;
async function devUnlock(pw) { /* -> signing key, or throws when the password is wrong */
  const mat = await crypto.subtle.importKey('raw', TXT_E.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64u(DEV.s), iterations: DEV.it, hash: 'SHA-256' }, mat, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64u(DEV.iv) }, k, unb64u(DEV.c));
  return crypto.subtle.importKey('jwk', JSON.parse(TXT_D.decode(raw)), { name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign']);
}
const DLOG = 'accounts.dev.log'; /* what this browser created (kept apart from the business data and its backups) */
const dlogGet = () => { try { return JSON.parse(localStorage.getItem(DLOG)) || []; } catch (e) { return []; } };
const dlogSet = a => { try { localStorage.setItem(DLOG, JSON.stringify(a.slice(0, 60))); } catch (e) { /* blocked */ } };
const dAt = ms => dateTimeAr(new Date(ms).toISOString());
const dDesc = r => r.s === 'a' ? `${fmtDur(r.m)} — تنتهي ${dAt(r.c + r.m * 60000)}` : `${fmtDur(r.m)} من أول فتح — الرابط صالح للفتح حتى ${dAt(r.o)}`;
async function copyField(el, msg) { try { await navigator.clipboard.writeText(el.value); toast(msg, 'ok'); } catch (e) { el.focus(); el.select(); toast('حدّد النص وانسخه يدوياً'); } }

SET_TILES.push(['setDev', 'قسم المطوّر', 'dev']);
screens.setDev = (p, v) => devOpen() ? devPanel(v) : devGate(v);

function devGate(v) {
  v.innerHTML = setHead() + `<section class="panel"><h2 class="panel-t">قسم المطوّر</h2>
    <p class="lbl" style="margin:0 0 14px;line-height:1.9">هذا القسم خاص بالمصمم. اكتب كلمة المرور للدخول.</p>
    <div class="form-grid"><div class="field"><label for="d-pw">كلمة المرور</label><input id="d-pw" class="inp" type="password" dir="ltr" autocomplete="off"></div></div>
    <div class="actions" style="margin-top:16px"><button class="btn" id="d-go" type="button">دخول</button></div></section>`;
  const go = async () => {
    const pw = $('#d-pw').value, b = $('#d-go'); if (!pw) return;
    const wait = Math.ceil((devLock - Date.now()) / 1000); if (wait > 0) return toast(`حاول بعد ${wait} ثانية`);
    b.disabled = true; b.textContent = 'جارٍ التحقق…';
    try { devKey = await devUnlock(pw); devFail = 0; devUntil = Date.now() + 10 * 60 * 1000; render(); }
    catch (e) { if (++devFail >= 5) { devFail = 0; devLock = Date.now() + 30000; } toast('كلمة المرور غير صحيحة'); b.disabled = false; b.textContent = 'دخول'; $('#d-pw').value = ''; $('#d-pw').focus(); }
  };
  $('#d-go').onclick = go; onEnter($('#d-pw'), go);
}

function devPanel(v) {
  v.innerHTML = setHead() + `<div class="stack">
  <section class="panel"><h2 class="panel-t">إنشاء رابط تجربة</h2>
    <p class="lbl" style="margin:0 0 14px;line-height:1.9">الرابط يفتح نسخة تجريبية ببيانات وهمية، وتنتهي وتُمسح بياناتها بعد المدة التي تحددها. لكل رابط كود موقّع لا يمكن تعديله.</p>
    <div class="form-grid">
      <div class="field" style="grid-column:1/-1"><label for="d-url">رابط صفحة التجربة (الصفحة التي تفتح عند العميل)</label><input id="d-url" class="inp" dir="ltr" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://example.com/trial.html" value="${esc(trialUrl())}"></div>
      <div class="field"><label for="d-n">مدة التجربة</label><input id="d-n" class="inp" inputmode="decimal" value="3" autocomplete="off"></div>
      <div class="field"><label for="d-u">الوحدة</label><div class="sel"><select id="d-u"><option value="m">دقيقة</option><option value="h" selected>ساعة</option><option value="d">يوم</option></select></div></div>
      <div class="field" style="grid-column:1/-1"><label for="d-s">تبدأ المدة من</label><div class="sel"><select id="d-s"><option value="r">أول فتح للرابط (الرابط صالح للفتح ${LINK_DAYS} أيام)</option><option value="a">الآن (تنتهي في وقت ثابت حتى لو لم يُفتح الرابط)</option></select></div></div>
      <div class="field" style="grid-column:1/-1"><label for="d-note">ملاحظة اختيارية (اسم العميل — تظهر له في شريط التجربة)</label><input id="d-note" class="inp" maxlength="40" autocomplete="off"></div>
    </div>
    <div class="actions" style="margin-top:16px"><button class="btn" id="d-make" type="button">${ICON.plus}<span>إنشاء الرابط</span></button><button class="btn ghost" id="d-lock" type="button">قفل القسم</button></div>
    <div id="d-out" style="margin-top:18px"></div></section>
  <section class="panel"><h2 class="panel-t">الروابط التي أنشأتها من هذا الجهاز</h2>
    <div class="tbl-wrap"><table class="grid"><colgroup><col style="width:22%"><col style="width:34%"><col style="width:22%"><col style="width:22%"></colgroup><thead><tr><th>التاريخ</th><th>المدة</th><th>ملاحظة</th><th>إجراء</th></tr></thead><tbody id="d-log"></tbody></table></div>
    <p class="lbl" style="margin:12px 0 0;line-height:1.9">السجل للمتابعة فقط؛ لا يمكن إلغاء رابط بعد إرساله، وينتهي بانتهاء مدته.</p></section></div>`;
  const out = $('#d-out'), keep = () => { devUntil = Date.now() + 10 * 60 * 1000; };
  const drawLog = () => {
    const L = dlogGet();
    $('#d-log').innerHTML = L.map((r, i) => `<tr><td class="muted">${dAt(r.c)}</td><td>${esc(dDesc(r))}</td><td>${esc(r.n || '—')}</td><td><div class="actions" style="justify-content:center;gap:6px"><button class="mini" data-cp="${i}">نسخ الرابط</button><button class="del" data-dl="${i}" aria-label="حذف من السجل">${ICON.trash}</button></div></td></tr>`).join('')
      || '<tr><td colspan="4" class="empty">لم تنشئ روابط بعد.</td></tr>';
    $$('[data-cp]', v).forEach(b => b.onclick = async () => { const r = L[+b.dataset.cp]; try { await navigator.clipboard.writeText(`${trialUrl()}#t=${r.t}`); toast('تم نسخ الرابط', 'ok'); } catch (e) { toast('تعذر النسخ تلقائياً'); } });
    $$('[data-dl]', v).forEach(b => b.onclick = () => { L.splice(+b.dataset.dl, 1); dlogSet(L); drawLog(); });
  };
  const show = r => {
    const link = `${trialUrl()}#t=${r.t}`;
    out.innerHTML = `<div class="note" style="display:block"><b>تم إنشاء الرابط</b><br>${esc(dDesc(r))}${r.n ? `<br>الملاحظة: ${esc(r.n)}` : ''}</div>
      <div class="field" style="margin-top:12px"><label for="d-link">رابط التجربة</label><div class="dev-row"><input id="d-link" class="inp" readonly dir="ltr" value="${esc(link)}"><button class="btn" id="d-cl" type="button">نسخ الرابط</button></div></div>
      <div class="field" style="margin-top:12px"><label for="d-code">الكود (لو الرابط ما سجّلش الكود تلقائياً، يلصقه العميل في شاشة التجربة)</label><div class="dev-row"><input id="d-code" class="inp" readonly dir="ltr" value="${esc(r.t)}"><button class="btn outline" id="d-cc" type="button">نسخ الكود</button></div></div>
      ${/claude\.ai/i.test(link) ? '<p class="lbl" style="margin:12px 0 0;line-height:1.9">تذكير: صفحة التجربة نفسها لازم تكون مشاركة مع من سيفتح الرابط (من قائمة المشاركة في الصفحة).</p>' : ''}`;
    $('#d-cl').onclick = () => copyField($('#d-link'), 'تم نسخ الرابط'); $('#d-cc').onclick = () => copyField($('#d-code'), 'تم نسخ الكود');
  };
  $('#d-url').onchange = () => { const u = cleanUrl($('#d-url').value); if (!u) return toast('اكتب الرابط كاملاً يبدأ بـ https://'); saveUrl(u); $('#d-url').value = u; toast('تم حفظ رابط صفحة التجربة', 'ok'); drawLog(); };
  $('#d-make').onclick = async () => {
    if (!devOpen()) return render();
    const tu = cleanUrl($('#d-url').value); if (!tu) return toast('اكتب رابط صفحة التجربة كاملاً يبدأ بـ https://'); saveUrl(tu);
    const n = num($('#d-n').value), mins = Math.round(n * { m: 1, h: 60, d: 1440 }[$('#d-u').value]);
    if (!(mins >= 5)) return toast('أقل مدة للتجربة 5 دقائق');
    if (mins > 43200) return toast('أقصى مدة للتجربة 30 يوماً');
    const now = Date.now(), s = $('#d-s').value, note = $('#d-note').value.trim().slice(0, 40);
    const pl = { v: 1, i: b64u(crypto.getRandomValues(new Uint8Array(6))), c: now, m: mins, s, o: s === 'r' ? now + LINK_DAYS * 864e5 : 0, n: note };
    try {
      const pb = TXT_E.encode(JSON.stringify(pl)), sig = new Uint8Array(await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, devKey, pb));
      const r = Object.assign({ t: b64u(pb) + '.' + b64u(sig) }, pl); const L = dlogGet(); L.unshift(r); dlogSet(L);
      keep(); show(r); drawLog(); toast('تم إنشاء رابط التجربة', 'ok');
    } catch (e) { toast('تعذر إنشاء الرابط'); }
  };
  $('#d-lock').onclick = () => { devKey = null; devUntil = 0; render(); };
  drawLog();
}

/* ---------- Boot ---------- */
applyZoom();
if (db.settings.loginPin) lockScreen(); else render();

})();
