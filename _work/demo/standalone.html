r the password, and turn the alert on here. (Needs iOS 16.4 or newer)","كلمة مرور المطوّر (مرة واحدة على الجهاز ده)":"Developer password (once on this device)","آخر إشعار وصل للجهاز بعد حوالي {1} ثانية من إرساله.":"The last notice reached the device about {1} seconds after it was sent.","علشان كده السيرفر بيبعت المنبّه قبل ميعاده بدقيقة علشان يوصلك في وقته.":"So the server sends the alarm one minute before its time, so that it reaches you on time.","علشان كده السيرفر بيبعت المنبّه قبل ميعاده بدقيقتين علشان يوصلك في وقته.":"So the server sends the alarm two minutes before its time, so that it reaches you on time.","لتغيير سعر البيع أو الشراء اضغط زر التعديل جنب الصنف.":"To change the sale or purchase price, tap the edit button next to the item.","على الموبايل: سيب صفحة البرنامج مفتوحة قدامك وفعّل «إبقاء الشاشة مفتوحة» تحت، لأن المتصفح بيوقّف الصفحة لما الشاشة تتقفل. والأفضل على أي جهاز (آيفون أو أندرويد أو لابتوب أو كمبيوتر) تفعّل «تنبيه حتى لو الشاشة مقفولة» تحت: المنبّه بيوصلك كإشعار عادي زي الواتساب بصوت الإشعارات، وتدوس عليه يفتح البرنامج على شاشة المنبّه (وعلى الآيفون اتأكد إن مفتاح الصامت مقفول).":"On a phone: keep the program page open in front of you and turn on “Keep the screen on” below, because the browser pauses the page when the screen locks. On any device (iPhone, Android, laptop or computer) it is better to turn on “Alert even when the screen is locked” below: the alarm reaches you as an ordinary notification like WhatsApp, with the notification sound, and tapping it opens the program on the alarm screen (on an iPhone make sure the silent switch is off).","المتصفح ما قدرش يشغّل خدمة التنبيهات هنا. لو إنت في نافذة تصفح خاص (Private / Incognito) افتح البرنامج في نافذة عادية.":"The browser could not start the alerts service here. If you are in a private window (Private / Incognito), open the program in a normal window.","خدمة الإشعارات بتاعة المتصفح مش متاحة دلوقتي. جرّب تاني. ولو بتستخدم Brave فعّل من إعداداته «Use Google services for push messaging».":" خزينة / رأس المال":"Total in from the drawer / safe / capital","داخل من الدرج اليوم":"In from the drawer today","داخل من الخزينة اليوم":"In from the safe today","داخل من رأس المال اليوم":"In from capital today","تسجيل مبلغ داخل":"Record an amount put in","مبلغ دخل إلى الدرج وهو ليس بيعاً ولا تحصيلاً: من الدرج أو من الخزينة أو من رأس المال. يظهر في قسم مستقل في حركة اليوم والتقارير ويدخل في نقدية اليوم وصافي الخزينة، ولا يدخل في المبيعات ولا الأرباح.":"An amount that came into the drawer and is not a sale or a collection: from the drawer, from the safe, or from capital. It shows as its own section in today's movement and the reports, and counts in today's cash and the net cash, but not in sales or profit.","داخل اليوم":"In today","داخل الشهر":"In this month","لا توجد مبالغ داخلة مسجلة.":"No amounts put in yet.","هذا المبلغ في فترة مقفولة ولا يمكن حذفه":"This amount is in a closed period and cannot be deleted.","حذف المبلغ":"Delete amount","سيُحذف هذا المبلغ من السجل ومن نقدية اليوم.":"This amount will be removed from the log and from today's cash.","اختر المصدر":"Choose the source","مسح الداخل للدرج (درج / خزينة / رأس مال)":"Clear cash put in (drawer / safe / capital)",داخل_للدرج:"Cash_in","تقرير الداخل للدرج":"Cash put in report","لا يوجد داخل من الدرج أو الخزينة أو رأس المال اليوم.":"Nothing put in today from the drawer, the safe or capital.","من البنك":"From the bank","داخل من البنك":"In from the bank","داخل من البنك اليوم":"In from the bank today","الدرج (نقدي)":"Drawer (cash)","حساب بنكي":"Bank account","يُدفع من":"Paid from","دخل في":"Came in to","الداخل حسب المكان":"Money in by place","مبلغ دخل وهو ليس بيعاً ولا تحصيلاً. «المصدر»: من الدرج أو من الخزينة أو رأس المال أو من البنك. «دخل في»: الدرج (نقدي) أو إنستا باي أو محفظة أو حساب بنكي. يظهر في قسم مستقل في حركة اليوم والتقارير ويدخل في صافي الخزينة، ولا يدخل في المبيعات ولا الأرباح. وتقدر تصرف منه من «المصروفات» (يُدفع من).":"An amount that came in and is not a sale or a collection. «Source»: from the drawer, from the safe, capital or from the bank. «Came in to»: the drawer (cash), InstaPay, a wallet or a bank account. It shows as its own section in today's movement and the reports and counts in the net cash, but not in sales or profit. You can spend from it in «Expenses» (Paid from).","ملاحظة (الغرض منه)":"Note (what it is for)","خرج {1}":"Out {1}","اضغط على أي كارت لمعرفة مصدر المبلغ الداخل.":"Press a card to see where the money came from.","لا توجد فلوس داخلة في هذا المكان في هذا اليوم.":"No money came in to this place on this day.","خرج منه":"Paid out of it","إجمالي الخارج":"Total out",الباقي:"Left","تفاصيل الداخل في {1}":"Money in to {1}","إجمالي الداخل":"Total in","سحب أو تحويل بين الحسابات":"Withdrawal or transfer between accounts","حذف سحب / تحويل":"Withdrawal / transfer deleted","تصفية الأرصدة وتسليمها للإدارة":"Balances settled and handed over to the management","الإدارة (صاحب المنشأة)":"Management (the owner)","الرصيد حسب المكان":"Balance by place","رصيد كل مكان تراكمي: كل ما دخل فيه (تحصيلات، إيداعات، مبالغ مسجلة هنا، تحويلات) ناقص كل ما خرج منه (مصروفات، تحويلات، تسليم للإدارة). تقدر تسحب جزء وتسيب الباقي زي ما هو. رصيد الدرج بعد أي جرد بيبدأ من آخر جرد (الفعلي في الدرج). اضغط على أي كارت لمعرفة مصدر الفلوس في اليوم المختار.":"Each place keeps a running balance: everything that came into it (collections, deposits, amounts recorded here, transfers) minus everything that went out of it (expenses, transfers, handovers to the management). You can withdraw part of it and leave the rest as it is. After a count, the drawer balance starts from the last count (what was really in the drawer). Press a card to see where the money came from on the chosen day.","مبلغ دخل وهو ليس بيعاً ولا تحصيلاً. «المصدر»: من الدرج أو من الخزينة أو رأس المال أو من البنك. «دخل في»: الدرج (نقدي) أو إنستا باي أو محفظة أو حساب بنكي. يزيد رصيد المكان ويظهر في قسم مستقل في حركة اليوم والتقارير، ولا يدخل في المبيعات ولا الأرباح. وتقدر تصرف منه من «المصروفات» (يُدفع من).":`Money that came in and is neither a sale nor a collection. "Source": from the drawer, from the safe, capital, or from the bank. "Went into": the drawer (cash), InstaPay, a wallet, or a bank account. It raises the balance of that place and shows in its own section in today's movement and the reports; it is not part of sales or profit. You can spend from it in "Expenses" (Paid from).`,"سحب أو تحويل":"Withdraw or transfer","اسحب جزء من رصيد أي مكان وسيب الباقي زي ما هو، أو حوّل بين الأماكن (مثلاً من إنستا باي للدرج)، أو سلّم للإدارة (صاحب المنشأة). التحويل بين الأماكن مش مصروف ولا ربح، وبيتسجل في حركة اليوم وجرد الدرج.":"Withdraw part of the balance of any place and leave the rest as it is, move money between places (for example from InstaPay to the drawer), or hand it over to the management (the owner). A transfer between places is not an expense or a profit, and it is recorded in today's movement and the drawer count.","المتاح في المكان المختار:":"Available in the chosen place:",تنفيذ:"Do it","الرصيد كله":"The whole balance","تصفية كل الأرصدة وتسليمها للإدارة":"Settle all balances and hand them over to the management","لما الموظف أو المحاسب يسلّم: بيخرج كل الأرصدة (الدرج، إنستا باي، المحفظة، الحساب البنكي) لصاحب المنشأة أو الإدارة وتبقى كل الأماكن صفر. بيتسجل تسليم لكل مكان فيه رصيد، ويظهر في حركة اليوم والتقارير وجرد الدرج.":"When the employee or accountant hands over: every balance (drawer, InstaPay, wallet, bank account) goes out to the owner or the management and every place is left at zero. One handover is recorded for each place that has a balance, and it shows in today's movement, the reports and the drawer count.","المستلم (صاحب المنشأة / الإدارة)":"Receiver (the owner / management)","تصفية وتسليم الكل":"Settle and hand over everything","سجل السحب والتحويل والتسليم":"Withdrawals, transfers and handovers","المستلم / ملاحظة":"Receiver / note","إجمالي الأرصدة":"Total balances","الرصيد الآن":"Balance now","لا يوجد رصيد في هذا المكان":"There is no balance in this place","إجمالي ما سيُ
