<style>
:root{--bg:#f3f5f7;--card:#fff;--fg:#14202b;--mut:#5b6b79;--bd:#cfd8df;--ac:#0f6b57;--acf:#fff;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0e1419;--card:#172029;--fg:#e8eef3;--mut:#9aabb9;--bd:#2a3744;--ac:#2fb394;--acf:#06201a;--err:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:26px 22px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.ic{width:46px;height:46px;margin:0 auto 10px;color:var(--ac)}
h1{font-size:19px;margin:0 0 6px}
p{margin:0 0 14px;color:var(--mut);font-size:14px}
label{display:block;text-align:start;font-size:13px;color:var(--mut);margin:8px 0 6px}
input[type=text],input[type=password],textarea{width:100%;font:16px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);direction:ltr;text-align:left}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
.rm{display:flex;gap:8px;align-items:center;justify-content:flex-start;margin:12px 0;font-size:14px;color:var(--mut)}
.rm input{width:18px;height:18px;accent-color:var(--ac)}
button{width:100%;font-weight:700;font-size:16px;font-family:inherit;padding:14px;border:0;border-radius:10px;background:var(--ac);color:var(--acf);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--err);font-size:14px;min-height:22px;margin:10px 0 0}
</style></head><body>

async function decrypt(kb) { /* content key -> page html (throws when the key is wrong) */

  return new TextDecoder().decode(await S.decrypt({ name: 'AES-GCM', iv: u8(D.iv) }, key, u8(D.ct)));
}
async function unwrap(secret, slot) { /* typed code / password -> content key */
  const mat = await S.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey']);
  const wk = await S.deriveKey({ name: 'PBKDF2', salt: u8(slot.s), iterations: slot.it, hash: 'SHA-256' }, mat, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

function jsonp(base, params, ms) {

    const cb = '__j' + Math.random().toString(36).slice(2), s = document.createElement('script'); let done = false, t = 0;
    const end = (ok, v) => { if (done) return; done = true; clearTimeout(t); try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); ok ? res(v) : rej(v); };
    t = setTimeout(() => end(false, new Error('timeout')), ms || 9000);
    window[cb] = v => end(true, v); s.onerror = () => end(false, new Error('net'));
    s.src = base + (base.indexOf('?') < 0 ? '?' : '&') + new URLSearchParams(Object.assign({}, params, { cb, _: Date.now() })).toString();

}
function launch(html) { document.open(); document.write(html); document.close(); }
function hashParams() { try { return new URLSearchParams(location.hash.replace(/^#/, '')); } catch (e) { return new URLSearchParams(''); } }

async function withKey(kb, remember) {
  const html = await decrypt(kb);
  if (remember) LS.set(CK, b64u(kb));
  launch(html);
}
async function byCode(raw, remember) {
  const c = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (c.length < 8) throw new Error('short');
  const slot = (D.slots || []).find(x => x.id === c.slice(0, 4));
  if (!slot) throw new Error('unknown');
  await withKey(await unwrap(c.slice(4), slot), remember);
}
async function byPass(pw, remember) {
  if (!pw || !D.pass) throw new Error('short');
  await withKey(await unwrap(pw, D.pass), remember);
}

/* short trial code (XXXX-XXXX-XXXX-XXXX): its first 4 letters pick a slot on the trial-code server (or in trial-codes.json next to this page); the rest opens it.
   The slot holds the signed trial token + this page's key, so the code carries nothing readable. */
async function byTrial(raw) {
  const c = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (c.length !== 16) throw new Error('short');
  const id = c.slice(0, 4); let slot = null, reached = false;
  if (D.srv) { try { const r = await jsonp(D.srv, { a: 'slot', id }, 10000); if (r && r.ok) { reached = true; slot = r.slot || null; } } catch (e) { /* server unreachable: try the published file */ } }
  if (!slot) { try { const r = await fetch('trial-codes.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) { reached = true; slot = (((await r.json()) || {}).slots || []).find(x => x.id === id) || null; } } catch (e) { /* offline */ } }
  if (!slot) throw new Error(reached ? 'unknown' : 'net');
  const o = JSON.parse(new TextDecoder().decode(await unwrap(c.slice(4), slot))); /* throws when the code is wrong */
  history.replaceState(null, '', location.pathname + location.search + '#t=' + o.t);
  await withKey(u8(o.k), true);
}
function form() {
  const f = $('#f');
  if (D.kind === 'trial') {
    f.innerHTML = '<label for="i">كود التجربة أو الرابط</label><textarea id="i" rows="2" spellcheck="false" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX-XXXX"></textarea><div style="height:12px"></div><button id="b" type="button">فتح</button>';
    $('#b').onclick = () => {
      const v = $('#i').value, t = /(?:^|[#&?\s])t=([A-Za-z0-9_.-]+)/.exec(v), k = /(?:^|[#&?\s])k=([A-Za-z0-9_-]+)/.exec(v), cm = /(?:^|[#&?\s])c=([A-Za-z0-9-]+)/.exec(v);
      if (t && k) { location.hash = 't=' + t[1] + '&k=' + k[1]; location.reload(); return; }
      const c = (cm ? cm[1] : v).toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (c.length === 16) { location.hash = 'c=' + c; location.reload(); return; }
      say('الكود غير مكتمل. اكتبه كاملاً كما أرسله المصمم، أو الصق الرابط كاملاً.');
    };
    return;
  }
  const pw = D.kind === 'dev';
  f.innerHTML = '<label for="i">' + (pw ? 'كلمة المرور' : 'كود الدخول') + '</label><input id="i" type="' + (pw ? 'password' : 'text') + '" autocomplete="off" autocapitalize="characters" spellcheck="false"><label class="rm"><input type="checkbox" id="r"' + (pw ? '' : ' checked') + '><span>تذكر هذا الجهاز</span></label><button id="b" type="button">دخول</button>';
  const go = async () => {
    const v = $('#i').value; if (!v.trim()) return;
    const b = $('#b'); b.disabled = true; b.textContent = 'جارٍ التحقق…'; say('');
    try { await (pw ? byPass(v, $('#r').checked) : byCode(v, $('#r').checked)); }
    catch (e) { b.disabled = false; b.textContent = 'دخول'; say(pw ? 'كلمة المرور غير صحيحة.' : 'الكود غير صحيح.'); $('#i').focus(); }
  };
  $('#b').onclick = go; $('#i').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#i').focus();
}

(async function start() {
  if (!S) { $('#f').innerHTML = ''; return say('افتح هذه الصفحة من رابط https في متصفح حديث.'); }
  const P = hashParams();
  try {
    if (P.get('k') && D.kind === 'trial') { await withKey(u8(P.get('k')), true); return; }
  } catch (e) { say('رابط التجربة غير صالح أو ناقص. اطلب رابطاً جديداً من المصمم.'); return form(); }
  if (D.kind === 'trial' && P.get('c')) {
    say('جارٍ التحقق من الكود…');
    try { await byTrial(P.get('c')); return; }
    catch (e) { say(e.message === 'net' ? 'تعذر الاتصال. تأكد من الإنترنت وحاول مرة أخرى.' : 'الكود غير صحيح، أو لم يُفعَّل بعد. لو أرسله لك المصمم الآن انتظر دقيقة وحاول مرة أخرى.'); return form(); }
  }
  const ck = LS.get(CK);
  if (ck) { try { await withKey(u8(ck), false); return; } catch (e) { LS.del(CK); } }
  if (D.kind === 'customer' && P.get('c')) { try { await byCode(P.get('c'), true); return; } catch (e) { say('الكود غير صحيح.'); } }
  form();
})();
})();
</script></body></html>
